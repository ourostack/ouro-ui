<!doctype html>
<!--
  An MCP Apps host, as small as the spec allows, for the host harness (registry/ouro/e2e/mcp-app-host/). It reads the
  view from the example server's ui:// resource, frames it in a sandboxed iframe under MCP Apps' default content
  security policy (plus the image origin the resource declares), and plays the host's side of the protocol:
  ui/initialize, the tool's input and result, size changes, and the view's tools/call, which it passes to the server.
  window.mcp(method, params) is the test's connection to the server; window.hostLog holds every message the view sent.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MCP Apps host harness</title>
    <style>
      :root { color-scheme: light; --bg: #f4f2ee; --fg: #1f1d1a; --muted: #6b665e; }
      :root[data-theme="dark"] { color-scheme: dark; --bg: #1c1b19; --fg: #f1efe9; --muted: #a39d93; }
      body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
      p { margin: 0 0 12px; }
      .who { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
      iframe { display: block; width: 100%; height: 160px; border: 0; }
    </style>
  </head>
  <body>
    <p class="who">Agent</p>
    <p id="said">…</p>
    <iframe id="view" title="Recipe card" sandbox="allow-scripts allow-forms"></iframe>
    <script type="module">
      const theme = new URLSearchParams(location.search).get("theme") === "dark" ? "dark" : "light";
      document.documentElement.dataset.theme = theme;
      const frame = document.getElementById("view");
      const send = (message) => frame.contentWindow.postMessage({ jsonrpc: "2.0", ...message }, "*");
      const hostLog = (window.hostLog = []);
      const answers = new Map();
      let next = 0;

      /** A request from the host to the view, for the test: settles with the view's response. */
      window.hostRequest = (method, params) =>
        new Promise((resolve) => {
          const id = `host-${++next}`;
          answers.set(id, resolve);
          send({ id, method, params });
        });

      const { tools } = await window.mcp("tools/list", {});
      const tool = tools.find((t) => t.name === "show_recipe");
      const args = { recipe: "rcp_lemon_orzo" };
      const result = window.mcp("tools/call", { name: tool.name, arguments: args });
      const [resource] = (await window.mcp("resources/read", { uri: tool._meta.ui.resourceUri })).contents;
      const images = ["data:", ...(resource._meta?.ui?.csp?.resourceDomains ?? [])].join(" ");
      const csp = `default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src ${images}; media-src data:; connect-src 'none'`;
      frame.srcdoc = resource.text.replace("<head>", `<head><meta http-equiv="Content-Security-Policy" content="${csp}">`);

      window.addEventListener("message", async (event) => {
        if (event.source !== frame.contentWindow) return;
        const m = event.data;
        hostLog.push(m);
        if (m.method === undefined) return answers.get(m.id)?.(m);
        const reply = (body) => m.id !== undefined && send({ id: m.id, ...body });
        switch (m.method) {
          case "ui/initialize":
            return reply({
              result: {
                protocolVersion: "2026-01-26",
                hostInfo: { name: "ouro-host-harness", version: "1.0.0" },
                hostCapabilities: { openLinks: {}, serverTools: {} },
                hostContext: { theme, displayMode: "inline", platform: "mobile", containerDimensions: { maxHeight: 4000 } },
              },
            });
          case "ui/notifications/initialized": {
            send({ method: "ui/notifications/tool-input", params: { arguments: args } });
            const done = await result;
            document.getElementById("said").textContent = done.content[0].text;
            return send({ method: "ui/notifications/tool-result", params: done });
          }
          case "ui/notifications/size-changed":
            frame.style.height = `${m.params.height}px`;
            return;
          case "tools/call":
            try {
              return reply({ result: await window.mcp("tools/call", m.params) });
            } catch (e) {
              return reply({ error: { code: -32000, message: String(e.message) } });
            }
          case "ui/open-link":
          case "ui/update-model-context":
            return reply({ result: {} });
          default:
            return reply({ error: { code: -32601, message: `${m.method} is not a method this host has.` } });
        }
      });
    </script>
  </body>
</html>
