<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" font-family="inherit">
  <title>The Nautilus, a shipwright's plan</title>
  <!-- Original drawing for Ouro HX after Verne alone (manifest.json): the side plan of the
       Nautilus that the shipyard fills in, one part for each job. The same spindle as
       nautilus.svg (232 feet by 26, eight to one), drawn as a shipwright's plan: construction
       lines and frames, the two hulls joined by T-shaped irons (no rivets: Verne says it holds
       "not by the closeness of its rivets"), the steel spur, the low platform; the saloon's two
       oblong crystal panels bound in copper, and the steersman's cage with its lenticular glass;
       the engine room aft, its electric cells and great magnets turning the screw's axle; the
       lantern's cage aft on the platform, its beam forward; the organ in the saloon. No tower,
       no fins, no eye-shaped window. Each part is a group, data-part, that the page shows when its
       job is ticked; colour comes from the theme (chapters.css). -->
  <defs>
    <pattern id="bp-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" stroke-width="0.8" />
    </pattern>
  </defs>
  <rect class="bp-paper" width="720" height="240" stroke="none" />
  <rect class="bp-grid" width="720" height="240" fill="url(#bp-grid)" stroke="none" />
  <g class="bp-sea" stroke="none">
    <path d="M0 108 C40 104 80 112 120 108 S200 104 240 108 S320 112 360 108 S440 104 480 108 S560 112 600 108 S680 104 720 108 V240 H0 Z" />
