      <text x="24" y="28" font-size="12" letter-spacing="3">NAUTILUS</text>
      <text x="24" y="43" font-size="9">SIDE PLAN · SHEET 1 OF 1</text>
    </g>
    <path d="M488 206 H700 V232 H488 Z M488 219 H700 M600 206 V232" />
    <g fill="currentColor" stroke="none" font-size="8" letter-spacing="1">
      <text x="494" y="215.5">MOBILIS IN MOBILI</text>
      <text x="606" y="215.5">C. NEMO, MASTER</text>
      <text x="494" y="228.5">A FAR ISLAND</text>
      <text x="606" y="228.5">SCALE 1:240</text>
    </g>
  </g>
