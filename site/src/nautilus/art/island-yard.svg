    <rect x="96" y="93" width="7" height="4" rx="2" stroke-width="1.2" />
    <path d="M76 85.5 L78 80.5 H87 L89 85.5" stroke-width="1.3" />
    <rect class="yd-light" x="79.5" y="81.8" width="6" height="2.8" rx="1.4" stroke-width="0.9" />
