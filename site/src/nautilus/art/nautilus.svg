<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 110">
  <title>The Nautilus, in profile</title>
  <!-- Original drawing for Ouro HX after Verne alone (manifest.json): an elongated cylinder with
       conical ends, 232 feet by 26 (eight to one); a very low railed platform midships, three feet
       out of the water; the lantern on it, and the steersman's small low cage forward of it with
       thick lenticular glass; a sharp steel spur at the bow; a simple screw and rudder at the
       stern; iron plates that overlap, drawn quietly. No tower, no fins, no great eye window. -->
  <defs>
    <linearGradient id="nautilus-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="n-hull-sheen-top" />
      <stop offset="0.5" class="n-hull-sheen-mid" />
      <stop offset="1" class="n-hull-sheen-bottom" />
    </linearGradient>
  </defs>
  <g class="n-screw">
    <path d="M34 62 H16" />
    <ellipse cx="18" cy="55" rx="2.2" ry="6.5" />
    <ellipse cx="18" cy="69" rx="2.2" ry="6.5" />
    <circle cx="18" cy="62" r="2.4" />
  </g>
  <path class="n-rudder" d="M8 50 H13 L13 74 H8 Z" />
  <path class="n-hull" d="M34 62 C90 40 170 29 260 29 L382 29 C474 29 540 42 566 62 C540 82 474 95 382 95 L260 95 C170 95 90 84 34 62 Z" />
  <path class="n-hull-shade" d="M34 62 C90 40 170 29 260 29 L382 29 C474 29 540 42 566 62 C540 82 474 95 382 95 L260 95 C170 95 90 84 34 62 Z" fill="url(#nautilus-sheen)" />
  <g class="n-plates">
    <path d="M120 41 C115 52 115 72 120 83" />
    <path d="M190 32 C185 48 185 76 190 92" />
    <path d="M260 29 C255 46 255 78 260 95" />
    <path d="M330 29 C325 46 325 78 330 95" />
    <path d="M400 30 C395 47 395 77 400 94" />
    <path d="M468 35 C463 50 463 74 468 89" />
    <path d="M44 62 C170 59 430 59 556 62" />
  </g>
  <g class="n-lights">
    <circle cx="236" cy="66" r="3.4" />
    <circle cx="268" cy="66" r="3.4" />
    <circle cx="300" cy="66" r="3.4" />
    <circle cx="332" cy="66" r="3.4" />
    <circle cx="364" cy="66" r="3.4" />
  </g>
  <path class="n-platform" d="M226 29 L228 25 L414 25 L416 29 Z" />
  <g class="n-rail">
    <path d="M232 18 H404" />
    <path d="M232 25 V18" />
    <path d="M244 25 V18" />
    <path d="M256 25 V18" />
    <path d="M268 25 V18" />
    <path d="M280 25 V18" />
    <path d="M292 25 V18" />
    <path d="M304 25 V18" />
    <path d="M316 25 V18" />
    <path d="M328 25 V18" />
    <path d="M340 25 V18" />
    <path d="M352 25 V18" />
    <path d="M364 25 V18" />
    <path d="M376 25 V18" />
    <path d="M388 25 V18" />
    <path d="M400 25 V18" />
  </g>
  <g class="n-lantern-house">
    <path class="n-cage" d="M282 25 L284 13 L300 13 L302 25 Z" />
    <path class="n-cage-cap" d="M281 13 L292 8 L303 13 Z" />
    <circle class="n-lantern" cx="292" cy="19" r="4.2" />
  </g>
  <g class="n-steersman">
    <path class="n-cage" d="M352 25 L355 18 L377 18 L380 25 Z" />
    <path class="n-glass" d="M358 20.5 H374 L375.5 23.5 H356.5 Z" />
