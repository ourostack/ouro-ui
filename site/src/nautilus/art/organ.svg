    <g class="or-note" data-note="4" transform="translate(166 2)"><ellipse cx="0" cy="0" rx="5.4" ry="4" transform="rotate(-20)" /><path d="M5 -1 V-22" fill="none" /></g>
    <g class="or-note" data-note="5" transform="translate(200 20)"><ellipse cx="0" cy="0" rx="5.4" ry="4" transform="rotate(-20)" /><path d="M5 -1 V-22 C10 -18 14 -15 12 -8" fill="none" /></g>
  </g>
