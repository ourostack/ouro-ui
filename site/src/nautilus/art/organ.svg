<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -40 260 250" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <title>Captain Nemo's organ</title>
  <!-- Original drawing for Ouro HX (manifest.json): the organ in the Nautilus's saloon, which
       Captain Nemo plays at the end of Chapter III. A case of pipes, tallest in the middle, over a
       console with its keys; the notes over it rise when he plays. Engraved lines and flat fills;
       colour comes from the theme. -->
  <g class="or-notes" fill="currentColor" stroke-width="1.6">
    <g class="or-note" data-note="1" transform="translate(60 22)"><ellipse cx="0" cy="0" rx="5.4" ry="4" transform="rotate(-20)" /><path d="M5 -1 V-22 C10 -18 14 -15 12 -8" fill="none" /></g>
    <g class="or-note" data-note="2" transform="translate(94 4)"><ellipse cx="0" cy="0" rx="5.4" ry="4" transform="rotate(-20)" /><path d="M5 -1 V-22" fill="none" /></g>
