<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <title>You</title>
  <!-- Spot drawing of the person for the person's side of a chat, 32 to 48 px; from "A morning with an agent",
       released under ourostack/ouro-ui's MIT licence. Faceless, no cap, head and shoulders with the amber heart the
       duo drawing gives the person, large enough to show at 32 px; the heart reads the custom property duo-heart
       (else #f2a33a), lines take currentColor. -->
  <circle cx="24" cy="14" r="10" stroke-width="2" />
  <path d="M18 11 A6.5 6.5 0 0 1 21.5 8" stroke-width="1.2" opacity="0.6" />
  <path d="M11 47 V35 C11 28 16.5 25 24 25 C31.5 25 37 28 37 35 V47" stroke-width="2" />
  <circle cx="24" cy="37" r="6.5" fill="var(--duo-heart, #f2a33a)" stroke="none" opacity="0.25" />
  <circle cx="24" cy="37" r="3.6" fill="var(--duo-heart, #f2a33a)" stroke="none" />
</svg>
