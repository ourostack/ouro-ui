<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <title>A person and their agent share one desk on a sunny morning; the agent sends the person's note to a room of three people</title>
  <!-- Original line drawing of a person and their agent, drawn by hand for Ouro HX's "A morning with an agent" and
       released under ourostack/ouro-ui's MIT licence. The person, on the left, is a faceless chunky figurine with no cap
       and mitten hands with a thumb, holding a coffee beside a laptop: they decide, and the agent does the work. The
       agent, on the right, smaller, with a visor, two round eyes, an antenna and mittens with a thumb, sends the note to a
       room from its terminal.
       Lines take currentColor. Amber is the person's (the heart: the custom property duo-heart, else #f2a33a) and
       teal the agent's (eyes, antenna, glow: the custom property duo-eye, else #2ec4b6); the visor reads the custom
       property duo-visor, else a fixed navy. Mittens are solid, filled with the surface they sit on (the custom property
       duo-fill, else the page's background), so no line shows through them. No other colour, so the pair reads the same
       on every theme.
       Everything that matters sits in the middle 60% of the width and 80% of the height, so a centred 4:3 crop
       keeps it; the drawing is scaled to 90% about the centre for that margin. On a phone the page crops it tighter, to the
       620 by 280 stretch from (300, 50): the duo, the window and the room (site/src/ax/ax.css). -->

  <g transform="translate(600 250) scale(0.9) translate(-600 -250)">
  <!-- Floor and the shared desk -->
  <path d="M170 446 H1030" stroke-width="1.4" opacity="0.45" />
  <path d="M288 300 H912" stroke-width="2.4" />
  <path d="M296 306 H904" stroke-width="1" opacity="0.6" />
  <path d="M312 306 V444 M888 306 V444" stroke-width="2" />
  <path d="M312 352 H372 M888 352 H828" stroke-width="1" opacity="0.5" />

  <!-- Window with the sun coming up -->
  <rect x="530" y="58" width="140" height="196" rx="12" stroke-width="2" />
  <path d="M600 58 V254 M530 156 H670" stroke-width="1" opacity="0.5" />
  <path d="M518 256 H682" stroke-width="2" />
  <path d="M556 254 A44 44 0 0 1 644 254" stroke-width="1.8" />
  <path d="M572 204 L564 194 M628 204 L636 194 M553 224 L541 218 M647 224 L659 218" stroke-width="1.4" />

  <!-- Wall clock at nine -->
  <circle cx="726" cy="96" r="20" stroke-width="1.6" />
  <path d="M726 96 V82 M726 96 H714" stroke-width="1.8" />
  <path d="M726 79 V77 M743 96 H745 M726 113 V115 M709 96 H707" stroke-width="1.2" opacity="0.7" />

  <!-- The person: a chunky figurine, faceless, no cap, mitten hands with a thumb; a warm heart -->
  <circle cx="356" cy="196" r="27" stroke-width="2.4" />
  <path d="M340 186 A18 18 0 0 1 350 178" stroke-width="1.4" opacity="0.6" />
  <path d="M322 300 V258 C322 236 337 223 356 223 C375 223 390 236 390 258 V300" stroke-width="2.4" />
  <circle cx="356" cy="254" r="11" fill="var(--duo-heart, #f2a33a)" stroke="none" opacity="0.25" />
  <circle cx="356" cy="254" r="5.5" fill="var(--duo-heart, #f2a33a)" stroke="none" />
  <!-- Mug and steam: the handle in the person's hand -->
  <path d="M288 252 H310 V272 C310 275 308 276 305 276 H293 C290 276 288 275 288 272 Z" stroke-width="1.8" transform="translate(-4 6)" />
  <path d="M310 257 C317 257 319 268 310 268" stroke-width="1.6" transform="translate(-4 6)" />
  <path d="M294 244 C290 236 298 232 294 224 M304 244 C300 236 308 232 304 224" stroke-width="1.2" opacity="0.7" transform="translate(-4 6)" />
  <!-- The person's short arms with solid mitten hands, each with a thumb: one holding the mug up, one resting by the laptop -->
  <path d="M327 243 C318 251 313 260 312 267" stroke-width="2.4" />
  <path d="M309 262 C309 255 322 255 323 262 V269 C323 274 310 274 310 269 Z M310 264 C305 263 304 269 309 270" fill="var(--duo-fill, var(--background, #fff))" stroke-width="2" transform="translate(-4 6)" />
  <path d="M386 242 C395 254 400 268 404 280" stroke-width="2.4" />
  <path d="M404 280 C408 276 418 282 416 290 C414 297 404 297 402 291 C400 287 401 283 404 280 Z M402.4 286 C397.6 285.4 396.8 291.4 401.8 292" fill="var(--duo-fill, var(--background, #fff))" stroke-width="2" transform="translate(0 3.2)" />
  <!-- The person's laptop, its app showing a conversation -->
  <path d="M420 296 H520 L512 300 H428 Z" stroke-width="1.8" />
  <rect x="428" y="214" width="84" height="80" rx="5" stroke-width="2" />
  <rect x="436" y="224" width="40" height="12" rx="6" stroke-width="1.2" opacity="0.7" />
  <rect x="460" y="242" width="44" height="12" rx="6" stroke-width="1.2" opacity="0.7" />
  <rect x="436" y="260" width="52" height="12" rx="6" stroke-width="1.6" />
  <circle cx="496" cy="266" r="3" fill="var(--duo-eye, #2ec4b6)" stroke="none" />
  <!-- The agent: smaller than the person; a visor, two round eyes, an antenna with a bulb, a glow in the chest and solid mitten hands, each with a thumb -->
  <path d="M846 222 V206" stroke-width="2.2" />
  <circle cx="846" cy="199" r="10" fill="var(--duo-eye, #2ec4b6)" stroke="none" opacity="0.22" />
  <circle cx="846" cy="199" r="6" fill="var(--duo-eye, #2ec4b6)" stroke="currentColor" stroke-width="1.4" />
  <rect x="816" y="222" width="60" height="44" rx="16" stroke-width="2.4" />
  <rect x="825" y="231" width="42" height="24" rx="11" fill="var(--duo-visor, #1d2955)" stroke="currentColor" stroke-width="1" />
  <circle cx="838" cy="243" r="4" fill="var(--duo-eye, #2ec4b6)" stroke="none" />
  <circle cx="854" cy="243" r="4" fill="var(--duo-eye, #2ec4b6)" stroke="none" />
  <path d="M832 266 V270 M860 266 V270" stroke-width="2" />
  <path d="M824 300 V282 C824 275 829 270 836 270 H856 C863 270 868 275 868 282 V300" stroke-width="2.4" />
  <circle cx="846" cy="288" r="10" fill="var(--duo-eye, #2ec4b6)" stroke="none" opacity="0.22" />
  <circle cx="846" cy="288" r="4.2" fill="var(--duo-eye, #2ec4b6)" stroke="none" />
  <path d="M826 282 L800 286" stroke-width="2.4" />
  <path d="M805 285 C805.2 279.5 803.4 276.6 801.2 276.6 C798.9 276.6 798.2 278.8 798.5 280.3 C793.2 280 790.6 284 790.8 287.3 C791 291.6 794.4 293.6 798.4 293.4 C802.8 293.2 804.9 290.2 805 285 Z M798.5 280.3 C800 281.3 801.6 281.6 802.8 281.1" fill="var(--duo-fill, var(--background, #fff))" stroke-width="2" transform="translate(-3.6 0)" />
  <path d="M866 282 C875 285 878 287 877 290" stroke-width="2.4" />
  <path d="M878 288.4 C881.9 288.4 883.6 291.3 883.5 294.1 C883.4 297.4 881 299.2 878 299.2 C875.4 299.2 873.6 298 873.1 296.6 C869.7 297.1 868 294.7 868.8 292.7 C869.5 291 871.7 290.7 873.4 291.6 C874.3 289.7 875.9 288.4 878 288.4 Z" fill="var(--duo-fill, var(--background, #fff))" stroke-width="2" />
  <!-- The agent's terminal: a slim panel of command lines -->
  <rect x="694" y="214" width="92" height="80" rx="5" stroke-width="2" />
  <path d="M694 228 H786" stroke-width="1" opacity="0.5" />
  <circle cx="702" cy="221" r="1.6" fill="currentColor" stroke="none" />
  <circle cx="709" cy="221" r="1.6" fill="currentColor" stroke="none" />
  <path d="M702 240 L707 244 L702 248 M712 248 H748" stroke-width="1.4" />
  <path d="M702 258 H766 M702 268 H740" stroke-width="1.2" opacity="0.6" />
  <path d="M702 280 L707 284 L702 288 M712 288 H722" stroke-width="1.4" />
  <path d="M726 282 V290" stroke="var(--duo-eye, #2ec4b6)" stroke-width="2.4" />
  <path d="M740 294 V300" stroke-width="2.4" />
  <path d="M700 300 H780" stroke-width="1.8" />

  <!-- The note flies from the terminal to the Design sync room -->
  <path d="M760 210 C770 176 786 156 806 146" stroke-width="1.4" stroke-dasharray="2 6" opacity="0.8" />
  <path d="M808 128 L842 140 L812 150 Z M812 150 L818 140 L842 140" stroke-width="1.8" transform="rotate(-24 825 140)" />
  <path d="M846 132 C850 122 856 116 862 114" stroke-width="1.4" stroke-dasharray="2 6" opacity="0.8" />
  <rect x="866" y="78" width="76" height="52" rx="12" stroke-width="2" />
  <circle cx="886" cy="100" r="7" stroke-width="1.6" />
  <circle cx="904" cy="96" r="7" stroke-width="1.6" />
  <circle cx="922" cy="100" r="7" stroke-width="1.6" />
  <path d="M878 120 C880 112 892 112 894 120 M896 116 C898 108 910 108 912 116 M914 120 C916 112 928 112 930 120" stroke-width="1.4" />
  </g>
</svg>
