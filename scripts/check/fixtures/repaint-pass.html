<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repaints at rest: passes</title>
<style>body{font:16px/1.5 system-ui,sans-serif;margin:0;padding:16px}main{max-width:36rem;margin:0 auto}</style>
<style>@keyframes spin{to{transform:rotate(1turn)}}@keyframes once{from{color:#a33}to{color:#222}}@keyframes shimmer{to{background-position:200px 0}}.spinner{width:24px;height:24px;border:3px solid #57a;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite}.arrived{animation:once .4s ease-out}.shimmer{height:40px;background:linear-gradient(90deg,#eee,#ddd,#eee) 0 0/200px 100%;animation:shimmer 1.2s linear infinite}</style>
<main><h1>Repaints at rest</h1><div class="spinner" role="status" aria-label="Loading"></div><p class="arrived">Arrived once, then still.</p><div class="shimmer" data-ouro-allow="repaint" data-ouro-allow-why="a loading placeholder the fixture keeps on purpose"></div></main>
