<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slow press: fails</title>
<style>body{font:16px/1.5 system-ui,sans-serif;margin:0;padding:16px}main{max-width:36rem;margin:0 auto}</style>
<main><h1>Slow press</h1><p>Its button holds the page for 400 ms before the next frame can draw.</p><button id="slow" type="button">Save</button></main>
<script>
document.getElementById("slow").addEventListener("click", (event) => {
  const start = performance.now();
  while (performance.now() - start < 400);
  event.currentTarget.textContent = "Saved";
});
</script>
