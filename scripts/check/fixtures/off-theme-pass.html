<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Off the theme: passes</title>
<style>
:root{--background:#ffffff;--foreground:#1d1d1f;--card:#f5f5f7;--primary:#0071e3;--primary-foreground:#ffffff;--muted-foreground:#6e6e73;--radius-sm:6px;--radius-md:10px;--radius-lg:14px;--shadow-md:0 4px 12px rgb(0 0 0 / 0.08);--font-sans:system-ui,sans-serif;--spacing:0.25rem}
body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans)}
main{max-width:36rem;margin:0 auto;padding:calc(var(--spacing)*4)}
.card{background:var(--card);color:var(--foreground);border-radius:var(--radius-lg);padding:calc(var(--spacing)*6);box-shadow:var(--shadow-md);border:1px solid transparent}
.pill{border-radius:9999px;padding:0}
</style>
<main><h1>Off the theme</h1><div class="card">The card takes its fill, corners, padding, shadow and font from the theme. <span class="pill">A pill</span></div></main>
