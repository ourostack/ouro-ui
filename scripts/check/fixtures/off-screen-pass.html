<main><h1>Off the screen</h1><p>A row that scrolls sideways, a closed drawer wholly off the screen, visually hidden text and an ellipsis.</p><div role="region" aria-label="Tags" tabindex="0" style="overflow-x:auto;white-space:nowrap"><span style="display:inline-block;width:2000px">A row of tags that scrolls sideways</span></div><nav aria-label="Drawer" style="position:fixed;top:0;left:-400px;width:300px"><a href="#d">A closed drawer</a></nav><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Visually hidden text</span><p style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis"><span>A preview cut by its own ellipsis inside the screen, not by its edge, at any width</span></p></main>
