<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frame in a frame: passes</title>
<style>body{font:16px/1.5 system-ui,sans-serif;margin:0;padding:16px}main{max-width:36rem;margin:0 auto}</style>
<style>.frame{border:1px solid #bbb;border-radius:12px;padding:16px;margin-bottom:16px}.tile{background:#e8e4dc;border-radius:16px;corner-shape:squircle;padding:4px}.tile div{background:#fff;border-radius:12px;corner-shape:squircle;padding:16px}.btn{position:relative;display:inline-block;isolation:isolate;border:1px solid #bbb;border-radius:6px;padding:8px 24px;background:#e8e4dc;margin-bottom:16px}.btn [data-ouro-surface]{position:absolute;inset:0;z-index:-1;border:1px solid #bbb;background:#e8e4dc;clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}</style>
<main><h1>Frame in a frame</h1><div class="frame"><p>One frame, with room inside.</p></div><div class="tile"><div><p>Corners that nest: 16px outside, 4px in, 12px inside.</p></div></div><p><button class="btn" type="button"><span data-ouro-surface="" aria-hidden="true"></span>Surface painted</button></p></main>
