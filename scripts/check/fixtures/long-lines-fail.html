<main style="max-width:none"><h1>Long lines</h1><p>Prose that runs the whole width of a wide screen is hard to read, because the eye loses its place on the way back to the start of the next line, and so a line of text should stay under about a hundred characters however wide the window is, which this paragraph does not do at all.</p></main>
