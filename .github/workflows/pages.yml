name: Pages
# Publishes https://ourostack.github.io/ouro-ui/: the site and docs at / and the Storybook at
# /storybook/, from main, and the registry for the @ouro namespace at /r/ (each item at
# /r/<item>.json, the index at /r/registry.json) from the newest release tag, package.json's
# ouro.latestRelease on main (scripts/namespace.sh). In the namespace build, same-repo
# registryDependencies are @ouro/<item>, so an app installs everything from Pages, and only
# released code. Deploys only after CI passes on a push to main, and only when that push is
# still main's tip, so a slower run for an older commit never deploys over a newer one.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  tip:
    # A CI run for an older commit can finish after the run for a newer one; deploy only main's tip.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.tip.outputs.current }}
    steps:
      - id: tip
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REPO: ${{ github.repository }}
        run: |
          tip=$(git ls-remote "https://github.com/$REPO.git" refs/heads/main | cut -f1)
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ "$tip" = "$HEAD_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$HEAD_SHA is no longer main's tip ($tip); the run for the tip deploys."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: tip
    if: needs.tip.outputs.current == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm site:build && mkdir -p _site && cp -R site/dist/. _site/
      - run: pnpm build-storybook --output-dir _site/storybook
      - run: scripts/namespace.sh _site/r
      - uses: actions/upload-pages-artifact@v4
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
