name: Pages
# Publishes https://ui.ouroboros.bot/: the site and docs at / and the Storybook at
# /storybook/, from main, and the registry for the @ouro namespace at /r/ (each item at
# /r/<item>.json, the index at /r/registry.json) from the newest release tag
# (scripts/namespace.sh). The build asks GitHub for the newest release and names it in the
# site, llms.txt and the namespace, whatever main's package.json says, so a release shows
# here as soon as Pages runs, before the pull request that prepares main merges (release.yml
# runs this workflow once the release is out). The build writes core's newest release into the
# Platforms pages the same way (scripts/platform-versions.mjs --write), so they name it too, and each other
# kit's newest release and components into the parity matrix (scripts/parity-matrix.mjs --write). In the
# namespace build, same-repo registryDependencies are @ouro/<item>, so an app installs everything from Pages, and only
# released code. Deploys on every push to main, from that commit, without waiting for main's
# CI (which still runs, and a bad deploy is reversed by deploying again), and only when that
# push is still main's tip, so a slower run for an older commit never deploys over a newer one.
# The pages concurrency group below never runs two deploys together, so a job stuck with no
# timeout-minutes (the default six hours) blocked every later run until it was cancelled by hand
# (ourostack/ouro-ui#3375); each job's own timeout-minutes (tip 5, build 10, deploy 15, each about
# twice a recent run's worst case) frees the group on its own instead.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  tip:
    # A run for an older commit can start after the run for a newer one; deploy only main's tip.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      current: ${{ steps.tip.outputs.current }}
    steps:
      - id: tip
        env:
          HEAD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          tip=$(git ls-remote "https://github.com/$REPO.git" refs/heads/main | cut -f1)
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ "$tip" = "$HEAD_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$HEAD_SHA is no longer main's tip ($tip); the run for the tip deploys."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: tip
    if: needs.tip.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - id: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        continue-on-error: true
      - name: pnpm setup failed; trying it once more (#1911)
        if: steps.pnpm.outcome == 'failure'
        run: echo "::warning title=pnpm setup failed::pnpm/action-setup could not install pnpm (ourostack/ouro-ui#1911); setting it up once more."
      - if: steps.pnpm.outcome == 'failure'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - id: install
        run: pnpm i --frozen-lockfile
        continue-on-error: true
      - name: pnpm install failed; trying it once more (#1914)
        if: steps.install.outcome == 'failure'
        run: echo "::warning title=pnpm install failed::pnpm i failed, which the 1ES feed's HTTP 429s can cause (ourostack/ouro-ui#1914); installing once more."
      - if: steps.install.outcome == 'failure'
        run: pnpm i --frozen-lockfile
      - name: Name the newest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Main names the release before the newest until "Prepare main for the next
          # release" merges; what Pages publishes must not wait for that.
          newest=$(gh api "repos/$REPO/releases/latest" --jq .tag_name)
          if [ "$newest" != "$(node scripts/latest-release.mjs)" ]; then
            echo "::notice::main names $(node scripts/latest-release.mjs); publishing for $newest, the newest release."
            node scripts/latest-release.mjs set "$newest"
            pnpm run docs
          fi
      - name: Write core's newest release into the Platforms pages
        # core's copies (scripts/parity-data) and the pages that name them, read from GitHub here, so the Platforms pages name
        # core's newest release as soon as Pages runs. Exit 2 (GitHub unreadable) is a warning: nothing is written, and the
        # build keeps the copies main has. The parity page is rendered by the step after this one, once they are written.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=0
          node scripts/platform-versions.mjs --write || code=$?
          if [ "$code" = 2 ]; then
            echo "Core's newest release could not be read, so the Platforms pages name the release main has." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$code" != 0 ]; then
            exit "$code"
          fi
      - name: Write the other kits' newest releases into the parity matrix
        # platforms.json (Windows' newest release and its components, read from its source at that release, and Apple's pinned
        # components) read from GitHub here, so the matrix names each kit's newest release as soon as Pages runs. Exit 2 (GitHub
        # unreadable) is a warning: nothing is written, and the build keeps the copy main has. The page is rendered last, from the
        # copies and the data, so it names the copies core's step wrote.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=0
          node scripts/parity-matrix.mjs --write || code=$?
          if [ "$code" = 2 ]; then
            echo "The other kits' newest releases could not be read, so the parity matrix names the releases main has." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$code" != 0 ]; then
            exit "$code"
          fi
          node scripts/parity-matrix.mjs --render
      - name: Build in the newest adoption ledger
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The hourly run (adoption-ledger.yml) writes ledger.json to the adoption-data branch. The copy committed
          # on main is only a fallback, so /adoption/ never opens on numbers older than the last hourly run.
          node scripts/adoption/take-newest.mjs "https://api.github.com/repos/$REPO/contents/ledger.json?ref=adoption-data" site/src/adoption/ledger.json
      - name: Build in Ouro Current's newest list
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every run of ouro-current.yml writes current.json to the adoption-data branch, so /current/ opens on the last
          # run's releases and repositories rather than on the copy committed on main.
          node scripts/adoption/take-newest.mjs "https://api.github.com/repos/$REPO/contents/current.json?ref=adoption-data" site/src/current/current.json
      - run: pnpm site:build && mkdir -p _site && cp -R site/dist/. _site/
      - run: pnpm build-storybook --output-dir _site/storybook
      - run: scripts/namespace.sh _site/r
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.again.outputs.page_url || steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/pages-clear.sh
          sparse-checkout-cone-mode: false
      # GitHub refuses a deployment while another build's is in progress, and one can stay in progress after
      # deploy-pages gives up on it (#2447): any that did not succeed is cancelled first, and once more if this deploy is refused.
      - run: scripts/pages-clear.sh "$GITHUB_SHA"
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - if: steps.deployment.outcome == 'failure'
        run: |
          echo "::warning title=Pages deploy refused::Deploying once more after clearing any deployment still in progress (ourostack/ouro-ui#2447)."
          scripts/pages-clear.sh "$GITHUB_SHA"
          # GitHub let a cancelled deployment go only a moment after it read cancelled.
          sleep 60
      - id: again
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
