name: Pages
# Publishes https://ui.ouroboros.bot/: the site and docs at / and the Storybook at
# /storybook/, from main, and the registry for the @ouro namespace at /r/ (each item at
# /r/<item>.json, the index at /r/registry.json) from the newest release tag
# (scripts/namespace.sh). The build asks GitHub for the newest release and names it in the
# site, llms.txt and the namespace, whatever main's package.json says, so a release shows
# here as soon as Pages runs, before the pull request that prepares main merges (release.yml
# runs this workflow once the release is out). In the namespace build, same-repo
# registryDependencies are @ouro/<item>, so an app installs everything from Pages, and only
# released code. Deploys on every push to main, from that commit, without waiting for main's
# CI (which still runs, and a bad deploy is reversed by deploying again), and only when that
# push is still main's tip, so a slower run for an older commit never deploys over a newer one.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  tip:
    # A run for an older commit can start after the run for a newer one; deploy only main's tip.
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.tip.outputs.current }}
    steps:
      - id: tip
        env:
          HEAD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          tip=$(git ls-remote "https://github.com/$REPO.git" refs/heads/main | cut -f1)
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ "$tip" = "$HEAD_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$HEAD_SHA is no longer main's tip ($tip); the run for the tip deploys."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: tip
    if: needs.tip.outputs.current == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - name: Name the newest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Main names the release before the newest until "Prepare main for the next
          # release" merges; what Pages publishes must not wait for that.
          newest=$(gh api "repos/$REPO/releases/latest" --jq .tag_name)
          if [ "$newest" != "$(node scripts/latest-release.mjs)" ]; then
            echo "::notice::main names $(node scripts/latest-release.mjs); publishing for $newest, the newest release."
            node scripts/latest-release.mjs set "$newest"
            pnpm run docs
          fi
      - run: pnpm site:build && mkdir -p _site && cp -R site/dist/. _site/
      - run: pnpm build-storybook --output-dir _site/storybook
      - run: scripts/namespace.sh _site/r
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
