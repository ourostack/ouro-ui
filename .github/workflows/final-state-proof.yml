name: Consumer Test Portability Proof
on:
  push:
    branches: [probe/final-state-contracts]
permissions:
  contents: read
jobs:
  portability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        vitest: [4.1.11, 5.0.3]
        source: [original, fixed]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preserve the source receipt before toolchain setup
        run: mkdir -p state-evidence && git rev-parse HEAD > state-evidence/source.txt
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - name: Use the documented no-skip browser toolchain
        env:
          VITEST: ${{ matrix.vitest }}
        run: |
          set -euo pipefail
          pnpm add -Dw --save-exact "vitest@$VITEST" "@vitest/browser-playwright@$VITEST" "@vitest/coverage-istanbul@$VITEST" "@playwright/test@1.64.0" "playwright@1.64.0" 2>&1 | tee state-evidence/toolchain.log
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Qualify exact test sources under aliased theme tokens
        shell: bash
        env:
          VARIANT: ${{ matrix.source }}
          VITEST: ${{ matrix.vitest }}
        run: |
          set -euo pipefail
          mkdir -p state-evidence
          git rev-parse HEAD > state-evidence/source.txt
          git merge-base --is-ancestor 9a8e0d86d3fdcfa746de1b3b2eb3cad0e5dbf226 HEAD
          git diff 9a8e0d86d3fdcfa746de1b3b2eb3cad0e5dbf226 -- registry registry.json scripts test changes > state-evidence/candidate.diff
          test ! -s state-evidence/candidate.diff
          if [ "$VARIANT" = original ]; then
            for path in registry/ouro/components/ouro/badge/badge.test.tsx registry/ouro/components/ouro/item/item-group.test.tsx; do
              git show "ae5984fe38ed1bf3bd3b7a1f94ea3f001a892b30:$path" > "$path"
            done
          fi
          sha256sum registry/ouro/components/ouro/{badge/badge,item/item-group,button/button,sheet/sheet}.test.tsx proof/consumer-portability.config.ts proof/consumer-portability.css > state-evidence/digests.txt
          pnpm list vitest @vitest/browser-playwright @playwright/test playwright --depth 0 --json > state-evidence/tools.json
          if pnpm exec vitest run --config proof/consumer-portability.config.ts --project=ouro-chromium --project=ouro-webkit --reporter=default --reporter=json --outputFile=state-evidence/results.json registry/ouro/components/ouro/badge/badge.test.tsx registry/ouro/components/ouro/item/item-group.test.tsx registry/ouro/components/ouro/button/button.test.tsx registry/ouro/components/ouro/sheet/sheet.test.tsx > state-evidence/browser.log 2>&1; then code=0; else code=$?; fi
          printf '%s\n' "$code" > state-evidence/browser.exit
          test -s state-evidence/results.json
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync("state-evidence/results.json", "utf8"));
          const failures = report.testResults.flatMap(suite => suite.assertionResults.filter(test => test.status === "failed"));
          const code = Number(readFileSync("state-evidence/browser.exit", "utf8"));
          if (process.env.VARIANT === "fixed") {
            assert.equal(code, 0);
            assert.equal(failures.length, 0);
          } else {
            assert.notEqual(code, 0);
            const expected = process.env.VITEST.startsWith("4.") ? 4 : 2;
            assert.equal(failures.length, expected, JSON.stringify(failures));
            for (const failure of failures) {
              assert.match(failure.fullName, /Badge gives every tone and variant a distinct look|ItemGroup shows empty, outside any list, when there are no rows/);
            }
          }
          console.log(`${process.env.VARIANT} Vitest ${process.env.VITEST}: ${report.numPassedTests} passed; ${failures.length} classified failures`);
          NODE
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consumer-portability-${{ matrix.vitest }}-${{ matrix.source }}
          path: |
            state-evidence/
            .vitest/attachments/
          if-no-files-found: error
