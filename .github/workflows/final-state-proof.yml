name: Final State Contracts Proof
on:
  push:
    branches: [probe/final-state-contracts]
permissions:
  contents: read
jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Qualify exact fixed source with whole browser suites and full component coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p state-evidence
          git rev-parse HEAD > state-evidence/source.txt
          git merge-base --is-ancestor fa383d277aa8c3efd11658b3c73959d7391796d7 HEAD
          git diff fa383d277aa8c3efd11658b3c73959d7391796d7 -- registry registry.json scripts test changes > state-evidence/candidate.diff
          test ! -s state-evidence/candidate.diff
          sha256sum registry/ouro/components/ouro/form/edit-sheet.tsx registry/ouro/components/ouro/calendar/date-picker.tsx registry/ouro/components/ouro/combobox/combobox.tsx registry/ouro/components/ouro/form/edit-sheet.test.tsx registry/ouro/components/ouro/calendar/date-picker.test.tsx registry/ouro/components/ouro/calendar/date-picker.touch.test.tsx registry/ouro/components/ouro/combobox/combobox.test.tsx registry/ouro/components/ouro/combobox/combobox.touch.test.tsx registry.json changes/state-contracts.md test/install-fixture-next/src/app/sections/date-picker.tsx > state-evidence/digests.txt
          if pnpm exec vitest run --project=ouro-chromium --project=ouro-webkit --project=ouro-touch --coverage '--coverage.include=registry/ouro/components/ouro/{form/edit-sheet,calendar/date-picker,combobox/combobox}.tsx' --reporter=default --reporter=json --outputFile=state-evidence/results.json registry/ouro/components/ouro/form/edit-sheet.test.tsx registry/ouro/components/ouro/calendar/date-picker.test.tsx registry/ouro/components/ouro/calendar/date-picker.touch.test.tsx registry/ouro/components/ouro/combobox/combobox.test.tsx registry/ouro/components/ouro/combobox/combobox.touch.test.tsx > state-evidence/green.log 2>&1; then code=0; else code=$?; fi
          printf '%s\n' "$code" > state-evidence/green.exit
          test -s state-evidence/results.json
          exit "$code"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: final-state-green
          path: |
            state-evidence/
            coverage/
            .vitest/attachments/
          if-no-files-found: error
