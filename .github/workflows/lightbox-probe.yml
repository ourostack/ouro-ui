# PROBE (never merge): the Lightbox End glide in WebKit, in the fallback's twelfth shard and alone.
name: Lightbox probe
on:
  pull_request:
permissions:
  contents: read
jobs:
  glide:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
      env:
        OURO_SYSTEM_PACKAGES: image
    strategy:
      fail-fast: false
      matrix:
        mode: [shard12, shard12, webkit12, alone]
    name: glide (${{ matrix.mode }} ${{ strategy.job-index }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - run: pnpm i --frozen-lockfile
      - name: Glide
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set +e
          for i in 1 2 3; do
            case "$MODE" in
              shard12) pnpm exec vitest run --coverage --shard=12/12 > out.log 2>&1 ;;
              webkit12) pnpm exec vitest run --project ouro-webkit --shard=12/12 > out.log 2>&1 ;;
              alone) pnpm exec vitest run --project ouro-webkit registry/ouro/components/ouro/lightbox/lightbox.test.tsx > out.log 2>&1 ;;
            esac
            echo "round $i exit $?"
            sed 's/\x1b\[[0-9;]*m//g' out.log | grep -oE "GLIDE-PROBE .*" | cut -c1-900
            sed 's/\x1b\[[0-9;]*m//g' out.log | grep -E "Test Files|FAIL " | head -8
          done
