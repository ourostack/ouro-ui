name: Scheduled install
# Every week, installs every item into fresh apps from main and from the newest release tag
# (GitHub's newest release), with each ref's own install test. Item dependency ranges
# float (@base-ui/react@^1.8.0), so a new upstream release can change what a pinned #v<x.y.z>
# install gets without any commit here; this run notices. A variant the tag's install test
# does not have yet is skipped with a notice. The run also fails when the
# published llms.txt names another release in an install command (scripts/published-release.mjs).
# Any failure opens, or comments on, one "Scheduled install failed" issue.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refs:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)
          [ -n "$tag" ] || { echo "::error::GitHub names no newest release"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  latest:
    # What people read must name the newest release: the site's llms.txt.
    needs: refs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - run: node scripts/published-release.mjs "${{ needs.refs.outputs.tag }}"
  install:
    needs: refs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: [main, "${{ needs.refs.outputs.tag }}"]
        variant: [shadcn, ouro, namespace, next]
    name: install (${{ matrix.ref }}, ${{ matrix.variant }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - id: has
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          if grep -qE "^usage=.*[<|]$VARIANT[|>]" scripts/install-test.sh; then
            echo "variant=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${{ matrix.ref }} has no $VARIANT install test; skipped."
          fi
      - if: steps.has.outputs.variant == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.has.outputs.variant == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - if: steps.has.outputs.variant == 'true'
        run: pnpm i --frozen-lockfile
      - if: steps.has.outputs.variant == 'true'
        run: scripts/install-test.sh ${{ matrix.variant }} "$RUNNER_TEMP/app" "$(git rev-parse HEAD)"
  report:
    # One issue for any failure, opened or commented on (scripts/scheduled-failure.sh).
    needs: [refs, latest, install]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/scheduled-failure.sh "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
