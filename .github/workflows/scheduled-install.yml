name: Scheduled install
# Every week, installs every item into fresh apps from main and from the newest release tag
# (package.json ouro.latestRelease), with each ref's own install test. Item dependency ranges
# float (@base-ui/react@^1.8.0), so a new upstream release can change what a pinned #v<x.y.z>
# install gets without any commit here; this run notices. A variant the tag's install test
# does not have yet is skipped with a notice. The run also fails when main's
# ouro.latestRelease is not GitHub's newest release, which the docs and @ouro would then lag.
# Any failure opens, or comments on, one "Scheduled install failed" issue.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refs:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          persist-credentials: false
      - id: tag
        run: |
          tag=$(node scripts/latest-release.mjs)
          [ -n "$tag" ] || { echo "::error::main's package.json names no newest release"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  latest:
    # ouro.latestRelease on main must be GitHub's newest release: if the "Prepare main for the
    # next release" PR was never merged, the docs and the @ouro namespace still serve the old tag.
    needs: refs
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.refs.outputs.tag }}
        run: |
          newest=$(gh api "repos/$REPO/releases/latest" --jq .tag_name)
          [ "$newest" = "$TAG" ] || { echo "::error::main's package.json ouro.latestRelease is $TAG, but the newest release is $newest. Merge the 'Prepare main for the next release' PR (or open it by hand)."; exit 1; }
          echo "ouro.latestRelease is $TAG, the newest release."
  install:
    needs: refs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: [main, "${{ needs.refs.outputs.tag }}"]
        variant: [shadcn, ouro, namespace, next]
    name: install (${{ matrix.ref }}, ${{ matrix.variant }})
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - id: has
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          if grep -qE "^usage=.*[<|]$VARIANT[|>]" scripts/install-test.sh; then
            echo "variant=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${{ matrix.ref }} has no $VARIANT install test; skipped."
          fi
      - if: steps.has.outputs.variant == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.has.outputs.variant == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
      - if: steps.has.outputs.variant == 'true'
        run: pnpm i --frozen-lockfile
      - if: steps.has.outputs.variant == 'true'
        run: scripts/install-test.sh ${{ matrix.variant }} "$RUNNER_TEMP/app" "$(git rev-parse HEAD)"
  report:
    # One issue for any failure, opened or commented on (scripts/scheduled-failure.sh).
    needs: [refs, latest, install]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/scheduled-failure.sh "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
