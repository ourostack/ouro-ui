# One-time: publish a placeholder @ouro.bot/ui@0.0.0 so npm trusted publishing
# can be configured for release.yml. npm requires the package to exist first.
# Delete this workflow and the NPM_BOOTSTRAP_TOKEN secret afterwards.
name: npm bootstrap
on: workflow_dispatch
permissions:
  contents: read
jobs:
  publish-placeholder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish placeholder
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          mkdir pkg && cd pkg
          cat > package.json <<'JSON'
          {
            "name": "@ouro.bot/ui",
            "version": "0.0.0",
            "description": "Ouro UI: React components with handcrafted interactions, designed for coding agents. Placeholder; the first release is coming.",
            "license": "MIT",
            "repository": { "type": "git", "url": "git+https://github.com/ourostack/ouro-ui.git" }
          }
          JSON
          echo "# @ouro.bot/ui\n\nPlaceholder. See https://github.com/ourostack/ouro-ui." > README.md
          npm publish --access public --tag placeholder
