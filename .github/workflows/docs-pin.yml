name: Docs pin
# Points main's docs at the newest release: the install commands in README.md, site/llms.txt and
# the guides, and package.json's description, which `pnpm run docs` writes from ouro.latestRelease.
# Release dispatches it once it has tagged a release, and never waits for it. It keeps one pull
# request open on one branch, "Point the docs at a release" (a title the claims lint accepts), force-updating it, and turns auto-merge on, so
# the pull request merges once the checks main's ruleset requires pass. Release auto starts nothing
# for the commit it makes (scripts/pin-only.mjs).
# The branch is pushed with DOCS_PIN_TOKEN when the repository has that secret. A push with the
# workflow's own token starts no CI run, so without the secret a maintainer must push an empty
# commit to the branch to start CI; the pull request body says so.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The newest release to point the docs at, such as v1.3.56"
        required: true
        type: string
permissions: {}
concurrency:
  group: docs-pin
  cancel-in-progress: false
jobs:
  pin:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the docs branch, and delete it when main already names the release
      pull-requests: write # open, retitle, close and auto-merge the pull request
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.DOCS_PIN_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      BRANCH: docs/point-at-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.DOCS_PIN_TOKEN || github.token }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm i --frozen-lockfile
      - id: pin
        name: Point the docs at the release
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must be a release tag such as v1.3.56, not '$TAG'."; exit 1; }
          gh release view "$TAG" --json tagName >/dev/null || { echo "::error::$TAG is not a published release."; exit 1; }
          # An older tag, dispatched late, must not point the docs back at a release that has been replaced.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name) || { echo "::error::Could not read the newest release."; exit 1; }
          if [ "$TAG" != "$latest" ]; then
            echo "::notice::$TAG is not the newest release ($latest), so the docs stay as they are."
            echo "result=stale" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/latest-release.mjs set "$TAG"
          pnpm run docs
          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice::main already points its docs at $TAG."
            echo "result=current" >> "$GITHUB_OUTPUT"
          else
            echo "result=changed" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pin.outputs.result == 'changed'
        id: push
        name: Commit the docs and push their branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -q -c "$BRANCH"
          git add -A
          git commit -q -m "Point docs at $TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push -q --force origin "$BRANCH"
      - if: steps.pin.outputs.result == 'changed'
        name: Open or update the pull request, and turn auto-merge on
        run: |
          title="Point the docs at a release"
          body=$(printf '%s\n\n%s\n\n%s\n' "Release opened this pull request after it tagged $TAG, to point the docs at that tag with \`node scripts/latest-release.mjs set $TAG\` and \`pnpm run docs\`.[^latest]" "If CI has not started on this pull request, a maintainer pushes an empty commit to $BRANCH to start it. That is needed when the repository has no DOCS_PIN_TOKEN secret, since a push with the workflow's own token starts no CI.[^token][^github]" "[^latest]: package.json verify:equals(package.json#ouro.latestRelease)=$TAG
          [^token]: .github/workflows/docs-pin.yml verify:fileLine(.github/workflows/docs-pin.yml, /DOCS_PIN_TOKEN/)
          [^github]: https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow verify:urlOk(https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow)")
          number=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body "$body"
            number=$(gh pr view "$BRANCH" --json number --jq .number)
          fi
          if ! gh pr merge "$number" --auto --squash; then
            [ "$(gh pr view "$number" --json state --jq .state)" = MERGED ] || { echo "::error::Could not turn auto-merge on for #$number."; exit 1; }
          fi
          echo "Auto-merge is on for #$number: it merges once the checks main's ruleset requires pass." >> "$GITHUB_STEP_SUMMARY"
      - if: steps.pin.outputs.result == 'current'
        name: Close the docs pull request, since main already names the release
        run: |
          for number in $(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[].number'); do
            gh pr close "$number" --comment "main already points its docs at $TAG, so this pull request is not needed."
          done
          git push -q origin --delete "$BRANCH" 2>/dev/null || true
