name: Docs pin
# Points main's docs at the newest release: the install commands in README.md, site/llms.txt and
# the guides, and package.json's description, which `pnpm run docs` writes from ouro.latestRelease.
# Release dispatches it once it has tagged a release, and never waits for it. It keeps one pull
# request open on one branch, "Point the docs at a release" (a title the claims lint accepts), force-updating it, and turns auto-merge on, so
# the pull request merges once the checks main's ruleset requires pass. Release auto starts nothing
# for the commit it makes (scripts/pin-only.mjs).
# The branch is pushed, and the pull request opened, as the Ouro Current GitHub App when it is
# installed on this repository (a token from OURO_CURRENT_APP_ID and OURO_CURRENT_PRIVATE_KEY), or
# else with the DOCS_PIN_TOKEN secret. A push with either starts CI at once, with no approval
# (#1610). With neither, the push uses the workflow's own token, whose pull request runs GitHub holds
# for approval, so the workflow approves them itself (#1757). Either way it then waits for CI to
# start on the pushed commit, and fails, saying so on the pull request, when it has not in 15 minutes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The newest release to point the docs at, such as v1.3.56"
        required: true
        type: string
permissions: {}
concurrency:
  group: docs-pin
  cancel-in-progress: false
jobs:
  pin:
    runs-on: ubuntu-latest
    permissions:
      actions: write # approve the pull request's held runs
      contents: write # push the docs branch, and delete it when main already names the release
      pull-requests: write # open, retitle, close and auto-merge the pull request
    timeout-minutes: 30
    env:
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      BRANCH: docs/point-at-release
    steps:
      # Fails when the app is not installed here; the job then goes on with DOCS_PIN_TOKEN or its own token.
      - id: app
        name: Sign in as the Ouro Current app, if it is installed here
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.OURO_CURRENT_APP_ID }}
          private-key: ${{ secrets.OURO_CURRENT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app.outputs.token || secrets.DOCS_PIN_TOKEN || github.token }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm i --frozen-lockfile
      - id: pin
        name: Point the docs at the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must be a release tag such as v1.3.56, not '$TAG'."; exit 1; }
          gh release view "$TAG" --json tagName >/dev/null || { echo "::error::$TAG is not a published release."; exit 1; }
          # An older tag, dispatched late, must not point the docs back at a release that has been replaced.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name) || { echo "::error::Could not read the newest release."; exit 1; }
          if [ "$TAG" != "$latest" ]; then
            echo "::notice::$TAG is not the newest release ($latest), so the docs stay as they are."
            echo "result=stale" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/latest-release.mjs set "$TAG"
          pnpm run docs
          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice::main already points its docs at $TAG."
            echo "result=current" >> "$GITHUB_OUTPUT"
          else
            echo "result=changed" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pin.outputs.result == 'changed'
        id: push
        name: Commit the docs and push their branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -q -c "$BRANCH"
          git add -A
          git commit -q -m "Point docs at $TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push -q --force origin "$BRANCH"
      - if: steps.pin.outputs.result == 'changed'
        id: pr
        name: Open or update the pull request, and turn auto-merge on
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.DOCS_PIN_TOKEN || github.token }}
        run: |
          title="Point the docs at a release"
          body=$(printf '%s\n\n%s\n' "Release opened this pull request after it tagged $TAG, to point the docs at that tag with \`node scripts/latest-release.mjs set $TAG\` and \`pnpm run docs\`.[^latest]" "[^latest]: package.json verify:equals(package.json#ouro.latestRelease)=$TAG")
          number=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body "$body"
            number=$(gh pr view "$BRANCH" --json number --jq .number)
          fi
          if ! gh pr merge "$number" --auto --squash; then
            [ "$(gh pr view "$number" --json state --jq .state)" = MERGED ] || { echo "::error::Could not turn auto-merge on for #$number."; exit 1; }
          fi
          echo "Auto-merge is on for #$number: it merges once the checks main's ruleset requires pass." >> "$GITHUB_STEP_SUMMARY"
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - if: steps.pin.outputs.result == 'changed'
        name: Start the pull request's CI, and fail when it has not started
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.push.outputs.sha }}
          NUMBER: ${{ steps.pr.outputs.number }}
          POLLS: 90
          INTERVAL: 10
        run: |
          # A push with the workflow's own token leaves the pull request's runs held for approval, which
          # this token may give (actions: write). CI has started once it has a run on the pushed commit and
          # no run there is still held.
          for _ in $(seq 1 "$POLLS"); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&per_page=100" --jq '.workflow_runs[] | [.id, .name, (.conclusion // "")] | @tsv') || runs=
            held=$(awk -F '\t' '$3 == "action_required" { print $1 }' <<<"$runs")
            for id in $held; do
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" >/dev/null && echo "Approved held run $id." || echo "::warning::Could not approve held run $id."
            done
            if [ -z "$held" ] && awk -F '\t' '$2 == "CI" { found = 1 } END { exit !found }' <<<"$runs"; then
              echo "CI started on #$NUMBER ($SHA)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep "$INTERVAL"
          done
          message="CI has not started on #$NUMBER ($SHA) $((POLLS * INTERVAL / 60)) minutes after its push, so it cannot merge. Approve its held runs in Actions, or push an empty commit to $BRANCH."
          echo "::error::$message"
          gh pr comment "$NUMBER" --body "$message" || true
          exit 1
      - if: steps.pin.outputs.result == 'current'
        name: Close the docs pull request, since main already names the release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.DOCS_PIN_TOKEN || github.token }}
        run: |
          for number in $(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[].number'); do
            gh pr close "$number" --comment "main already points its docs at $TAG, so this pull request is not needed."
          done
          git push -q origin --delete "$BRANCH" 2>/dev/null || true
