name: Docs pin
# Points main's docs at the newest release: the install commands in README.md, site/llms.txt and
# the guides, and package.json's description, which `pnpm run docs` writes from ouro.latestRelease.
# Release dispatches it once it has tagged a release, and never waits for it. It keeps one pull
# request open on one branch, "Point the docs at a release" (a title the claims lint accepts), force-updating it, and turns auto-merge on, so
# the pull request merges once the checks main's ruleset requires pass. Release auto starts nothing
# for the commit it makes (scripts/pin-only.mjs).
# On each push to main, the stale job checks the docs' tag literals (scripts/latest-release.mjs check) and whether the
# pull request is still open. The pin job runs when a literal names another tag than ouro.latestRelease (main went red on
# one, #2344), and when the pull request is open, so it is regenerated on the main it merges into and its CI reruns, with
# auto-merge waiting for it. A refresh uses the tag in the pull request's package.json, since main's still names the release
# the pull request replaces. A pin that changes nothing closes the pull request, as on dispatch.
# The branch is pushed, and the pull request opened, as the Ouro Current GitHub App when it is
# installed on this repository (a token from OURO_CURRENT_APP_ID and OURO_CURRENT_PRIVATE_KEY), or
# else with the DOCS_PIN_TOKEN secret. A push with either starts CI at once, with no approval
# (#1610). With neither, the push uses the workflow's own token, whose pull request runs GitHub holds
# for approval, so the workflow approves them itself (#1757). Either way it then waits for CI to
# start on the pushed commit, and fails, saying so on the pull request, when it has not in 15 minutes.
# GitHub refuses a push to the pull request's branch while the merge queue holds it (GH006), so a
# run that finds it there leaves it alone instead of failing main red: the queue resolving, one way
# or another, lets the next push that still finds the docs stale pin again (#2344).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "The newest release to point the docs at, such as v1.3.56"
        required: true
        type: string
permissions: {}
concurrency:
  group: docs-pin
  cancel-in-progress: false
jobs:
  stale:
    name: Check the docs' tags, and whether the pin pull request is open
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # list the pin pull request
    env:
      GH_REPO: ${{ github.repository }}
      BRANCH: docs/point-at-release
    outputs:
      stale: ${{ steps.check.outputs.stale }}
      refresh: ${{ steps.refresh.outputs.refresh }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - id: refresh
        name: Is the pin pull request open, and which release does it point at?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty') || { echo "::error::Could not list the pin pull request."; exit 1; }
          if [ -z "$number" ]; then
            echo "refresh=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The pull request changes ouro.latestRelease, so main's still names the release it replaces: the refresh uses the pull request's.
          tag=$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$BRANCH" --jq .content | base64 -d | node -e 'let s = ""; process.stdin.on("data", (c) => (s += c)).on("end", () => console.log(JSON.parse(s).ouro?.latestRelease ?? ""))') || { echo "::error::Could not read the pin pull request's package.json."; exit 1; }
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::The pin pull request's ouro.latestRelease is not a release tag: '$tag'."; exit 1; }
          echo "refresh=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - id: check
        name: Compare the docs' tags with the release to point them at
        env:
          REFRESH: ${{ steps.refresh.outputs.refresh }}
          PR_TAG: ${{ steps.refresh.outputs.tag }}
        run: |
          # On a refresh the release is the pull request's, which is the newer one; otherwise it is main's ouro.latestRelease.
          if [ "$REFRESH" = true ]; then
            tag="$PR_TAG"
          else
            tag=$(node scripts/latest-release.mjs)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if node scripts/latest-release.mjs check; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
  pin:
    needs: [stale]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.stale.outputs.stale == 'true' || needs.stale.outputs.refresh == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write # approve the pull request's held runs
      contents: write # push the docs branch, and delete it when main already names the release
      pull-requests: write # open, retitle, close and auto-merge the pull request
    timeout-minutes: 30
    env:
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || needs.stale.outputs.tag }}
      BRANCH: docs/point-at-release
    steps:
      # Fails when the app is not installed here; the job then goes on with DOCS_PIN_TOKEN or its own token.
      - id: app
        name: Sign in as the Ouro Current app, if it is installed here
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.OURO_CURRENT_APP_ID }}
          private-key: ${{ secrets.OURO_CURRENT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app.outputs.token || secrets.DOCS_PIN_TOKEN || github.token }}
      - id: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        continue-on-error: true
      - name: pnpm setup failed; trying it once more (#1911)
        if: steps.pnpm.outcome == 'failure'
        run: echo "::warning title=pnpm setup failed::pnpm/action-setup could not install pnpm (ourostack/ouro-ui#1911); setting it up once more."
      - if: steps.pnpm.outcome == 'failure'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - id: install
        run: pnpm i --frozen-lockfile
        continue-on-error: true
      - name: pnpm install failed; trying it once more (#1914)
        if: steps.install.outcome == 'failure'
        run: echo "::warning title=pnpm install failed::pnpm i failed, which the 1ES feed's HTTP 429s can cause (ourostack/ouro-ui#1914); installing once more."
      - if: steps.install.outcome == 'failure'
        run: pnpm i --frozen-lockfile
      - id: pin
        name: Point the docs at the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must be a release tag such as v1.3.56, not '$TAG'."; exit 1; }
          # Tells a release that genuinely does not exist apart from a GitHub API hiccup, retrying the second kind
          # (ourostack/ouro-ui#2469: v1.3.505 was published all along).
          node scripts/docs-pin-release-check.mjs "$TAG"
          # An older tag, dispatched late, must not point the docs back at a release that has been replaced.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name) || { echo "::error::Could not read the newest release."; exit 1; }
          if [ "$TAG" != "$latest" ]; then
            echo "::notice::$TAG is not the newest release ($latest), so the docs stay as they are."
            echo "result=stale" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/latest-release.mjs set "$TAG"
          pnpm run docs
          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice::main already points its docs at $TAG."
            echo "result=current" >> "$GITHUB_OUTPUT"
          else
            echo "result=changed" >> "$GITHUB_OUTPUT"
          fi
      # Main moved, but the pull request's docs may already be what this run just generated: the same files, the same
      # contents. Then pushing again changes nothing the pull request would merge and only restarts its CI (about 12
      # minutes each time, so a pin could wait an hour behind a busy main). A pull request whose checks failed or were
      # cancelled is pushed again, as before, so a red or superseded run still gets another. So is one GitHub doesn't call
      # mergeable: a branch cut before the last pin merged holds these docs too, but conflicts with main on that pin's lines,
      # and GitHub runs no CI on it, so only a rebuild from main can merge it (#2881).
      - if: steps.pin.outputs.result == 'changed'
        id: same
        name: Leave the pull request alone when it already holds these docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          number=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty') || exit 0
          [ -n "$number" ] || exit 0
          mergeable=$(gh pr view "$number" --json mergeable --jq .mergeable) || exit 0
          [ "$mergeable" = MERGEABLE ] || exit 0
          failing=$(gh pr view "$number" --json statusCheckRollup --jq '[.statusCheckRollup[]? | select(.conclusion == "FAILURE" or .conclusion == "CANCELLED" or .conclusion == "TIMED_OUT" or .conclusion == "ACTION_REQUIRED")] | length') || exit 0
          [ "$failing" = 0 ] || exit 0
          git add -A
          mine=$(git diff --cached --name-only | sort)
          theirs=$(gh pr diff "$number" --name-only | sort) || exit 0
          [ -n "$mine" ] && [ "$mine" = "$theirs" ] || exit 0
          git fetch -q --depth=1 origin "$BRANCH" || exit 0
          git diff --cached --quiet FETCH_HEAD -- $mine || exit 0
          echo "same=true" >> "$GITHUB_OUTPUT"
          echo "#$number already holds these docs, so its CI keeps running and nothing is pushed." >> "$GITHUB_STEP_SUMMARY"
      # GitHub refuses a push to a branch whose pull request is in the merge queue (GH006): the queue holds its own copy of
      # the branch, so a force-push here both fails and would desync it. Rather than fail main red over a push that was
      # never going to land, this run leaves the queued pull request alone; the queue resolving (merge or drop) lets the
      # next push to main, if the docs are still stale then, pin again (#2344).
      - if: steps.pin.outputs.result == 'changed' && steps.same.outputs.same != 'true'
        id: queued
        name: Leave the pull request alone while it is in the merge queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          number=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty') || exit 0
          [ -n "$number" ] || exit 0
          queued=$(gh api graphql -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){pullRequest(number:$n){isInMergeQueue}}}' -f o="${GITHUB_REPOSITORY%/*}" -f r="${GITHUB_REPOSITORY#*/}" -F n="$number" --jq .data.repository.pullRequest.isInMergeQueue) || exit 0
          [ "$queued" = true ] || exit 0
          echo "queued=true" >> "$GITHUB_OUTPUT"
          echo "#$number is in the merge queue; GitHub refuses a push to its branch there (GH006), so this run leaves it alone (#2344). The queue finishing, one way or another, lets the next push that still finds the docs stale pin again." >> "$GITHUB_STEP_SUMMARY"
      - if: steps.pin.outputs.result == 'changed' && steps.same.outputs.same != 'true' && steps.queued.outputs.queued != 'true'
        id: push
        name: Commit the docs and push their branch
        env:
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # Author the commit as the app that opens the pull request, so the ruleset's attribution rule sees one identity
          # (#3991); without the app, as before.
          name="github-actions[bot]"; email="41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$APP_SLUG" ] && uid=$(GH_TOKEN="$APP_TOKEN" gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id); then
            name="${APP_SLUG}[bot]"; email="${uid}+${APP_SLUG}[bot]@users.noreply.github.com"
          fi
          git config user.name "$name"
          git config user.email "$email"
          git switch -q -c "$BRANCH"
          git add -A
          git commit -q -m "Point docs at $TAG"
          # A branch that already pins this release or a newer one (rebuilt by hand under the attributed account) is never overwritten (#4116).
          if git fetch -q --depth=1 origin "$BRANCH" 2>/dev/null && node scripts/branch-holds-pin.mjs docs "$TAG"; then
            echo "::notice::$BRANCH already pins $TAG or newer, so it is not pushed over."
            echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            git push -q --force origin "$BRANCH"
          fi
      - if: steps.pin.outputs.result == 'changed' && steps.same.outputs.same != 'true' && steps.queued.outputs.queued != 'true'
        id: pr
        name: Open or update the pull request, and turn auto-merge on
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.DOCS_PIN_TOKEN || github.token }}
        run: |
          title="Point the docs at a release"
          body=$(printf '%s\n\n%s\n' "Release opened this pull request after it tagged $TAG, to point the docs at that tag with \`node scripts/latest-release.mjs set $TAG\` and \`pnpm run docs\`.[^latest]" "[^latest]: package.json verify:equals(package.json#ouro.latestRelease)=$TAG")
          number=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body "$body"
            # A pull request pushed again was dropped from the queue, so its jump (Docs pin jump) is spent.
            gh pr edit "$number" --remove-label pin-jumped || true
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body "$body"
            number=$(gh pr view "$BRANCH" --json number --jq .number)
          fi
          # Merge with an explicit message: GitHub's default appends bot Co-authored-by lines, which the ruleset rejects.
          subject=$(gh pr view "$number" --json title,number --jq '"\(.title) (#\(.number))"')
          message=$(gh pr view "$number" --json body --jq .body | tr -d '\r' | grep -v -i -E '^[[:space:]]*[A-Za-z-]+-by[[:space:]]*:.*(\[bot\]|(^|[^A-Za-z0-9])(copilot|claude|anthropic|openai|chatgpt|gpt|codex|gemini|cursor|devin|aider)([^A-Za-z]|$))' || true)
          # GitHub can answer a request to turn auto-merge on with a server error, most often on a pull request it has just
          # opened, and sometimes turns it on all the same: each try checks whether it is on, or merged, before another.
          on=""
          for try in 1 2 3 4 5; do
            if gh pr merge "$number" --auto --squash --subject "$subject" --body "$message"; then on=1; break; fi
            state=$(gh pr view "$number" --json state,autoMergeRequest --jq 'if .state == "MERGED" or .autoMergeRequest != null then "on" else "off" end') || state=""
            if [ "$state" = on ]; then on=1; break; fi
            if [ "$try" -lt 5 ]; then sleep "${MERGE_RETRY_SECONDS:-15}"; fi
          done
          [ -n "$on" ] || { echo "::error::Could not turn auto-merge on for #$number after 5 tries."; exit 1; }
          echo "Auto-merge is on for #$number: it merges once the checks main's ruleset requires pass." >> "$GITHUB_STEP_SUMMARY"
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - if: steps.pin.outputs.result == 'changed' && steps.same.outputs.same != 'true' && steps.queued.outputs.queued != 'true'
        name: Start the pull request's CI, and fail when it has not started
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.push.outputs.sha }}
          NUMBER: ${{ steps.pr.outputs.number }}
          POLLS: 90
          INTERVAL: 10
        run: |
          # A push with the workflow's own token leaves the pull request's runs held for approval, which
          # this token may give (actions: write). CI has started once it has a run on the pushed commit and
          # no run there is still held.
          for _ in $(seq 1 "$POLLS"); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&per_page=100" --jq '.workflow_runs[] | [.id, .name, (.conclusion // "")] | @tsv') || runs=
            held=$(awk -F '\t' '$3 == "action_required" { print $1 }' <<<"$runs")
            for id in $held; do
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" >/dev/null && echo "Approved held run $id." || echo "::warning::Could not approve held run $id."
            done
            if [ -z "$held" ] && awk -F '\t' '$2 == "CI" { found = 1 } END { exit !found }' <<<"$runs"; then
              echo "CI started on #$NUMBER ($SHA)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep "$INTERVAL"
          done
          message="CI has not started on #$NUMBER ($SHA) $((POLLS * INTERVAL / 60)) minutes after its push, so it cannot merge. Approve its held runs in Actions, or push an empty commit to $BRANCH."
          echo "::error::$message"
          gh pr comment "$NUMBER" --body "$message" || true
          exit 1
      - if: steps.pin.outputs.result == 'current'
        name: Close the docs pull request, since main already names the release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.DOCS_PIN_TOKEN || github.token }}
        run: |
          for number in $(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[].number'); do
            gh pr close "$number" --comment "main already points its docs at $TAG, so this pull request is not needed."
          done
          git push -q origin --delete "$BRANCH" 2>/dev/null || true
