name: Native Input Contracts Proof
on:
  push:
    branches: [probe/final-state-contracts]
permissions:
  contents: read
jobs:
  characterize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        vitest: [4.1.11, 5.0.3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: mkdir -p contract-evidence && git rev-parse HEAD > contract-evidence/source.txt
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - name: Select each actual supported test toolchain
        env:
          VITEST: ${{ matrix.vitest }}
        run: |
          set -euo pipefail
          pnpm add -Dw --save-exact "vitest@$VITEST" "@vitest/browser-playwright@$VITEST" "@vitest/coverage-istanbul@$VITEST" "@playwright/test@1.64.0" "playwright@1.64.0" 2>&1 | tee contract-evidence/toolchain.log
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Characterize the original fixture and real frame-queued focus
        shell: bash
        run: |
          set -euo pipefail
          path=registry/ouro/components/ouro/swipe-actions/swipe-actions.test.tsx
          git show "9a8e0d86d3fdcfa746de1b3b2eb3cad0e5dbf226:$path" > "$path"
          git diff 9a8e0d86d3fdcfa746de1b3b2eb3cad0e5dbf226 -- registry ':!registry/**/*.test.tsx' > contract-evidence/runtime.diff
          test ! -s contract-evidence/runtime.diff
          sha256sum "$path" proof/native-sheet-focus-boundary.test.tsx proof/native-input-rtl.ts proof/native-input-contracts.config.ts > contract-evidence/digests.txt
          pnpm list vitest @vitest/browser-playwright playwright --depth 0 --json > contract-evidence/tools.json
          if pnpm exec vitest run --config proof/native-input-contracts.config.ts --project=ouro-chromium --project=ouro-webkit --reporter=default --reporter=json --outputFile=contract-evidence/results.json > contract-evidence/browser.log 2>&1; then code=0; else code=$?; fi
          printf '%s\n' "$code" > contract-evidence/browser.exit
          test -s contract-evidence/results.json
          exit "$code"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-contract-${{ matrix.vitest }}
          path: |
            contract-evidence/
            .vitest/attachments/
          if-no-files-found: error
          include-hidden-files: true
