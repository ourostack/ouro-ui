name: Agent usability
# Scores the screens fresh agents built with shadcn/ui, shadcn/ui with its skill, and Ouro HX
# (scripts/agent-usability/README.md): tsc, lint, axe, screenshots and each screen's behavior
# checks against the agent output committed under scripts/agent-usability/runs/<date>/. The
# agents themselves run elsewhere, because they cost model calls; this workflow makes none.
# It is not a required check: it never runs on pull requests, and low scores are results,
# not failures. The results table and every screen's summary go into the job summary, and
# the scores and screenshots into the agent-usability artifact.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Run folder under scripts/agent-usability/runs/ (default: the newest)"
        required: false
        default: ""
  schedule:
    - cron: "41 7 * * 1"
permissions:
  contents: read
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - env:
          DATE: ${{ inputs.date }}
        run: node scripts/agent-usability/score-runs.mts "$DATE" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-usability
          path: scripts/agent-usability/runs/*/*/*/score/
          if-no-files-found: ignore
