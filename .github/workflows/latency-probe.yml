name: latency-probe
on:
  push:
    branches: [fix/latency-runner-baseline]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        throttle: ["4", "4", "4.6", "4.6"]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
      env:
        OURO_SYSTEM_PACKAGES: image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - run: nproc; grep -m1 "model name" /proc/cpuinfo; lscpu || true; cat /sys/devices/system/cpu/cpu*/topology/thread_siblings_list; cat /sys/fs/cgroup/cpuset.cpus.effective || true; which taskset || true
      - run: pnpm i --frozen-lockfile
      - run: pnpm test:latency --project site-latency
        env:
          LATENCY_AB: ${{ matrix.throttle }}
