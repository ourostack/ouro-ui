name: Browser cache
# Keeps Playwright's browsers in main's Actions cache (.github/actions/playwright-browsers), where
# every pull request, merge-queue and release run can restore them: a cache a pull request saves
# is visible to that pull request only. Runs when the Playwright version or the action changes,
# weekly so that a cache nothing restored for a week is not evicted for good, and by hand.
on:
  push:
    branches: [main]
    paths:
      - pnpm-lock.yaml
      - .github/actions/playwright-browsers/**
      - .github/workflows/browser-cache.yml
      - scripts/retry.sh
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The sets the workflows install.
        browsers: [chromium, chromium webkit]
    name: browsers (${{ matrix.browsers }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: ${{ matrix.browsers }}
          system-packages: "false"
