name: Safari squircle
# Measures the squircle polyfill in real Safari (no native corner-shape, so the fallback runs) on a hosted macOS runner: idle work at rest and typing p95, polyfill off and on.
on:
  push:
    branches: [safari-squircle]
  workflow_dispatch:
    inputs:
      enforce:
        description: Fail when typing p95 with the polyfill is over the budget
        required: false
        default: "0"
        type: string
permissions:
  contents: read
jobs:
  safari:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - run: pnpm i --frozen-lockfile
      - run: npm install --prefix "$RUNNER_TEMP/sel" --no-package-lock selenium-webdriver && ln -s "$RUNNER_TEMP/sel/node_modules/selenium-webdriver" node_modules/selenium-webdriver
      - run: sudo safaridriver --enable
      - run: |
          for u in /docs/text-field/; do
            SQUIRCLE_URL="https://ui.ouroboros.bot$u" node scripts/safari-squircle.mjs | grep -E 'hosts|"p95"|perSecond|lateMs' || true
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: safari-squircle
          path: safari-squircle/
