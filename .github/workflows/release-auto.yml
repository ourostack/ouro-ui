name: Release auto
# Starts the next release on its own, so a merge to main reaches consumers without anyone dispatching
# a workflow. It runs when a push to main finishes CI or the screen-reader lane, and when a release
# ends. When changes/ lists a change the newest release's notes lack, no release is running, and
# both CI and the screen-reader lane have finished on that commit with the lane passed, it
# dispatches Release (release.yml) for the next patch version on that exact commit, so the suite
# that tested the commit on main is the proof and nothing runs twice. Release judges CI's required
# checks itself. If several commits land while a release runs, the release that follows takes the
# commit whose runs finished last, which is the newest to finish. A failed release starts nothing by
# itself: the next push's green runs do, once the cause is fixed. It adds no gate and relaxes none.
# A commit that only points the docs at a release (docs-pin.yml, scripts/pin-only.mjs) starts nothing.
on:
  workflow_run:
    workflows: [CI, Screen reader]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      after:
        description: "Set by a Release run that is ending: its run id, which does not count as a release still running"
        required: false
        type: string
permissions: {}
concurrency:
  group: release-auto
  cancel-in-progress: false
jobs:
  start:
    runs-on: ubuntu-latest
    permissions:
      actions: write # start Release
      contents: read # read changes/ and the newest release
      issues: write # open or comment on "Release waiting" when a release has waited over an hour (wait_for)
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      AFTER: ${{ inputs.after }}
      EVENT: ${{ github.event_name }}
      RUN_EVENT: ${{ github.event.workflow_run.event }}
      RUN_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release the newest commit whose runs passed
        run: |
          [[ "${AFTER:-0}" =~ ^[0-9]+$ ]] || { echo "::error::after must be a run id."; exit 1; }
          if [ "$EVENT" = workflow_run ]; then
            [ "$RUN_EVENT" = push ] || { echo "::notice::Only a push to main starts a release."; exit 0; }
            sha=$RUN_SHA
          else
            sha=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
          fi
          # Fragments stay in changes/ after a release, so a change is new when changes/ at the newest release's tag
          # lacked its line (scripts/changes.mjs). That release's notes hold only its own lines, so counting against
          # them called the release before's lines new again, and released with no new change (#1485).
          last=$(gh release view --json tagName --jq .tagName)
          git cat-file -e "$sha^{commit}" 2>/dev/null || git fetch -q --no-tags --depth=1 origin "$sha"
          if [ -n "$last" ] && ! git rev-parse -q --verify "refs/tags/$last" >/dev/null; then git fetch -q --no-tags --depth=1 origin "refs/tags/$last:refs/tags/$last"; fi
          # A wait says why, in the notice and the step summary. One that has lasted over an hour (scripts/release-wait.mjs: the
          # oldest first-parent commit of main after the newest release's tag) opens or comments on "Release waiting" and fails
          # this run, so nothing waits silently for long.
          wait_for() {
            echo "::notice::$1"
            printf -- '- %s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            [ -n "$last" ] || return 0
            git fetch -q --no-tags --depth=2 origin "refs/tags/$last:refs/tags/$last"
            git fetch -q --no-tags --shallow-since="$(git log -1 --format=%cI "$last^")" origin main
            read -r oldest minutes state <<< "$(git log --first-parent --reverse --format='%H %ct' "$last..origin/main" | node scripts/release-wait.mjs)" || true
            [ "${state:-}" = over ] || return 0
            msg="$1 Its oldest unreleased commit, $oldest, has waited $minutes minutes, over an hour."
            run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            printf -- '- %s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$msg Release waiting: $run"
            scripts/scheduled-failure.sh "$run" "Release waiting" "$msg" "$msg: $run"
            exit 1
          }
          fresh=$(node --input-type=module -e 'import { releasedAt } from "./scripts/changes.mjs"; const [now, last] = process.argv.slice(1); const released = new Set(last ? releasedAt(last) : []); console.log(releasedAt(now).filter((line) => !released.has(line)).length);' "$sha" "$last")
          [ "$fresh" -gt 0 ] || { echo "::notice::changes/ lists no change the newest release lacks, so there is nothing to release."; exit 0; }
          # The docs pin (docs-pin.yml) changes what nobody ships: its commit and its parent are read here, the parent fetched when the checkout lacks it.
          git cat-file -e "$sha^" 2>/dev/null || git fetch -q --depth=2 origin "$sha" || true
          if why=$(node scripts/pin-only.mjs "$sha^" "$sha" 2>&1); then
            echo "::notice::$sha only points the docs at a release; nothing to release."
            exit 0
          fi
          echo "$sha is not only a docs pin, so it releases: $why"
          # Both of main's runs for the commit must have ended, the lane passed; the later of the two finishing starts this.
          lane=$(gh run list --workflow screen-reader.yml --commit "$sha" --event push --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          [ "$lane" -gt 0 ] || { wait_for "The screen-reader lane has not passed on $sha yet; its end starts this again."; exit 0; }
          ci=$(gh run list --workflow ci.yml --commit "$sha" --event push --json status,conclusion --jq '[.[] | select(.status == "completed" and .conclusion != "cancelled")] | length')
          [ "$ci" -gt 0 ] || { wait_for "CI has not finished on $sha yet; its end starts this again."; exit 0; }
          # The workflow files Release pushes with the release commit must already be main's tip's: GitHub refuses a push by
          # the workflow's token that adds or changes workflow content no branch holds (ourostack/ouro-ui#1951). A commit
          # whose workflows main has moved past waits for a newer commit, which its own runs' end starts.
          git fetch -q --no-tags --depth=1 origin main
          if [ "$(git rev-parse -q --verify "$sha:.github/workflows" || echo none)" != "$(git rev-parse -q --verify "FETCH_HEAD:.github/workflows" || echo none)" ]; then
            wait_for "main's .github/workflows changed after $sha, so the release waits for a commit that carries them; that commit's runs ending starts this again (#1951)."
            exit 0
          fi
          for status in queued in_progress; do
            running=$(gh run list --workflow release.yml --status "$status" --json databaseId --jq "[.[] | select(.databaseId != ${AFTER:-0})] | length")
            [ "$running" -eq 0 ] || { wait_for "Release is $status; the release that follows starts this again."; exit 0; }
          done
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::The newest release, \"$latest\", is not a tag such as v1.2.3."; exit 1; }
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          echo "Releasing v$version, the release after $latest, from main's $sha." >> "$GITHUB_STEP_SUMMARY"
          gh workflow run release.yml --ref main -f version="$version" -f sha="$sha"
