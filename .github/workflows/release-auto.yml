name: Release auto
# Starts the next release on its own, so a merge to main reaches consumers without anyone dispatching
# a workflow. It runs when a push to main finishes CI or the screen-reader lane, and when a release
# ends. When changes/ lists a change the newest release's notes lack, no release is running, and
# both CI and the screen-reader lane have finished on that commit with the lane passed, it
# dispatches Release (release.yml) for the next patch version on that exact commit, so the suite
# that tested the commit on main is the proof and nothing runs twice. Release judges CI's required
# checks itself. If several commits land while a release runs, the release that follows takes the
# commit whose runs finished last, which is the newest to finish. A failed release starts nothing by
# itself: the next push's green runs do, once the cause is fixed. It adds no gate and relaxes none.
on:
  workflow_run:
    workflows: [CI, Screen reader]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      after:
        description: "Set by a Release run that is ending: its run id, which does not count as a release still running"
        required: false
        type: string
permissions: {}
concurrency:
  group: release-auto
  cancel-in-progress: false
jobs:
  start:
    runs-on: ubuntu-latest
    permissions:
      actions: write # start Release
      contents: read # read changes/ and the newest release
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      AFTER: ${{ inputs.after }}
      EVENT: ${{ github.event_name }}
      RUN_EVENT: ${{ github.event.workflow_run.event }}
      RUN_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Release the newest commit whose runs passed
        run: |
          [[ "${AFTER:-0}" =~ ^[0-9]+$ ]] || { echo "::error::after must be a run id."; exit 1; }
          if [ "$EVENT" = workflow_run ]; then
            [ "$RUN_EVENT" = push ] || { echo "::notice::Only a push to main starts a release."; exit 0; }
            sha=$RUN_SHA
          else
            sha=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
          fi
          # Fragments stay in changes/ after a release, so a change is new when the newest release's notes lack its line (scripts/changes.mjs).
          notes=$(gh release view --json body --jq .body)
          fresh=0
          for name in $(gh api "repos/$GITHUB_REPOSITORY/contents/changes?ref=$sha" --jq '.[] | select(.name | endswith(".md")) | .name'); do
            while IFS= read -r line; do
              [[ "$line" == "- "* ]] || continue
              grep -qxF -- "$line" <<<"$notes" || fresh=$((fresh + 1))
            done < <(gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/changes/$name?ref=$sha")
          done
          [ "$fresh" -gt 0 ] || { echo "::notice::changes/ lists no change the newest release lacks, so there is nothing to release."; exit 0; }
          # Both of main's runs for the commit must have ended, the lane passed; the later of the two finishing starts this.
          lane=$(gh run list --workflow screen-reader.yml --commit "$sha" --event push --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          [ "$lane" -gt 0 ] || { echo "::notice::The screen-reader lane has not passed on $sha yet; its end starts this again."; exit 0; }
          ci=$(gh run list --workflow ci.yml --commit "$sha" --event push --json status,conclusion --jq '[.[] | select(.status == "completed" and .conclusion != "cancelled")] | length')
          [ "$ci" -gt 0 ] || { echo "::notice::CI has not finished on $sha yet; its end starts this again."; exit 0; }
          for status in queued in_progress; do
            running=$(gh run list --workflow release.yml --status "$status" --json databaseId --jq "[.[] | select(.databaseId != ${AFTER:-0})] | length")
            [ "$running" -eq 0 ] || { echo "::notice::Release is $status; the release that follows starts this again."; exit 0; }
          done
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::The newest release, \"$latest\", is not a tag such as v1.2.3."; exit 1; }
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          echo "Releasing v$version, the release after $latest, from main's $sha." >> "$GITHUB_STEP_SUMMARY"
          gh workflow run release.yml --ref main -f version="$version" -f sha="$sha"
