name: Screen reader lane
# The screen-reader lane itself. Real screen readers read the components: VoiceOver on macOS (WebKit) and
# NVDA on Windows (Chromium), through Guidepup (playwright.screen-reader.config.ts, registry/ouro/e2e/screen-reader/).
# Only a workflow_call starts it: screen-reader.yml calls it on every push to main, nightly, and by dispatch,
# and ci.yml's screen-reader job calls it when its plan selects specs, which it does for no pull request today
# (docs/guides/screen-reader-lane.md). It runs on a commit of main right after release.yml tags it, off the tag's path;
# screen-reader-revert.yml reverts a commit it fails twice on.
# scripts/sr-classify.mjs sorts a failure into accessibility (an utterance missing or wrong: it blocks a release)
# and infrastructure (the runner could not drive its screen reader: a release retries once, and a nightly run or a
# push to main opens or updates one `screen-reader-infra` issue from screen-reader.yml's report job), and harness
# (Playwright refused the lane's own command: no retry, no issue). Guidepup's setup rewrites VoiceOver and TCC
# settings, which die with the ephemeral runner, so the lane runs only on GitHub's hosted runners, with read-only
# contents and no secret. A fork's pull request never runs it: ci.yml calls it only for a pull request whose head
# repository is this one. A dispatch needs write access and tests only the tip of the dispatched branch
# (docs/guides/screen-reader-lane.md). This file writes nothing: a called workflow's jobs hold no more than the
# caller grants, and every caller grants contents: read (scripts/workflows.test.mjs).
on:
  workflow_call:
    inputs:
      source_sha:
        description: "The commit to test: its full SHA (screen-reader.yml passes the push's or dispatched branch's tip, ci.yml the pull request's head)"
        required: true
        type: string
      specs:
        description: "The spec files to run, separated by spaces (registry/ouro/e2e/screen-reader/*.sr.spec.ts), or all"
        required: true
        type: string
      head_repo:
        description: "The pull request's head repository, owner/name: the lane refuses any other"
        required: true
        type: string
      strict:
        description: "Only VoiceOver on macos-26, advisory, with the hint-only fallback off (SR_STRICT=1): screen-reader.yml's nightly strict run (ourostack/ouro-ui#2085)"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  lane:
    # VoiceOver on macos-26, what current users run, and NVDA gate the run. VoiceOver on macos-15 runs
    # beside them nightly so main shows what older macOS's users hear, but it is advisory: its failure
    # does not fail the run, which release.yml reads, and the nightly run files or updates one issue for
    # it (screen-reader.yml). macOS runners are the scarce pool, shared with the organisation's other
    # repositories, so it runs only nightly: not on each push to main, where it doubled the lane's macOS
    # demand and queued releases behind it (#2097), nor for a dispatch or a pull request.
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(inputs.strict && '[{"os":"macos-26","project":"voiceover","advisory":true}]' || github.event_name == 'schedule' && '[{"os":"macos-26","project":"voiceover","advisory":false},{"os":"macos-15","project":"voiceover","advisory":true},{"os":"windows-2025","project":"nvda","advisory":false}]' || '[{"os":"macos-26","project":"voiceover","advisory":false},{"os":"windows-2025","project":"nvda","advisory":false}]') }}
    name: ${{ matrix.project }} (${{ matrix.os }})${{ inputs.strict && ', strict' || '' }}${{ matrix.advisory && ', advisory' || '' }}
    continue-on-error: ${{ matrix.advisory }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      PROJECT: ${{ matrix.project }}
      SPECS: ${{ inputs.specs || 'all' }}
      # The strict run judges every step by what VoiceOver says alone: no fallback to describing the focus (screen-reader.ts).
      SR_STRICT: ${{ inputs.strict && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - id: guard
        name: Check the commit and the runner
        env:
          EVENT: ${{ github.event_name }}
          DISPATCHED_SHA: ${{ github.sha }}
          RUNNER_KIND: ${{ runner.environment }}
          HEAD_REPO: ${{ inputs.head_repo }}
          REPO: ${{ github.repository }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source_sha must be a full 40-character commit SHA in lower case, not '$SOURCE_SHA'."; exit 1; }
          # Only the dispatched branch's own tip: never another commit fetched by SHA, such as a fork's.
          [ "$EVENT" != workflow_dispatch ] || [ "$SOURCE_SHA" = "$DISPATCHED_SHA" ] || { echo "::error::source_sha $SOURCE_SHA is not the tip of the dispatched branch ($DISPATCHED_SHA)."; exit 1; }
          # A pull request runs the lane only from this repository: a fork's code is not this repository's branch.
          [ "$EVENT" != pull_request ] || [ "$HEAD_REPO" = "$REPO" ] || { echo "::error::A pull request from a fork ($HEAD_REPO) never runs the screen-reader lane."; exit 1; }
          [ -z "$HEAD_REPO" ] || [ "$HEAD_REPO" = "$REPO" ] || { echo "::error::The head repository $HEAD_REPO is not $REPO: the screen-reader lane never runs for a fork."; exit 1; }
          # The specs are all, or spec files of this lane and nothing else: they become arguments of pnpm test:sr.
          [ "$SPECS" = all ] || [[ "$SPECS" =~ ^registry/ouro/e2e/screen-reader/[a-z0-9-]+\.sr\.spec\.ts([[:space:]]+registry/ouro/e2e/screen-reader/[a-z0-9-]+\.sr\.spec\.ts)*$ ]] || { echo "::error::specs must be all, or spec files of registry/ouro/e2e/screen-reader, not '$SPECS'."; exit 1; }
          head=$(git rev-parse HEAD)
          [ "$head" = "$SOURCE_SHA" ] || { echo "::error::Checked out $head, not $SOURCE_SHA."; exit 1; }
          # Guidepup's setup rewrites VoiceOver and TCC settings: only on a throwaway hosted runner.
          [ "$RUNNER_KIND" = github-hosted ] || { echo "::error::The screen-reader lane runs only on GitHub-hosted runners, not '$RUNNER_KIND'."; exit 1; }
          echo "Testing $SOURCE_SHA with $PROJECT on a GitHub-hosted runner: $SPECS."
      - id: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        continue-on-error: true
      - name: pnpm setup failed; trying it once more (#1911)
        if: steps.pnpm.outcome == 'failure'
        run: echo "::warning title=pnpm setup failed::pnpm/action-setup could not install pnpm (ourostack/ouro-ui#1911); setting it up once more."
      - if: steps.pnpm.outcome == 'failure'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - id: install
        run: pnpm i --frozen-lockfile
        continue-on-error: true
      - name: pnpm install failed; trying it once more (#1914)
        if: steps.install.outcome == 'failure'
        run: echo "::warning title=pnpm install failed::pnpm i failed, which the 1ES feed's HTTP 429s can cause (ourostack/ouro-ui#1914); installing once more."
      - if: steps.install.outcome == 'failure'
        run: pnpm i --frozen-lockfile
      - run: pnpm exec playwright install --with-deps webkit chromium
      # @guidepup/setup's command, by the bin name its installed package.json declares.
      - id: guidepup
        name: Find Guidepup's setup command
        run: echo "bin=$(node -p 'Object.keys(JSON.parse(require("fs").readFileSync("node_modules/@guidepup/setup/package.json", "utf8")).bin)[0]')" >> "$GITHUB_OUTPUT"
      # Two phases, in this order: `setup --ci` configures the OS (macOS: VoiceOver's AppleScript
      # control and TCC automation; Windows: the registry keys NVDA needs), then `install`
      # downloads the screen reader assets this @guidepup/guidepup version needs (portable NVDA).
      # A setup retry, never a timing one: macOS at times refuses the keystrokes Guidepup's setup sends to turn on Do Not
      # Disturb ("osascript is not allowed to send keystrokes", ourostack/ouro-ui#2396), and the lane then never runs a test.
      - id: os
        name: Set up the OS for screen reader automation
        continue-on-error: true
        env:
          GUIDEPUP: ${{ steps.guidepup.outputs.bin }}
        run: pnpm exec "$GUIDEPUP" setup --ci
      - name: Guidepup's OS setup failed; trying it once more (#2396)
        if: steps.os.outcome == 'failure'
        run: echo "::warning title=Guidepup setup failed::Guidepup's OS setup failed, as when macOS refuses osascript's keystrokes for Do Not Disturb (ourostack/ouro-ui#2396); setting up once more."
      - if: steps.os.outcome == 'failure'
        env:
          GUIDEPUP: ${{ steps.guidepup.outputs.bin }}
        run: pnpm exec "$GUIDEPUP" setup --ci
      - name: Install the screen reader assets
        env:
          GUIDEPUP: ${{ steps.guidepup.outputs.bin }}
        run: pnpm exec "$GUIDEPUP" install
      - id: sr
        name: Screen-reader tests
        run: |
          set +e
          # The specs the change reaches (or every spec). Spec paths come before --project, which takes several names.
          specs=()
          if [ "$SPECS" != all ]; then read -r -a specs <<< "$SPECS"; fi
          pnpm test:sr "${specs[@]}" --project "$PROJECT" 2>&1 | tee "$RUNNER_TEMP/sr.log"
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      # Runs whatever failed before it (but not a failed guard): no log means the tests never ran.
      - id: classify
        name: Classify the result
        if: always() && steps.guard.outcome == 'success'
        env:
          EXIT: ${{ steps.sr.outputs.exit }}
        # Main's red-main auto-revert (ourostack/.github, tools/red-main) never reverts a job annotated `title=infra`, so a
        # failure that is not an accessibility finding (infrastructure, harness, or no verdict at all) is annotated: only a
        # finding about the components reverts the commit behind it.
        run: |
          status=0
          node scripts/sr-classify.mjs "$RUNNER_TEMP/sr.log" "$EXIT" | tee "$RUNNER_TEMP/sr-class.txt" || status=$?
          class="$(sed -n 's/^SR_CLASS=//p' "$RUNNER_TEMP/sr-class.txt")"
          if [ "$status" != 0 ] && [ "$class" != accessibility ]; then
            echo "::error title=infra::Screen-reader lane: ${class:-no verdict}, not a finding about the components, so auto-revert leaves this commit."
          fi
          exit "$status"
      # The report is for reading a failure, and nothing downloads it: the classify step above is the verdict. An upload
      # the runner cannot make (ENOTFOUND on GitHub's artifact service, #2254) is tried once more, then left as a warning.
      - id: upload
        if: always() && steps.classify.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with: &sr-report
          name: screen-reader-${{ matrix.project }}-${{ matrix.os }}${{ inputs.strict && '-strict' || '' }}
          path: |
            ${{ runner.temp }}/sr.log
            ${{ runner.temp }}/sr-class.txt
            playwright-report/screen-reader/
            test-results/screen-reader/
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true
      - id: upload-again
        if: always() && steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with: *sr-report
      - if: always() && steps.upload-again.outcome == 'failure'
        run: echo "::warning title=Screen-reader report not uploaded::The runner could not upload the report twice (ourostack/ouro-ui#2254). The lane's verdict is the classify step's; the log above has the specs' output."
