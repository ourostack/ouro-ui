name: Screen reader
# Runs the screen-reader lane (screen-reader-lane.yml) on every push to main, nightly, and by dispatch;
# release.yml tags a commit without waiting for it, and screen-reader-revert.yml reverts a commit whose push run fails here. This
# file alone may write issues: its report job opens or updates one `screen-reader-infra` issue after an
# infrastructure failure on a nightly run or a push to main (scripts/sr-classify.mjs), and its advisory job
# one issue when the nightly run's advisory VoiceOver on macos-15 fails. ci.yml never calls
# this file, since GitHub validates a called workflow's jobs against the caller's permissions even when a
# job's `if` skips them: ci.yml calls the read-only lane for a pull request (docs/guides/screen-reader-lane.md).
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      source_sha:
        description: "The commit to test: the full SHA of the dispatched branch's tip (release.yml passes its release commit)"
        required: true
permissions:
  contents: read
concurrency:
  group: screen-reader-${{ github.ref }}-${{ inputs.source_sha || github.sha }}
  cancel-in-progress: false
jobs:
  lane:
    # The lane on the commit this run tests: the dispatched branch's tip, or the commit of a push or a nightly run.
    uses: ./.github/workflows/screen-reader-lane.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}
      head_repo: ${{ github.repository }}
      specs: all
    permissions:
      contents: read
  report:
    # A nightly or push-to-main infrastructure failure opens, or comments on, one `screen-reader-infra` issue.
    needs: [lane]
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: screen-reader-*
          path: ${{ runner.temp }}/sr
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONTEXT: ${{ github.event_name == 'push' && 'push to main' || 'nightly' }}
        run: |
          if ! grep -rqs '^SR_CLASS=infrastructure$' "$RUNNER_TEMP/sr"; then
            echo "No infrastructure failure: an accessibility failure fails the run without an issue."
            exit 0
          fi
          scripts/sr-infra-issue.sh "$RUN_URL" "$CONTEXT"
  strict:
    # Nightly, after the lane, so no more than two macOS runners run at once: VoiceOver on macos-26 with the hint-only
    # fallback off (SR_STRICT=1). A control VoiceOver only describes, never announces, then still shows somewhere, without
    # failing pull requests or main, which take the fallback (ourostack/ouro-ui#2085). Advisory: strict-report files its misses.
    needs: [lane]
    if: always() && github.event_name == 'schedule'
    uses: ./.github/workflows/screen-reader-lane.yml
    with:
      source_sha: ${{ github.sha }}
      head_repo: ${{ github.repository }}
      specs: all
      strict: true
    permissions:
      contents: read
  strict-report:
    # The strict run's failure fails no run: this opens, or comments on, one issue for it.
    needs: [strict]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          failed=$(gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=30" --jq '.jobs[] | select(.name | test("strict")) | select(.conclusion == "failure" or ([.steps[]? | .conclusion] | index("failure"))) | .id' | wc -l | tr -d " ")
          if [ "$failed" = 0 ]; then echo "VoiceOver on macos-26 heard every step with the hint-only fallback off."; exit 0; fi
          scripts/scheduled-failure.sh "$RUN_URL" "Screen-reader lane: VoiceOver on macOS 26 missed a step with the hint-only fallback off" "The nightly strict screen-reader lane, which judges every step by what VoiceOver says alone (ourostack/ouro-ui#2085), failed"
  advisory:
    # The advisory VoiceOver on macos-15 runs only nightly (screen-reader-lane.yml), and its failure fails no
    # run: this opens, or comments on, one issue so it still shows where the team looks.
    needs: [lane]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          failed=$(gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=30" --jq '.jobs[] | select((.name | test("macos-15")) and (.name | test("advisory"))) | select(.conclusion == "failure" or ([.steps[]? | .conclusion] | index("failure"))) | .id' | wc -l | tr -d " ")
          if [ "$failed" = 0 ]; then echo "The advisory VoiceOver on macos-15 passed."; exit 0; fi
          scripts/scheduled-failure.sh "$RUN_URL" "Screen-reader lane: the advisory VoiceOver on macOS 15 failed" "The nightly screen-reader lane's advisory VoiceOver on macOS 15 failed"
