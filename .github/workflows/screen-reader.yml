name: Screen reader
# Runs the screen-reader lane (screen-reader-lane.yml) on every push to main, nightly, and by dispatch;
# release.yml dispatches it for its release commit and tags only a commit whose push run passed here. This
# file alone may write issues: its report job opens or updates one `screen-reader-infra` issue after an
# infrastructure failure on a nightly run or a push to main (scripts/sr-classify.mjs). ci.yml never calls
# this file, since GitHub validates a called workflow's jobs against the caller's permissions even when a
# job's `if` skips them: ci.yml calls the read-only lane for a pull request (docs/guides/screen-reader-lane.md).
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      source_sha:
        description: "The commit to test: the full SHA of the dispatched branch's tip (release.yml passes its release commit)"
        required: true
permissions:
  contents: read
concurrency:
  group: screen-reader-${{ github.ref }}-${{ inputs.source_sha || github.sha }}
  cancel-in-progress: false
jobs:
  lane:
    # The lane on the commit this run tests: the dispatched branch's tip, or the commit of a push or a nightly run.
    uses: ./.github/workflows/screen-reader-lane.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}
      head_repo: ${{ github.repository }}
      specs: all
    permissions:
      contents: read
  report:
    # A nightly or push-to-main infrastructure failure opens, or comments on, one `screen-reader-infra` issue.
    needs: [lane]
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: screen-reader-*
          path: ${{ runner.temp }}/sr
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONTEXT: ${{ github.event_name == 'push' && 'push to main' || 'nightly' }}
        run: |
          if ! grep -rqs '^SR_CLASS=infrastructure$' "$RUNNER_TEMP/sr"; then
            echo "No infrastructure failure: an accessibility failure fails the run without an issue."
            exit 0
          fi
          scripts/sr-infra-issue.sh "$RUN_URL" "$CONTEXT"
