name: Screen reader
# Real screen readers read the components: VoiceOver on macOS (WebKit) and NVDA on Windows
# (Chromium), through Guidepup (playwright.screen-reader.config.ts, registry/ouro/e2e/screen-reader/).
# On every push to main, nightly, by dispatch, and when ci.yml calls it for a pull request from this
# repository whose change reaches a spec (scripts/sr-impact.mjs names the specs). release.yml tags a
# commit of main only when this passed on a push of that exact commit. scripts/sr-classify.mjs sorts a
# failure into accessibility (an utterance missing or wrong: it blocks a release) and infrastructure (the
# runner could not drive its screen reader: a release retries once, and a nightly run or a push to main opens or updates one
# `screen-reader-infra` issue), and harness (Playwright refused the lane's own command: no retry, no
# issue). Guidepup's setup rewrites VoiceOver and TCC settings, which die with the ephemeral runner, so the
# lane runs only on GitHub's hosted runners, with read-only contents and no secret. A fork's pull request
# never runs it: ci.yml calls it only for a pull request whose head repository is this one. A dispatch
# needs write access and tests only the tip of the dispatched branch (docs/guides/screen-reader-lane.md).
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      source_sha:
        description: "The commit to test: the full SHA of the dispatched branch's tip (release.yml passes its release commit)"
        required: true
  workflow_call:
    inputs:
      source_sha:
        description: "The pull request's head commit: its full SHA"
        required: true
        type: string
      specs:
        description: "The spec files to run, separated by spaces (registry/ouro/e2e/screen-reader/*.sr.spec.ts), or all"
        required: true
        type: string
      head_repo:
        description: "The pull request's head repository, owner/name: the lane refuses any other"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: screen-reader-${{ github.ref }}-${{ inputs.source_sha || github.sha }}
  cancel-in-progress: false
jobs:
  lane:
    # VoiceOver on macos-26, what current users run, and NVDA gate the run. VoiceOver on macos-15 runs
    # beside them so main's runs show what older macOS's users hear, but it is advisory: its failure does
    # not fail the run, which release.yml reads. macOS runners are the scarce pool, so it runs only on a
    # push to main and nightly, not for a dispatch or a pull request, where it would gate nothing either.
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'schedule') && '[{"os":"macos-26","project":"voiceover","advisory":false},{"os":"macos-15","project":"voiceover","advisory":true},{"os":"windows-2025","project":"nvda","advisory":false}]' || '[{"os":"macos-26","project":"voiceover","advisory":false},{"os":"windows-2025","project":"nvda","advisory":false}]') }}
    name: ${{ matrix.project }} (${{ matrix.os }})${{ matrix.advisory && ', advisory' || '' }}
    continue-on-error: ${{ matrix.advisory }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      PROJECT: ${{ matrix.project }}
      SPECS: ${{ inputs.specs || 'all' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - id: guard
        name: Check the commit and the runner
        env:
          EVENT: ${{ github.event_name }}
          DISPATCHED_SHA: ${{ github.sha }}
          RUNNER_KIND: ${{ runner.environment }}
          HEAD_REPO: ${{ inputs.head_repo }}
          REPO: ${{ github.repository }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source_sha must be a full 40-character commit SHA in lower case, not '$SOURCE_SHA'."; exit 1; }
          # Only the dispatched branch's own tip: never another commit fetched by SHA, such as a fork's.
          [ "$EVENT" != workflow_dispatch ] || [ "$SOURCE_SHA" = "$DISPATCHED_SHA" ] || { echo "::error::source_sha $SOURCE_SHA is not the tip of the dispatched branch ($DISPATCHED_SHA)."; exit 1; }
          # A pull request runs the lane only from this repository: a fork's code is not this repository's branch.
          [ "$EVENT" != pull_request ] || [ "$HEAD_REPO" = "$REPO" ] || { echo "::error::A pull request from a fork ($HEAD_REPO) never runs the screen-reader lane."; exit 1; }
          [ -z "$HEAD_REPO" ] || [ "$HEAD_REPO" = "$REPO" ] || { echo "::error::The head repository $HEAD_REPO is not $REPO: the screen-reader lane never runs for a fork."; exit 1; }
          # The specs are all, or spec files of this lane and nothing else: they become arguments of pnpm test:sr.
          [ "$SPECS" = all ] || [[ "$SPECS" =~ ^registry/ouro/e2e/screen-reader/[a-z0-9-]+\.sr\.spec\.ts([[:space:]]+registry/ouro/e2e/screen-reader/[a-z0-9-]+\.sr\.spec\.ts)*$ ]] || { echo "::error::specs must be all, or spec files of registry/ouro/e2e/screen-reader, not '$SPECS'."; exit 1; }
          head=$(git rev-parse HEAD)
          [ "$head" = "$SOURCE_SHA" ] || { echo "::error::Checked out $head, not $SOURCE_SHA."; exit 1; }
          # Guidepup's setup rewrites VoiceOver and TCC settings: only on a throwaway hosted runner.
          [ "$RUNNER_KIND" = github-hosted ] || { echo "::error::The screen-reader lane runs only on GitHub-hosted runners, not '$RUNNER_KIND'."; exit 1; }
          echo "Testing $SOURCE_SHA with $PROJECT on a GitHub-hosted runner: $SPECS."
      - id: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        continue-on-error: true
      - name: pnpm setup failed; trying it once more (#1911)
        if: steps.pnpm.outcome == 'failure'
        run: echo "::warning title=pnpm setup failed::pnpm/action-setup could not install pnpm (ourostack/ouro-ui#1911); setting it up once more."
      - if: steps.pnpm.outcome == 'failure'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - id: install
        run: pnpm i --frozen-lockfile
        continue-on-error: true
      - name: pnpm install failed; trying it once more (#1914)
        if: steps.install.outcome == 'failure'
        run: echo "::warning title=pnpm install failed::pnpm i failed, which the 1ES feed's HTTP 429s can cause (ourostack/ouro-ui#1914); installing once more."
      - if: steps.install.outcome == 'failure'
        run: pnpm i --frozen-lockfile
      - run: pnpm exec playwright install --with-deps webkit chromium
      # @guidepup/setup's command, by the bin name its installed package.json declares.
      - id: guidepup
        name: Find Guidepup's setup command
        run: echo "bin=$(node -p 'Object.keys(JSON.parse(require("fs").readFileSync("node_modules/@guidepup/setup/package.json", "utf8")).bin)[0]')" >> "$GITHUB_OUTPUT"
      # Two phases, in this order: `setup --ci` configures the OS (macOS: VoiceOver's AppleScript
      # control and TCC automation; Windows: the registry keys NVDA needs), then `install`
      # downloads the screen reader assets this @guidepup/guidepup version needs (portable NVDA).
      - name: Set up the OS for screen reader automation
        env:
          GUIDEPUP: ${{ steps.guidepup.outputs.bin }}
        run: pnpm exec "$GUIDEPUP" setup --ci
      - name: Install the screen reader assets
        env:
          GUIDEPUP: ${{ steps.guidepup.outputs.bin }}
        run: pnpm exec "$GUIDEPUP" install
      - id: sr
        name: Screen-reader tests
        run: |
          set +e
          # The specs the change reaches (or every spec). Spec paths come before --project, which takes several names.
          specs=()
          if [ "$SPECS" != all ]; then read -r -a specs <<< "$SPECS"; fi
          pnpm test:sr "${specs[@]}" --project "$PROJECT" 2>&1 | tee "$RUNNER_TEMP/sr.log"
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      # Runs whatever failed before it (but not a failed guard): no log means the tests never ran.
      - id: classify
        name: Classify the result
        if: always() && steps.guard.outcome == 'success'
        env:
          EXIT: ${{ steps.sr.outputs.exit }}
        run: |
          node scripts/sr-classify.mjs "$RUNNER_TEMP/sr.log" "$EXIT" | tee "$RUNNER_TEMP/sr-class.txt"
          exit "${PIPESTATUS[0]}"
      - if: always() && steps.classify.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screen-reader-${{ matrix.project }}-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/sr.log
            ${{ runner.temp }}/sr-class.txt
            playwright-report/screen-reader/
            test-results/screen-reader/
          if-no-files-found: ignore
          retention-days: 14
  report:
    # A nightly or push-to-main infrastructure failure opens, or comments on, one `screen-reader-infra` issue.
    needs: [lane]
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: screen-reader-*
          path: ${{ runner.temp }}/sr
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONTEXT: ${{ github.event_name == 'push' && 'push to main' || 'nightly' }}
        run: |
          if ! grep -rqs '^SR_CLASS=infrastructure$' "$RUNNER_TEMP/sr"; then
            echo "No infrastructure failure: an accessibility failure fails the run without an issue."
            exit 0
          fi
          scripts/sr-infra-issue.sh "$RUN_URL" "$CONTEXT"
