name: Apple release
# The Apple version the site and the Platforms pages state, against ouro-ui-apple's newest release
# (scripts/apple-release.mjs, GET /repos/ourostack/ouro-ui-apple/releases/latest), so the Apple page
# cannot go on saying 0.2.1 after 0.4.1 is out, and the Apple release the Platforms pages pin, against
# GitHub (scripts/platform-versions.mjs --live). Core's newest release is not checked here: the Pages
# build writes it into the Platforms pages (pages.yml), so no release of core can make this run red. Nor is
# any other kit's: the same build writes the parity matrix's kits (scripts/parity-matrix.mjs --write). Only the
# Apple components the matrix pins are held to GitHub (--live).
# Hourly, since a release in another repository starts no workflow here, and on a change to the pages
# that state a version. Behind on main warns for two hours after ouro-ui-apple's release came out, while the kit pin
# (kit-pin.yml) catches main up; after that it opens, or comments on (at most daily), one "Apple pages are
# behind" issue; an API error fails the run but is no drift.
# On a pull request the check judges what the pull request changed (scripts/apple-release.mjs judge): a fresh
# release that main is still behind on only warns, and the kit pin pull request (kit-pin.yml) catches main up.
# It fails the pull request when main has been behind for more than two hours, or when the pull request itself
# states a wrong version.
on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - site/src/apple/kit.json
      - docs/platforms/README.md
      - docs/platforms/apple.md
      - docs/platforms/windows.md
      - docs/platforms/android.md
      - scripts/apple-release.mjs
      - scripts/platform-parity.mjs
      - scripts/platform-versions.mjs
      - scripts/parity-rows.mjs
      - scripts/parity-data/**
      - docs/platforms/parity.md
      - scripts/parity-matrix.mjs
      - registry/ouro/components/ouro/*/component.json
      - .github/workflows/apple-release.yml
  pull_request:
    paths:
      - site/src/apple/kit.json
      - docs/platforms/README.md
      - docs/platforms/apple.md
      - docs/platforms/windows.md
      - docs/platforms/android.md
      - scripts/apple-release.mjs
      - scripts/platform-parity.mjs
      - scripts/platform-versions.mjs
      - scripts/parity-rows.mjs
      - scripts/parity-data/**
      - docs/platforms/parity.md
      - scripts/parity-matrix.mjs
      - registry/ouro/components/ouro/*/component.json
      - .github/workflows/apple-release.yml
  workflow_dispatch:
permissions:
  contents: read
# A push to a pull request cancels that pull request's run in progress: only its newest commit can
# merge. Every other run (hourly, on main, by hand) is in a group of its own and runs to the end.
concurrency:
  group: apple-release-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  compare:
    name: apple release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      behind: ${{ steps.compare.outputs.behind == 'true' || steps.versions.outputs.behind == 'true' || steps.parity.outputs.behind == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            site/src/apple/kit.json
            docs/platforms/README.md
            docs/platforms/apple.md
            docs/platforms/windows.md
            docs/platforms/android.md
            scripts/apple-release.mjs
            scripts/platform-parity.mjs
            scripts/platform-versions.mjs
            scripts/parity-rows.mjs
            scripts/parity-data
            docs/platforms/parity.md
            scripts/parity-matrix.mjs
            registry/ouro/components/ouro/*/component.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: The base branch's pages
        # On a pull request, the pages as the base branch states them, so the check can tell what the pull request changed.
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          sparse-checkout: |
            site/src/apple/kit.json
            docs/platforms/README.md
            docs/platforms/apple.md
          sparse-checkout-cone-mode: false
      - name: The pages state ouro-ui-apple's newest release
        # Exits 1 when a page names another version (behind=true), 2 when the API cannot be read, which is no drift.
        # On a pull request, scripts/apple-release.mjs judges the pull request against the base's pages.
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then node scripts/apple-release.mjs --base base; else node scripts/apple-release.mjs; fi
      - name: The parity tables' copies of core's files are core's, byte for byte
        # Core's release, read from GitHub: the claim files' hashes in its dist-manifest.json, and parity.json at its tag.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/platform-parity.mjs --pins
      - name: The Platforms pages' pinned Apple release is GitHub's
        # scripts/parity-data/versions.json pins ouro-ui-apple's release: its tag's commit and the core its provenance names,
        # against GitHub, and the pages against the copies. Exits 1 on drift (behind=true; fix with node scripts/platform-versions.mjs
        # --apple <tag>), 2 when the API cannot be read. Core's newest release is not checked: the Pages build writes it.
        id: versions
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/platform-versions.mjs --live
      - name: The parity matrix's pinned Apple components are GitHub's
        # scripts/parity-data/platforms.json's Apple components, against the release versions.json pins, from GitHub. Exits 1 on
        # drift (fix with node scripts/parity-matrix.mjs --write), 2 when the API cannot be read. The kits' newest releases are
        # not checked: the Pages build writes them. A pull request also renders its own change to the page; on main, a page that
        # two pull requests merged minutes apart left behind is Core pin's to re-render (it runs on each push that changes the
        # matrix's data), so only the pins are held here and no release run fails on it.
        id: parity
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            node scripts/parity-matrix.mjs --live
          else
            node scripts/parity-matrix.mjs --live --pins
          fi
  report:
    # One issue for a page behind on main, opened or commented on at most daily (scripts/scheduled-failure.sh).
    needs: [compare]
    if: always() && needs.compare.outputs.behind == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          QUIET_HOURS: 24
        run: scripts/scheduled-failure.sh "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "Apple pages are behind" "The Apple or Platforms pages state a version other than the newest release of ouro-ui-apple, the Platforms pages pin an Apple release GitHub does not match, or the parity matrix's pinned Apple components are not that release's"
