name: Wrapped inline fix probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe # v1.65.0-noble
      env:
        OURO_SYSTEM_PACKAGES: image
    strategy:
      fail-fast: false
      matrix:
        kind: [fixtures, inline, site]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm i --frozen-lockfile
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Run focused cases
        env:
          KIND: ${{ matrix.kind }}
        shell: bash
        run: |
          case "$KIND" in
            fixtures) pnpm exec vitest run test/check-corners-in-page.test.ts --project ouro-chromium --project ouro-webkit -t '(fractional badge raster edge|unrelated neighbor.s pixels|round badge.s dark-background edge|checks the real ends of wrapped inline surfaces|does not mistake the next line)' ;;
            inline) node --test --test-name-pattern='(distant fractional inline fragments|wrapped inline.s bounding gap|wrapped inline fragments|external descendant beside)' scripts/check/check-corners.test.mts ;;
            site) pnpm site:build && node registry/ouro/check/check.ts site/dist --pages 'docs/button/**' --sizes 390x844,1440x900 --themes light --config .github/ouro-check.json --no-axe --no-measured --out .tmp/corner-site ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.kind == 'site'
        with:
          name: inline-site-report
          path: .tmp/corner-site/report.json
          if-no-files-found: ignore
