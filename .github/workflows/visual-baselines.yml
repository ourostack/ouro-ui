name: Corner target probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        kind: [regressions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm i --frozen-lockfile
      - run: pnpm exec playwright install chromium webkit
      - name: Run targeted probe
        shell: bash
        env:
          KIND: ${{ matrix.kind }}
        run: |
          set -o pipefail
          mkdir -p .tmp
          case "$KIND" in
            regressions) pnpm exec vitest run registry/ouro/components/ouro/theme-picker/theme-picker.test.tsx --project ouro-chromium --project ouro-webkit -t 'nests the chosen wordmark' ;;
            edge) pnpm exec vitest run test/check-corners-in-page.test.ts --project ouro-chromium --project ouro-webkit -t 'captures paint at the bottom edge' ;;
            priority) pnpm exec vitest run test/check-corners-in-page.test.ts --project ouro-chromium -t 'keeps a native shadow and its probe separate' ;;
            fixture) node --test --test-name-pattern='rounded surface in the nested-frame pass fixture' scripts/check/check-corners.test.mts ;;
            stories) pnpm exec vitest run test/stories.test.tsx --project ouro-chromium --project ouro-webkit -t '(AppWindow/InContext|Avatar/Shapes|Button/Glass|Combobox/Tags|Message/ReplyActions|Command/SearchMatches) has no paint outside' ;;
          esac 2>&1 | tee .tmp/corner-target.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: corner-target-${{ matrix.kind }}
          path: .tmp/corner-target.log
