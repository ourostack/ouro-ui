name: Corner hover diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe # v1.65.0-noble
      env:
        OURO_SYSTEM_PACKAGES: image
    strategy:
      fail-fast: false
      matrix:
        story: ["TimeGrid/WithToolbar", "Message/ReplyActions"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm i --frozen-lockfile
      - name: Record paint comparisons
        shell: bash
        env:
          STORY: ${{ matrix.story }}
        run: |
          set -o pipefail
          mkdir -p .tmp
          pnpm exec vitest run test/stories.test.tsx --project ouro-chromium -t "$STORY has no paint outside" 2>&1 | tee .tmp/corner-hover.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: corner-hover-${{ strategy.job-index }}
          path: |
            .tmp/corner-hover.log
            .tmp/corner-images/
          if-no-files-found: warn
