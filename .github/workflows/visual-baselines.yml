name: Merged corner rule tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe # v1.65.0-noble
      env:
        OURO_SYSTEM_PACKAGES: image
    strategy:
      fail-fast: false
      matrix:
        target: [node, chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: pnpm i --frozen-lockfile
      - if: matrix.target == 'node'
        run: node --test scripts/check/check-corners.test.mts scripts/check/check-rules.test.mts scripts/check/check-command.test.mts
      - if: matrix.target != 'node'
        run: pnpm exec vitest run test/check-corners-in-page.test.ts test/check-design-in-page.test.ts registry/ouro/components/ouro/theme-picker/theme-picker.test.tsx --project ouro-${{ matrix.target }}
