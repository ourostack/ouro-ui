# Regenerates the screenshot baselines on Linux, the renderer CI compares against, and
# uploads them as the `visual-baselines` artifact. To refresh them: run this workflow on
# your branch, download the artifact with `gh run download <run-id> -n visual-baselines
# -D test/__screenshots__`, review the images, and commit them.
name: Visual baselines
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baselines:
    # Pinned: the baselines are only valid for the image that rendered them. Keep this
    # and the `visual` job in ci.yml on the same image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Write fresh references, then compare against them in a second run, so a baseline
      # that does not reproduce on the same machine fails here instead of in CI.
      - run: pnpm test:visual --update
      - run: pnpm test:visual
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-baselines
          path: test/__screenshots__/
          if-no-files-found: error
