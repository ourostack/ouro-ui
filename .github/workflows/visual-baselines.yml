name: Merged corner repair baselines
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baselines:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium webkit
      - run: pnpm test:visual --update -t 'avatar-name-loading|avatar-shapes|dialog-open|message-list-actions|message-list-foot|message-list-menu|message-reply-actions'
      - run: pnpm test:visual -t 'avatar-name-loading|avatar-shapes|dialog-open|message-list-actions|message-list-foot|message-list-menu|message-reply-actions'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corner-repairs-merged-baselines
          path: |
            test/__screenshots__/screenshots.visual.test.tsx/avatar-name-loading-*-linux.png
            test/__screenshots__/screenshots.visual.test.tsx/avatar-shapes-*-linux.png
            test/__screenshots__/screenshots.visual.test.tsx/dialog-open-*-linux.png
            test/__screenshots__/screenshots.visual.test.tsx/message-list-actions-*-linux.png
            test/__screenshots__/screenshots.visual.test.tsx/message-list-foot-*-linux.png
            test/__screenshots__/screenshots.visual.test.tsx/message-list-menu-*-linux.png
            test/__screenshots__/screenshots.visual.test.tsx/message-reply-actions-*-linux.png
          if-no-files-found: error
