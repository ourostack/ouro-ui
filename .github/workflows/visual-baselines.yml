name: Corner site diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe # v1.65.0-noble
      env:
        OURO_SYSTEM_PACKAGES: image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: pnpm i --frozen-lockfile
      - run: pnpm site:build
      - name: Check reported pages on the integrated branch
        shell: bash
        run: |
          status=0
          for page in / /docs/reorderable/ /docs/calendar-demo/ /actions/ /apple/hx/ /apple/feel/; do
            name="$(printf '%s' "$page" | tr '/' '_')"
            node registry/ouro/check/check.ts site/dist --pages "$page" --sizes 390x844,1440x900,3840x2160 --themes light,dark --config .github/ouro-check.json --out ".tmp/corner-site-4218/$name"
            code=$?
            if [ "$code" -ne 0 ]; then status="$code"; fi
          done
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: corner-site-4218
          path: .tmp/corner-site-4218
          include-hidden-files: true
          if-no-files-found: warn
