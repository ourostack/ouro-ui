name: Merged corner repair tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe # v1.65.0-noble
      env:
        OURO_SYSTEM_PACKAGES: image
    strategy:
      fail-fast: false
      matrix:
        target: [node, chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: pnpm i --frozen-lockfile
      - if: matrix.target == 'node'
        run: node --test scripts/squircle-corners.test.mjs scripts/workflows.test.mjs scripts/check/check-corners.test.mts
      - if: matrix.target != 'node'
        run: pnpm exec vitest run test/check-corners-in-page.test.ts test/story-axe.test.tsx registry/ouro/components/ouro/kbd/kbd.test.tsx registry/ouro/components/ouro/message/message.test.tsx --project ouro-${{ matrix.target }}
  stories:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe # v1.65.0-noble
      env:
        OURO_SYSTEM_PACKAGES: image
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: pnpm i --frozen-lockfile
      - run: OURO_STORIES=alert,carousel,conversation-find,conversation-list,message,theme-picker,toast,tool-call pnpm exec vitest run test/stories.test.tsx --project ouro-${{ matrix.browser }} --shard=${{ matrix.shard }}/8 -t 'stories keep paint inside squircle corners'
