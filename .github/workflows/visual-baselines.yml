name: Corner rules verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe # v1.65.0-noble
      env:
        OURO_SYSTEM_PACKAGES: image
    strategy:
      fail-fast: false
      matrix:
        kind: [browser, node, checks, typecheck, site, component]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm i --frozen-lockfile
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Validate isolated rules
        shell: bash
        env:
          KIND: ${{ matrix.kind }}
        run: |
          set -o pipefail
          mkdir -p .tmp
          case "$KIND" in
            browser) pnpm exec vitest run test/check-corners-in-page.test.ts --project ouro-chromium --project ouro-webkit --coverage --coverage.include=registry/ouro/check/corner-check.ts --coverage.include=registry/ouro/check/squircle-paint.ts --coverage.reporter=text ;;
            node) node --test scripts/check/check-corners.test.mts ;;
            checks) node --test scripts/check/check-command.test.mts scripts/check/check.test.mts ;;
            typecheck) git fetch --depth=1 origin main && git show FETCH_HEAD:.github/workflows/visual-baselines.yml > .github/workflows/visual-baselines.yml && pnpm typecheck && pnpm lint && pnpm claims:check ;;
            site) pnpm site:build && node registry/ouro/check/check.ts site/dist --pages 'docs/button/**' --sizes 390x844,1440x900 --themes light --config .github/ouro-check.json --no-axe --no-measured --out .tmp/corner-site ;;
            component) pnpm exec vitest run registry/ouro/components/ouro/theme-picker/theme-picker.test.tsx --project ouro-chromium --project ouro-webkit && CI_VISUAL=1 pnpm exec vitest run test/screenshots.visual.test.tsx --project visual -t 'theme-picker-popover' ;;
          esac 2>&1 | tee .tmp/corner-verification.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: corner-rules-${{ matrix.kind }}
          path: |
            .tmp/corner-verification.log
            .tmp/corner-site/report.json
            coverage/coverage-final.json
          if-no-files-found: warn
