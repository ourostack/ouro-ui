name: Corner story headroom verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stories:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe # v1.65.0-noble
      env:
        OURO_SYSTEM_PACKAGES: image
    strategy:
      fail-fast: false
      matrix:
        project: [ouro-chromium, ouro-webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm i --frozen-lockfile
      - name: Run the heaviest stories with the pull-request headroom gate
        env:
          PROJECT: ${{ matrix.project }}
          HEADROOM_CHANGED: test/stories.test.tsx
          OURO_CI_STEP_BUDGET_MS: "900000"
        shell: bash
        run: |
          set -o pipefail
          env -u GITHUB_EVENT_NAME pnpm exec vitest run --project "$PROJECT" --shard=1/1 test/stories.test.tsx -t '(Skeleton/(LongScroller|LongScrollerStill)|ReactionBar/ImageCatalogue|TimeGrid/BackgroundEvents) has no paint outside' --reporter=verbose 2>&1 | tee headroom.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: corner-headroom-${{ matrix.project }}
          path: headroom.log
