name: Merged ThemePicker baselines
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baselines:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium webkit
      - run: pnpm test:visual --update -t theme-picker-popover
      - run: pnpm test:visual -t theme-picker-popover
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: theme-picker-merged-baselines
          path: test/__screenshots__/screenshots.visual.test.tsx/theme-picker-popover-*-linux.png
          if-no-files-found: error
