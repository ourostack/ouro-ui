name: Diag WebKit frames
on:
  push:
    branches: [diag/webkit-frames]
permissions:
  contents: read
jobs:
  frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium webkit
      - run: pnpm site:build
      - run: |
          (pnpm site:preview --host 127.0.0.1 --port 4179 --strictPort &) ; sleep 5
          for p in site-chromium site-webkit; do
            echo "=== $p ports api"
            DEBUG=pw:api DEBUG_COLORS=false pnpm exec playwright test -c .github/diag/pw-site.config.ts --project=$p --workers=1 site/e2e/chapter-two.spec.ts -g "control: ports moves a port" 2>&1 | grep -E "pw:api|✓|✘|passed|failed" | sed "s/^/$p /" || true
          done
          for w in 1 2; do
            echo "=== workers $w"
            pnpm exec playwright test -c .github/diag/pw-site.config.ts --workers=$w site/e2e/chapter-two.spec.ts -g "control: (ports|legs)" 2>&1 | grep -E "✓|✘|passed|failed" | sed "s/^/w$w /" || true
          done
