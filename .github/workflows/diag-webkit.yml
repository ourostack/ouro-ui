name: Diag WebKit frames
on:
  push:
    branches: [diag/webkit-frames]
permissions:
  contents: read
jobs:
  frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm site:build && node .github/diag/size.mjs branch
      - name: islands as before
        run: |
          cp .github/diag/size.mjs /tmp/size.mjs
          git show 3b4ad05d:site/src/voyage/chapters/island.tsx > site/src/voyage/chapters/island.tsx
          pnpm site:build && node /tmp/size.mjs old-island
      - name: hero as before
        run: |
          git checkout -q -- site/src/voyage/chapters/island.tsx
          git show 3b4ad05d:site/src/voyage/hero.tsx > site/src/voyage/hero.tsx
          pnpm site:build && node /tmp/size.mjs old-hero
      - name: main
        run: |
          git checkout -q -f origin/main
          pnpm i --frozen-lockfile
          pnpm site:build && node /tmp/size.mjs main
