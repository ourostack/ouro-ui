name: Diag WebKit frames
on:
  push:
    branches: [diag/webkit-frames]
permissions:
  contents: read
jobs:
  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - timeout-minutes: 12
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Unit, before the fix
        run: pnpm exec vitest run --project site site/src/voyage/clear-of-toasts.test.ts 2>&1 | grep -E "✓|×|FAIL|Tests|passed|failed" | sed "s/^/U-before /" || true
      - name: Bell, before the fix
        run: |
          pnpm site:build >/dev/null 2>&1
          (pnpm site:preview --host 127.0.0.1 --port 4179 --strictPort &) ; sleep 5
          pnpm exec playwright test -c .github/diag/pw-site.config.ts --project=site-webkit --workers=2 --repeat-each=12 site/e2e/stage.spec.ts -g "bell's toast never covers" 2>&1 | grep -E "passed|failed|flaky" | sed "s/^/B-before /" || true
      - name: Unit and bell, after the fix
        run: |
          git apply .github/diag/toast-fix.patch
          pnpm exec vitest run --project site site/src/voyage/clear-of-toasts.test.ts 2>&1 | grep -E "✓|×|FAIL|Tests|passed|failed" | sed "s/^/U-after /" || true
          pkill -f "vite preview" || true
          pnpm site:build >/dev/null 2>&1
          (pnpm site:preview --host 127.0.0.1 --port 4179 --strictPort &) ; sleep 5
          pnpm exec playwright test -c .github/diag/pw-site.config.ts --project=site-webkit --workers=2 --repeat-each=12 site/e2e/stage.spec.ts -g "bell's toast never covers" 2>&1 | grep -E "passed|failed|flaky" | sed "s/^/B-after /" || true
