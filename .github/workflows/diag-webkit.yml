name: Diag WebKit frames
on:
  push:
    branches: [diag/webkit-frames]
permissions:
  contents: read
jobs:
  frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium webkit
      - run: pnpm site:build
      - run: |
          (pnpm site:preview --host 127.0.0.1 --port 4179 --strictPort &) ; sleep 5
          node .github/diag/frames.mjs http://127.0.0.1:4179/ouro-ui/ branch
      - name: main
        run: |
          cp .github/diag/frames.mjs /tmp/frames.mjs
          git checkout -q origin/main
          pnpm i --frozen-lockfile
          pnpm site:build
          (pnpm site:preview --host 127.0.0.1 --port 4180 --strictPort &) ; sleep 5
          cp /tmp/frames.mjs .github/frames.mjs
          node .github/frames.mjs http://127.0.0.1:4180/ouro-ui/ main
