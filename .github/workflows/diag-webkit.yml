name: Diag WebKit frames
on:
  push:
    branches: [diag/webkit-frames]
permissions:
  contents: read
jobs:
  lcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: cp .github/diag/lcp.mjs .github/diag/html.mjs .github/diag/strip.mjs /tmp/
      - run: pnpm i --frozen-lockfile && pnpm site:build && cp site/dist/voyage/index.html /tmp/voyage.html
      - run: |
          for how in asis nolabels pad1k noagents; do
            cp /tmp/voyage.html site/dist/voyage/index.html
            node /tmp/strip.mjs $how
            node /tmp/html.mjs $how | cut -c1-40
            rm -rf .lighthouseci
            npx --yes @lhci/cli@0.15.1 collect --config=site/lighthouserc.json > /dev/null 2>&1
            node /tmp/lcp.mjs $how | cut -c1-60
          done
