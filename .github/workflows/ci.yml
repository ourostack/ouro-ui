  e2e:
    # Passes when every e2e shard passed.
    needs: [plan, e2e-shard, sweep-shard, sweeps-compare]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.e2e-shard.result }}
          SWEEPS: ${{ needs.sweep-shard.result }}
          COMPARE: ${{ needs.sweeps-compare.result }}
          HEAVY: ${{ needs.plan.outputs.heavy }}
        run: |
          if [ "$HEAVY" = skip ]; then
            echo "::notice::Not affected: this pull request changes only files the end-to-end specs never read (the plan's heavy=skip)."
            exit 0
          fi
          if [ "$SHARDS" != success ]; then
            echo "::error::An e2e shard did not pass ($SHARDS): see the e2e (n/N) jobs."
          fi
          if [ "$SWEEPS" != success ]; then
            echo "::error::A sweeps shard did not pass ($SWEEPS): see the sweeps (n/N) jobs."
          fi
          if [ "$COMPARE" != success ]; then
            echo "::error::The sweeps-compare job did not pass ($COMPARE): a component looks different on two pages, see its log."
          fi
          if [ "$SHARDS" != success ] || [ "$SWEEPS" != success ] || [ "$COMPARE" != success ]; then
            exit 1
          fi
