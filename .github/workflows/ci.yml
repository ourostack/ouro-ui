        timeout-minutes: 1
        continue-on-error: true
        env:
          GIT_TRACE_CURL: /tmp/ouro-checkout-trace.log
          GIT_TRACE_CURL_NO_DATA: "1"
          GIT_TRACE_PACKET: /tmp/ouro-checkout-packets.log
        with:
          persist-credentials: false
      - *checkout-stalled-again
      - if: steps.checkout-again.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        env:
          GIT_TRACE_CURL: /tmp/ouro-checkout-trace.log
          GIT_TRACE_CURL_NO_DATA: "1"
          GIT_TRACE_PACKET: /tmp/ouro-checkout-packets.log
        with:
          persist-credentials: false
      - id: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        continue-on-error: true
      - *pnpm-stalled
      - *pnpm-retry
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - id: install
        run: pnpm i --frozen-lockfile
        continue-on-error: true
      - *pnpm-install-stalled
      - *pnpm-install-retry
      - name: Sweeps retake scope
        # On a pull request, a picture of a control the change reaches is taken twice and must agree (site/e2e/stable-take.ts);
        # a diff that cannot be read counts as everything changed.
        run: |
          mkdir -p .tmp
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git fetch --no-tags --depth=2 origin "$GITHUB_SHA" && git diff --name-only HEAD^1 HEAD > .tmp/sweeps-changed.txt; then
            echo "OURO_SWEEP_RETAKE=$(node scripts/sweeps-retake.mjs "$GITHUB_EVENT_NAME" .tmp/sweeps-changed.txt)" >> "$GITHUB_ENV"
          else
            echo "OURO_SWEEP_RETAKE=$(node scripts/sweeps-retake.mjs "$GITHUB_EVENT_NAME")" >> "$GITHUB_ENV"
          fi
