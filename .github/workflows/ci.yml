name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec vitest run --project ouro-touch registry/ouro/lib/ouro/testing/commands.touch.test.ts
      - name: Keep a spring catch a swipe despite a command stall past the long-press deadline
        run: |
          node probe/delay-catch.mjs
          pnpm exec vitest run --project ouro-touch registry/ouro/components/ouro/swipe-actions/swipe-actions.touch.test.tsx -t "can be caught by a finger"
      - name: Ten uninstrumented SwipeActions touch files
        run: |
          git show HEAD:registry/ouro/components/ouro/swipe-actions/swipe-actions.touch.test.tsx > registry/ouro/components/ouro/swipe-actions/swipe-actions.touch.test.tsx
          for i in $(seq 1 10); do
            pnpm exec vitest run --project ouro-touch registry/ouro/components/ouro/swipe-actions/swipe-actions.touch.test.tsx > swipe-file.log 2>&1 || { cat swipe-file.log; exit 1; }
            echo "SWIPE_FILE_PASS $i"
          done
