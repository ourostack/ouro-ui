  install-prep:
    # Builds each variant's app once (scripts/install-test.sh with OURO_PREPARE_ONLY): the install,
    # type check, build and every later add. Its shards restore that tree at the same path, in the
    # same image as the same user, and run their share of the shipped tests against it, instead of
    # each repeating the setup.
    needs: [plan]
    # It runs on a push to main whose tree already passed as well, because only main saves the prepared app and
    # the merge queue's runs restore it: without that save the newest app stays the one before the last change to
    # the theme, and every merge group adds everything from the base. With the app cached it ends after the restore.
    if: ${{ !cancelled() && needs.plan.outputs.installs != 'skip' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # In Playwright's image (see the note above jobs:).
    container:
      image: mcr.microsoft.com/playwright@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe # v1.65.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
      env:
        OURO_SYSTEM_PACKAGES: image
    strategy:
      fail-fast: false
      matrix:
        variant: [shadcn, ouro]
        preset: [nova, vega]
        exclude:
          - variant: ouro
            preset: vega
    name: install prep (${{ matrix.variant }}, ${{ matrix.preset }})
    env:
      OURO_PRESET: ${{ matrix.preset }}
      OURO_APP: /tmp/ouro-app
    steps:
      # Its ouro variant reads the commit's registry.json by its sha, which a tarball lacks, so it has no last resort: its last try may fail as before (#1765).
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        continue-on-error: true
        env:
          GIT_TRACE_CURL: /tmp/ouro-checkout-trace.log
          GIT_TRACE_CURL_NO_DATA: "1"
          GIT_TRACE_PACKET: /tmp/ouro-checkout-packets.log
        with:
          persist-credentials: false
      - *checkout-stalled
      - id: checkout-again
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        continue-on-error: true
        env:
          GIT_TRACE_CURL: /tmp/ouro-checkout-trace.log
          GIT_TRACE_CURL_NO_DATA: "1"
          GIT_TRACE_PACKET: /tmp/ouro-checkout-packets.log
        with:
          persist-credentials: false
      - *checkout-stalled-again
      - if: steps.checkout-again.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        env:
          GIT_TRACE_CURL: /tmp/ouro-checkout-trace.log
          GIT_TRACE_CURL_NO_DATA: "1"
          GIT_TRACE_PACKET: /tmp/ouro-checkout-packets.log
        with:
          persist-credentials: false
      - id: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        continue-on-error: true
      - *pnpm-stalled
      - *pnpm-retry
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      # The prepared app is a function of the files below, so a commit that changes none of them
      # restores the app an earlier commit prepared and checked (a cache is saved only by a job that
      # passed), and the prepare steps are skipped. A commit that changes some restores the newest
      # earlier app built from the same install scripts and fixture (the restore key), and the add
      # below installs again only the items whose built content changed (scripts/install-delta.mjs).
      # Only main saves these caches (every save in this job checks for main): a pull request
      # restores them, and a cache a pull request saves is readable by that pull request alone.
      - id: prepared
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/app.tar.zst
          key: install-app-pw1.65.0-${{ matrix.variant }}-${{ matrix.preset }}-${{ hashFiles('test/install-fixture*/**', 'scripts/install-test.sh', 'scripts/split-items.mjs', 'pnpm-lock.yaml') }}-${{ hashFiles('registry/**', 'docs/**', 'test/install-fixture*/**', 'scripts/install-test.sh', 'scripts/namespace.sh', 'scripts/generated-files.mjs', 'scripts/install-check.mjs', 'scripts/latest-release.mjs', 'scripts/readme-steps.mjs', 'scripts/shard.mjs', 'scripts/test-impact.mjs', 'scripts/upgrade-note.mjs', 'scripts/*.mts', '!scripts/*.test.mts', 'package.json', 'pnpm-lock.yaml', 'README.md', 'UPGRADING.md') }}
          restore-keys: |
            install-app-pw1.65.0-${{ matrix.variant }}-${{ matrix.preset }}-${{ hashFiles('test/install-fixture*/**', 'scripts/install-test.sh', 'scripts/split-items.mjs', 'pnpm-lock.yaml') }}-
      # npm's download cache, seeded from the newest earlier one, so a changed registry file does not
      # download every package again.
      - id: npmcache
        if: steps.prepared.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/npm-cache
          key: install-npm-${{ matrix.variant }}-${{ matrix.preset }}-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'test/install-fixture*/package.json') }}
          restore-keys: |
            install-npm-${{ matrix.variant }}-${{ matrix.preset }}-
      # The base (everything before the shipped tests are added) is a function of the runtime files
      # only, so a commit that changes just tests, stories or specs restores it and runs only the
      # add of the shipped tests, which overwrites what the base holds.
      - id: base
        if: steps.prepared.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/base.tar.zst
          key: install-base-pw1.65.0-${{ matrix.variant }}-${{ matrix.preset }}-${{ hashFiles('registry/**', '!registry/**/*.test.ts', '!registry/**/*.test.tsx', '!registry/**/*.test-d.ts', '!registry/**/*.stories.tsx', '!registry/ouro/e2e/**', '!registry/ouro/lib/ouro/testing/**', 'test/install-fixture*/**', 'scripts/install-test.sh', 'scripts/namespace.sh', 'scripts/generated-files.mjs', 'scripts/install-check.mjs', 'scripts/latest-release.mjs', 'scripts/*.mts', '!scripts/*.test.mts', 'package.json', 'pnpm-lock.yaml') }}
      - if: steps.prepared.outputs.cache-hit != 'true'
        id: install
        run: pnpm i --frozen-lockfile
        continue-on-error: true
      - *pnpm-install-stalled
      - *pnpm-install-retry
      - name: Restore the earlier app
        if: steps.prepared.outputs.cache-hit != 'true' && steps.prepared.outputs.cache-matched-key != ''
        run: tar -I zstd -xf "$RUNNER_TEMP/app.tar.zst" -C "$(dirname "$OURO_APP")"
      - name: Restore the base
        if: steps.prepared.outputs.cache-hit != 'true' && steps.prepared.outputs.cache-matched-key == '' && steps.base.outputs.cache-hit == 'true'
        run: tar -I zstd -xf "$RUNNER_TEMP/base.tar.zst" -C "$(dirname "$OURO_APP")"
      - name: Prepare the base
        if: steps.prepared.outputs.cache-hit != 'true' && steps.prepared.outputs.cache-matched-key == '' && steps.base.outputs.cache-hit != 'true'
        env:
          VARIANT: ${{ matrix.variant }}
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
          npm_config_cache: ${{ runner.temp }}/npm-cache
          npm_config_prefer_offline: "true"
          npm_config_audit: "false"
          npm_config_fund: "false"
        run: OURO_BASE_ONLY=1 scripts/install-test.sh "$VARIANT" "$OURO_APP" "$REF"
      - name: Pack the base
        if: steps.prepared.outputs.cache-hit != 'true' && steps.prepared.outputs.cache-matched-key == '' && steps.base.outputs.cache-hit != 'true'
        run: tar -I zstd -cf "$RUNNER_TEMP/base.tar.zst" -C "$(dirname "$OURO_APP")" "$(basename "$OURO_APP")" && ls -l "$RUNNER_TEMP/base.tar.zst"
      - if: steps.prepared.outputs.cache-hit != 'true' && steps.prepared.outputs.cache-matched-key == '' && steps.base.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/base.tar.zst
          key: ${{ steps.base.outputs.cache-primary-key }}
      - name: Add the shipped tests
        if: steps.prepared.outputs.cache-hit != 'true'
        env:
          VARIANT: ${{ matrix.variant }}
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
          npm_config_cache: ${{ runner.temp }}/npm-cache
          npm_config_prefer_offline: "true"
          npm_config_audit: "false"
          npm_config_fund: "false"
        run: |
          status=0
          OURO_DELTA=1 OURO_PREPARE_ONLY=1 OURO_SKIP_CHECKS=1 scripts/install-test.sh "$VARIANT" "$OURO_APP" "$REF" || status=$?
          # 75: the restored app cannot be proved to equal a full add (a file moved or went, a
          # dependency changed), so start again from the base and add everything.
          if [ "$status" -eq 75 ]; then
            rm -rf "$OURO_APP"
            if [ -f "$RUNNER_TEMP/base.tar.zst" ]; then
              tar -I zstd -xf "$RUNNER_TEMP/base.tar.zst" -C "$(dirname "$OURO_APP")"
            else
              OURO_BASE_ONLY=1 scripts/install-test.sh "$VARIANT" "$OURO_APP" "$REF"
            fi
            rm -f "$OURO_APP/.ouro-added.json"
            OURO_DELTA=1 OURO_PREPARE_ONLY=1 OURO_SKIP_CHECKS=1 scripts/install-test.sh "$VARIANT" "$OURO_APP" "$REF"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
      # npm's cache holds what the steps above downloaded, so it is saved after them.
      - if: steps.prepared.outputs.cache-hit != 'true' && steps.npmcache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/npm-cache
          key: ${{ steps.npmcache.outputs.cache-primary-key }}
      - name: Pack the app
        if: steps.prepared.outputs.cache-hit != 'true'
        run: tar -I zstd -cf "$RUNNER_TEMP/app.tar.zst" -C "$(dirname "$OURO_APP")" "$(basename "$OURO_APP")" && ls -l "$RUNNER_TEMP/app.tar.zst"
      - if: steps.prepared.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/app.tar.zst
          key: ${{ steps.prepared.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-app-${{ matrix.variant }}-${{ matrix.preset }}
          path: ${{ runner.temp }}/app.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  install-shard:
    # Installs every item into a fresh Vite app with the pinned shadcn CLI and runs the app's type
    # check, build, the shipped Vitest tests and the shipped Playwright specs
    # (scripts/install-test.sh). shadcn: the app keeps the theme `shadcn init` wrote, and a stock
    # shadcn button builds beside Ouro's. ouro: ouro-theme comes from GitHub at this commit. The
    # shipped tests take most of the time, so each app is installed in several jobs side by side and
    # each runs its share of them (OURO_SHARD); on a reduced pull request, the selected components'
    # shipped tests, and none when it selected none (OURO_COMPONENTS). Each shard that passes
    # leaves a marker, which its variant's install check counts.
    needs: [plan, install-prep]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' && needs.plan.outputs.installs != 'skip' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # In Playwright's image (see the note above jobs:).
    container:
      image: mcr.microsoft.com/playwright@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe # v1.65.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
      env:
        OURO_SYSTEM_PACKAGES: image
    strategy:
      fail-fast: false
      matrix:
        variant: [shadcn, ouro]
        # Another shadcn preset than the README's, so its preset wording is verified.
        preset: [nova, vega]
        # Six shards for a pull request's run and a merge group's, three for a push to main (the install gate reads the same count).
        # A merge group's three shards ran 16 minutes each and ended its run, the longest job after install prep.
        shard: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'merge_group') && '[1,2,3,4,5,6]' || '[1,2,3]') }}
        exclude:
          - variant: ouro
            preset: vega
    name: install (${{ matrix.variant }}, ${{ matrix.preset }}, ${{ matrix.shard }}/${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 6 || 3 }})
    env:
      FULL: ${{ needs.plan.outputs.full != 'false' }}
      COMPONENTS: ${{ needs.plan.outputs.components }}
      OURO_PRESET: ${{ matrix.preset }}
      OURO_SHARD: ${{ matrix.shard }}/${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 6 || 3 }}
      OURO_APP: /tmp/ouro-app
      PASSED: install-passed-${{ matrix.variant }}-${{ matrix.preset }}-${{ matrix.shard }}
    steps:
      # Its ouro variant reads the commit's registry.json by its sha, which a tarball lacks, so it has no last resort: its last try may fail as before (#1765).
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        continue-on-error: true
        env:
          GIT_TRACE_CURL: /tmp/ouro-checkout-trace.log
          GIT_TRACE_CURL_NO_DATA: "1"
          GIT_TRACE_PACKET: /tmp/ouro-checkout-packets.log
        with:
          persist-credentials: false
      - *checkout-stalled
      - id: checkout-again
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        continue-on-error: true
        env:
          GIT_TRACE_CURL: /tmp/ouro-checkout-trace.log
          GIT_TRACE_CURL_NO_DATA: "1"
          GIT_TRACE_PACKET: /tmp/ouro-checkout-packets.log
        with:
          persist-credentials: false
      - *checkout-stalled-again
      - if: steps.checkout-again.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        env:
          GIT_TRACE_CURL: /tmp/ouro-checkout-trace.log
          GIT_TRACE_CURL_NO_DATA: "1"
          GIT_TRACE_PACKET: /tmp/ouro-checkout-packets.log
        with:
          persist-credentials: false
      - id: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        continue-on-error: true
      - *pnpm-stalled
      - *pnpm-retry
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - id: install
        run: pnpm i --frozen-lockfile
        continue-on-error: true
      - *pnpm-install-stalled
      - *pnpm-install-retry
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: install-app-${{ matrix.variant }}-${{ matrix.preset }}
          path: ${{ runner.temp }}/prepared
      - name: Restore the prepared app
        run: tar -I zstd -xf "$RUNNER_TEMP/prepared/app.tar.zst" -C "$(dirname "$OURO_APP")"
      - name: Install test
        env:
          VARIANT: ${{ matrix.variant }}
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
          OURO_REUSE_APP: "1"
          # This step has no timeout-minutes of its own, so install-test.sh reads the job's own
          # timeout-minutes above and scales its stall reporter's and globalTimeout's thresholds down
          # to what is actually left of it, rather than the whole 30 minutes again, so a stall that
          # starts late in the step still fails with the test's name before the job's own hard timeout
          # does (install (ouro, nova, 3/3), run 45307477177, cut off with nothing named).
          OURO_CI_JOB_BUDGET_MS: "1800000"
        run: |
          if [ "$FULL" != true ]; then export OURO_COMPONENTS="$COMPONENTS"; fi
          scripts/install-test.sh "$VARIANT" "$OURO_APP" "$REF"
          mkdir -p "$RUNNER_TEMP/passed" && echo "$PASSED" > "$RUNNER_TEMP/passed/$PASSED"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PASSED }}
          path: ${{ runner.temp }}/passed/
          if-no-files-found: error
          retention-days: 1
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-${{ matrix.variant }}-${{ matrix.preset }}-${{ matrix.shard }}
          path: |
            ${{ env.OURO_APP }}/src/index.css
            ${{ env.OURO_APP }}/components.json
            ${{ env.OURO_APP }}/package.json
            ${{ env.OURO_APP }}/playwright-report/
          if-no-files-found: ignore
  install-checks:
    # The type check, the build and the install check of the prepared app with the shipped tests
    # (OURO_CHECK_ONLY), run beside the shards instead of before them: the shards start as soon as
    # the app is prepared, and this job's result is part of every variant's install check.
    needs: [plan, install-prep]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' && needs.plan.outputs.installs != 'skip' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # In Playwright's image (see the note above jobs:).
    container:
      image: mcr.microsoft.com/playwright@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe # v1.65.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
      env:
        OURO_SYSTEM_PACKAGES: image
    strategy:
      fail-fast: false
      matrix:
        variant: [shadcn, ouro]
        preset: [nova, vega]
        # The shadcn variant's Ouro AX tests take about five minutes alone, and one of their files holds most of
        # that, so two jobs run half each; the ouro variant has none, so it runs once.
        ax: [1, 2]
        exclude:
          - variant: ouro
            preset: vega
          - variant: ouro
            ax: 2
    name: install checks (${{ matrix.variant }}, ${{ matrix.preset }}, ${{ matrix.ax }})
    env:
      OURO_PRESET: ${{ matrix.preset }}
      OURO_APP: /tmp/ouro-app
    steps:
      # Its ouro variant reads the commit's registry.json by its sha, which a tarball lacks, so it has no last resort: its last try may fail as before (#1765).
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        continue-on-error: true
        env:
          GIT_TRACE_CURL: /tmp/ouro-checkout-trace.log
          GIT_TRACE_CURL_NO_DATA: "1"
          GIT_TRACE_PACKET: /tmp/ouro-checkout-packets.log
        with:
          persist-credentials: false
      - *checkout-stalled
      - id: checkout-again
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        continue-on-error: true
        env:
          GIT_TRACE_CURL: /tmp/ouro-checkout-trace.log
          GIT_TRACE_CURL_NO_DATA: "1"
          GIT_TRACE_PACKET: /tmp/ouro-checkout-packets.log
        with:
          persist-credentials: false
      - *checkout-stalled-again
      - if: steps.checkout-again.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        env:
          GIT_TRACE_CURL: /tmp/ouro-checkout-trace.log
          GIT_TRACE_CURL_NO_DATA: "1"
          GIT_TRACE_PACKET: /tmp/ouro-checkout-packets.log
        with:
          persist-credentials: false
      - id: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        continue-on-error: true
      - *pnpm-stalled
      - *pnpm-retry
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - id: install
        run: pnpm i --frozen-lockfile
        continue-on-error: true
      - *pnpm-install-stalled
      - *pnpm-install-retry
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: install-app-${{ matrix.variant }}-${{ matrix.preset }}
          path: ${{ runner.temp }}/prepared
      - name: Restore the prepared app
        run: tar -I zstd -xf "$RUNNER_TEMP/prepared/app.tar.zst" -C "$(dirname "$OURO_APP")"
      - name: Check the app
        env:
          VARIANT: ${{ matrix.variant }}
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
          OURO_CHECK_ONLY: "1"
          OURO_AX_SHARD: ${{ matrix.variant == 'shadcn' && format('{0}/2', matrix.ax) || '' }}
        run: scripts/install-test.sh "$VARIANT" "$OURO_APP" "$REF"
  install-gate:
    # A variant's install check: passes when each of its shards passed, as their markers show,
    # and every install shard of this attempt passed: a marker can be an earlier attempt's, after
    # "Re-run all jobs" (artifacts outlive an attempt), so the markers alone could pass a shard
    # that has just failed.
    needs: [plan, install-shard, install-checks]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # read this run's own job logs, to judge a failure against the quarantine before it reports (scripts/quarantine.mjs judge)
      issues: read # read a quarantined test's issue state (open, not expired)
    strategy:
      fail-fast: false
      matrix:
        variant: [shadcn, ouro]
        preset: [nova, vega]
        exclude:
          - variant: ouro
            preset: vega
    name: install (${{ matrix.variant }}, ${{ matrix.preset }})
    steps:
      - if: needs.plan.outputs.installs != 'skip'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: install-passed-${{ matrix.variant }}-${{ matrix.preset }}-*
          path: ${{ runner.temp }}/passed
          merge-multiple: true
      - id: parts
        name: Every shard passed
        continue-on-error: true
        env:
          VARIANT: ${{ matrix.variant }}
          PRESET: ${{ matrix.preset }}
          SHARDS: ${{ needs.install-shard.result }}
          CHECKS: ${{ needs.install-checks.result }}
          INSTALLS: ${{ needs.plan.outputs.installs }}
          SHARD_COUNT: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 6 || 3 }}
        run: |
          if [ "$INSTALLS" = skip ]; then
            echo "::notice::Not affected: this pull request changes only files the install test never reads (the plan's installs=skip)."
            exit 0
          fi
          failed=0
          if [ "$SHARDS" != success ]; then
            echo "::error::an install shard of this attempt did not pass ($SHARDS): see the install (…, n/N) jobs."
            failed=1
          fi
          if [ "$CHECKS" != success ]; then
            echo "::error::the type check, build or install check of the prepared app did not pass ($CHECKS): see the install checks job."
            failed=1
          fi
          for shard in $(seq 1 "$SHARD_COUNT"); do
            if [ ! -f "$RUNNER_TEMP/passed/install-passed-$VARIANT-$PRESET-$shard" ]; then
              echo "::error::install ($VARIANT, $PRESET, $shard/$SHARD_COUNT) did not pass: see that job."
              failed=1
            fi
          done
          exit "$failed"
      # install-shard runs the shipped Vitest tests from the installed app's own copy
      # (registry/ouro/<path> installs to src/<path>), so a quarantined test fails here under that
      # copy's path; scripts/quarantine.mjs's names() already maps it back to the registry path it
      # is quarantined under. Same reasoning as the ci job's judge steps below: a merge queue entry
      # is dropped the instant this check reports failure, too late for quarantine-retry.yml's later
      # retry to put it back, so this run judges its own failing jobs first.
      - id: fetch-quarantine
        name: Fetch the quarantine script and list by the contents API, with no checkout
        if: steps.parts.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p scripts .github/workflows
          for path in .github/workflows/ci.yml scripts/quarantine.mjs scripts/ci-budget.mjs scripts/run-jobs.mjs .github/quarantine.json; do
            gh api -H "Accept: application/vnd.github.raw" "repos/$GH_REPO/contents/$path?ref=$SHA" > "$path"
          done
      - if: steps.parts.outcome == 'failure'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: judge
        if: steps.parts.outcome == 'failure'
        name: Quarantined failures alone are forgiven; anything else still fails
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHARDS: ${{ needs.install-shard.result }}
          CHECKS: ${{ needs.install-checks.result }}
        # judgeOwnRun treats a listed id with no failing instance of its own as a problem, not as
        # nothing to explain (ourostack/ouro-ui#3827's own "ci" job accepts the same for its own
        # fixed id list), so only the id whose result actually isn't success is named here.
        run: |
          ids=()
          if [ "$SHARDS" != success ]; then ids+=(install-shard); fi
          if [ "$CHECKS" != success ]; then ids+=(install-checks); fi
          node scripts/quarantine.mjs judge "$GITHUB_RUN_ID" "${ids[@]}"
      - name: Every shard passed, or was forgiven as quarantined
        if: always()
        run: |
          if [ "${{ steps.parts.outcome }}" = success ]; then exit 0; fi
          if [ "${{ steps.judge.outcome }}" = success ]; then exit 0; fi
          exit 1
  install:
    # Installs every item into a fresh app and runs its type check and build
    # (scripts/install-test.sh). namespace: `shadcn add @ouro/dialog` from the registry Pages
    # serves, built and served locally. next: a Next.js App Router app renders every component from
    # a Server Component page and runs `next build`.
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        variant: [namespace, next]
        preset: [nova]
    name: install (${{ matrix.variant }}, ${{ matrix.preset }})
    env:
      OURO_PRESET: ${{ matrix.preset }}
    steps:
      # Its namespace variant fetches a release tag from origin, which a tarball lacks, so it has no last resort: its last try may fail as before (#1765).
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        continue-on-error: true
        env:
          GIT_TRACE_CURL: /tmp/ouro-checkout-trace.log
          GIT_TRACE_CURL_NO_DATA: "1"
          GIT_TRACE_PACKET: /tmp/ouro-checkout-packets.log
        with:
          persist-credentials: false
      - *checkout-stalled
      - id: checkout-again
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        continue-on-error: true
        env:
          GIT_TRACE_CURL: /tmp/ouro-checkout-trace.log
          GIT_TRACE_CURL_NO_DATA: "1"
          GIT_TRACE_PACKET: /tmp/ouro-checkout-packets.log
        with:
          persist-credentials: false
      - *checkout-stalled-again
      - if: steps.checkout-again.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        env:
          GIT_TRACE_CURL: /tmp/ouro-checkout-trace.log
          GIT_TRACE_CURL_NO_DATA: "1"
          GIT_TRACE_PACKET: /tmp/ouro-checkout-packets.log
        with:
          persist-credentials: false
      - id: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        continue-on-error: true
      - *pnpm-stalled
      - *pnpm-retry
      - id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        continue-on-error: true
        with:
          node-version: 24
          cache: pnpm
      - *node-stalled
      - *node-retry
      - if: needs.plan.outputs.installs != 'skip'
        id: install
        run: pnpm i --frozen-lockfile
        continue-on-error: true
      - *pnpm-install-stalled
      - *pnpm-install-retry
      - if: needs.plan.outputs.installs != 'skip'
        run: scripts/install-test.sh ${{ matrix.variant }} "$RUNNER_TEMP/app" ${{ github.event.pull_request.head.sha || github.sha }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-${{ matrix.variant }}-${{ matrix.preset }}
          path: |
            ${{ runner.temp }}/app/src/index.css
            ${{ runner.temp }}/app/components.json
            ${{ runner.temp }}/app/package.json
            ${{ runner.temp }}/app/playwright-report/
          if-no-files-found: ignore
  install-latest:
    # On a release branch only (release.yml dispatches CI there and tags only when it passes):
    # the shadcn variant with the newest shadcn CLI instead of the pinned one, so a release
    # installs with what `npx shadcn@latest` runs today. Here rather than in release.yml, so the
    # unpinned CLI never runs in a job that holds a token able to push the tag.
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    # In Playwright's image (see the note above jobs:).
    container:
      image: mcr.microsoft.com/playwright@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe # v1.65.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
      env:
        OURO_SYSTEM_PACKAGES: image
    name: install (shadcn@latest, nova)
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        continue-on-error: true
        env:
          GIT_TRACE_CURL: /tmp/ouro-checkout-trace.log
          GIT_TRACE_CURL_NO_DATA: "1"
          GIT_TRACE_PACKET: /tmp/ouro-checkout-packets.log
        with:
          persist-credentials: false
      - *checkout-stalled
      - id: checkout-again
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        continue-on-error: true
        env:
          GIT_TRACE_CURL: /tmp/ouro-checkout-trace.log
          GIT_TRACE_CURL_NO_DATA: "1"
          GIT_TRACE_PACKET: /tmp/ouro-checkout-packets.log
        with:
          persist-credentials: false
      - *checkout-stalled-again
      - id: checkout-last
        if: steps.checkout-again.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        env:
          GIT_TRACE_CURL: /tmp/ouro-checkout-trace.log
          GIT_TRACE_CURL_NO_DATA: "1"
          GIT_TRACE_PACKET: /tmp/ouro-checkout-packets.log
        with:
          persist-credentials: false
      - *checkout-tarball
      - id: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        continue-on-error: true
      - *pnpm-stalled
      - *pnpm-retry
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
