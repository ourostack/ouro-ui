name: CI
# PROBE (branch probe/webkit-ready, never merged): voyage.spec.ts:97's WebKit page that shows gzip bytes.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encoding:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
      env:
        OURO_SYSTEM_PACKAGES: image
    strategy:
      fail-fast: false
      matrix:
        mode: [direct, identity, buffered]
    name: encoding (${{ matrix.mode }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - run: pnpm i --frozen-lockfile
      - name: Reflow loop, repeated, in WebKit and Chromium
        env:
          CI: "1"
          PROBE_PROXY: ${{ matrix.mode != 'direct' && '1' || '' }}
          PROBE_MODE: ${{ matrix.mode }}
        run: |
          if [ -n "$PROBE_PROXY" ]; then node site/e2e/zz-proxy.mjs & fi
          pnpm exec playwright test --project=site-webkit site/e2e/zz-encoding.spec.ts --repeat-each=80 --workers=2 --reporter=list 2>&1 | grep -E 'PROBE|contentType|^\s*[0-9]+ (passed|failed)|enc=|✘' | grep -vE '^\s+[0-9]+ \|' | head -400 || true
          if [ -f proxy-log.txt ]; then echo "proxy lines: $(wc -l < proxy-log.txt)"; grep -c '^BAD' proxy-log.txt || true; grep '^BAD' proxy-log.txt | head -20; grep -E ' (GET) /(nautilus/)? ' proxy-log.txt | awk '{print $7, $8, $9, $10}' | sort | uniq -c | head -20; fi
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encoding-${{ strategy.job-index }}
          path: proxy-log.txt
          if-no-files-found: ignore
