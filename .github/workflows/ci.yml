name: CI
# PROBE (branch probe/webkit-e2e, never merged): why site-webkit e2e specs time out since #272.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  menu-race:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
      env:
        OURO_SYSTEM_PACKAGES: image
    strategy:
      fail-fast: false
      matrix:
        workers: [1, 2]
    name: menu-race (workers ${{ matrix.workers }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - run: pnpm i --frozen-lockfile
      - name: Chapter III's two failing tests, repeated, in WebKit
        env:
          CI: "1"
        run: pnpm exec playwright test --project=site-webkit site/e2e/chapter-three.spec.ts -g "every operable element in Chapter III|squid sinks back" --repeat-each=15 --workers=${{ matrix.workers }} --trace=retain-on-failure --reporter=list,html || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: menu-race-${{ matrix.workers }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
  ready-timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
      env:
        OURO_SYSTEM_PACKAGES: image
    strategy:
      fail-fast: false
      matrix:
        ref: [a9431c6408c281aebd07ab3ae0947c38f1c27f47, 77713b1725d253474b0cabd6f44b0872d87d5574]
    name: ready-timing (${{ matrix.ref }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - run: pnpm i --frozen-lockfile
      - name: Time to data-site-ready
        run: |
          cat > probe.config.ts <<'CFG'
          import { defineConfig, devices } from "@playwright/test";
          export default defineConfig({
            testDir: "site/e2e",
            testMatch: /zz-ready\.probe\.ts$/,
            workers: 1,
            reporter: "list",
            projects: [
              { name: "webkit", use: { ...devices["Desktop Safari"], baseURL: "http://127.0.0.1:4179/" } },
              { name: "chromium", use: { ...devices["Desktop Chrome"], baseURL: "http://127.0.0.1:4179/" } },
            ],
            webServer: { command: "pnpm site:build && pnpm site:preview --host 127.0.0.1 --port 4179 --strictPort", url: "http://127.0.0.1:4179/", timeout: 180_000 },
          });
          CFG
          cat > site/e2e/zz-ready.probe.ts <<'SPEC'
          import { test } from "@playwright/test";
          for (const width of [320, 1440]) for (const path of ["./", "nautilus/"]) {
            test(`ready ${path} at ${width}`, async ({ page, browserName }) => {
              test.setTimeout(120_000);
              await page.setViewportSize({ width, height: width === 320 ? 640 : 900 });
              await page.addInitScript(() => {
                const look = () => { if (document.documentElement?.hasAttribute("data-site-ready")) (window as any).__ready ??= performance.now(); else requestAnimationFrame(look); };
                look();
              });
              const times: number[] = [];
              const loads: number[] = [];
              for (let i = 0; i < 10; i++) {
                await page.goto(path);
                await page.waitForFunction(() => (window as any).__ready !== undefined, null, { timeout: 60_000 });
                times.push(Math.round(await page.evaluate(() => (window as any).__ready)));
                loads.push(Math.round(await page.evaluate(() => performance.getEntriesByType("navigation")[0]?.duration ?? -1)));
              }
              const sorted = [...times].sort((a, b) => a - b);
              console.log(`READY ${browserName} ${path} ${width}px median ${sorted[5]} max ${sorted[9]} all ${times.join(",")} nav ${loads.join(",")}`);
            });
          }
          SPEC
          pnpm exec playwright test --config probe.config.ts 2>&1 | grep -E 'READY|passed|failed|Error' || true
