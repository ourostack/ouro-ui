      - id: install
        run: pnpm i --frozen-lockfile
        continue-on-error: true
      - *pnpm-install-stalled
      - *pnpm-install-retry
      - name: Script tests that drive a browser
        run: |
          mkdir -p .tmp/timings
          # Word splitting is wanted: the paths have no spaces.
          # shellcheck disable=SC2046
          node scripts/run-script-tests.mjs --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/timings-node-reporter.mjs --test-reporter-destination="$TIMINGS" $(node scripts/shard.mjs scripts-browser "$SHARD")
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timings-scripts-browser-${{ matrix.shard }}
          path: .tmp/timings/
          include-hidden-files: true
          if-no-files-found: ignore
