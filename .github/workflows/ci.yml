name: CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  # release.yml runs CI on its release branch this way: pushes made with GITHUB_TOKEN
  # trigger no workflows.
  workflow_dispatch:
permissions:
  contents: read
# A push to a pull request cancels that pull request's run in progress, and a run waiting for it:
# only its newest commit can merge. No other run is ever cancelled or replaced: each merge-queue
# entry, push to main and dispatched run (Release's CI on its release branch) is in a group of its
# own (its run id), since a queue entry, Pages and Release wait on that exact run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Each job ends within about twice the 90th percentile of its passing runs (the last 60 runs of
# this workflow, 2026-10-22), and 10 minutes at least: a runner that hangs, as on a mirror that
# stopped answering (#174's queue run 39783627653), fails its job instead of holding the merge
# queue for GitHub's 6 hours. Some take more, after runs that passed slower: mutation-shard (a cold
# cache, 12 minutes; a pull request whose changed lines are many slow mutants, the Toaster's
# announcer in #221, took a shard 18) and conformance-shard (15 minutes); ci, whose fallback to the full suite on a
# reduced pull request took 15.7 minutes (#159); browser and e2e-shard, which a slow mirror took to
# 50.6 and 38.9 minutes while still installing; and themes, visual and theme-install, where an apt
# install stopped after 15 minutes and tried again still fits.
# The jobs that run a browser run in Playwright's image, at the version package.json pins, by
# digest: its browsers and their system packages are in it, so they install nothing from Ubuntu's
# mirror (OURO_SYSTEM_PACKAGES=image). The image has no zstd, so actions/cache there used gzip and
# missed the caches the runner saved, Stryker's among them: the runner's own zstd is lent to it,
# which needs the image's Ubuntu (24.04), so these jobs name that runner. Their pnpm store cache is
# off, as the store's path differs there: pnpm i takes about 5 seconds from the network, and a
# cache that missed cost 10 more to save.
jobs:
  plan:
    # Which browser tests this run needs (scripts/test-impact.mjs). A pull request into main runs
    # the tests of the components it changed and of every component that imports them; a change
    # to anything shared (the theme, lib/, test/, scripts/, configuration, dependencies,
    # workflows) or that cannot be mapped runs everything, and so do main, the merge queue,
    # dispatched runs (how release.yml runs CI on its release branch) and release branches.
    # The jobs that read the plan run whatever happens to it and run everything unless it says
    # `full=false`, so every required check still reports: a reduced job passes on what it ran.
    #
    # A push to main whose commit the merge queue already tested (the queue fast-forwards main to
    # the commit its group's CI passed on) runs nothing more than install-github: `tested=true`.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      full: ${{ steps.plan.outputs.full }}
      components: ${{ steps.plan.outputs.components }}
      tested: ${{ steps.tested.outputs.tested }}
    steps:
      - id: tested
        name: Did the merge queue test this commit?
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # A merge group's run, or the run release.yml dispatches on a queue branch (a queue entry
          # made with GITHUB_TOKEN starts no merge_group run), that passed on this very commit.
          passed=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success&per_page=100" --jq '[.workflow_runs[] | select(.event == "merge_group" or (.event == "workflow_dispatch" and (.head_branch | startswith("gh-readonly-queue/main/"))))] | length') || passed=0
          if [ "${passed:-0}" -gt 0 ]; then
            echo "The merge queue's CI passed on $SHA: only install-github runs."
            echo "tested=true" >> "$GITHUB_OUTPUT"
          else
            echo "No merge queue run passed on $SHA: everything runs."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - id: plan
        name: Plan the tests
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ] && [ "$BASE_REF" = main ] && [[ "$HEAD_REF" != release/* ]]; then
            node scripts/test-impact.mjs plan HEAD^1 HEAD || {
              echo "::warning::Could not plan the tests, so everything runs."
              echo "full=true" >> "$GITHUB_OUTPUT"
            }
          else
            echo "Everything runs: $EVENT on $REF${BASE_REF:+ into $BASE_REF}. Only a pull request into main runs what it can affect."
            echo "full=true" >> "$GITHUB_OUTPUT"
          fi
  mutation-plan:
    # Plans mutation testing (scripts/mutation.mjs, docs/guides/conformance.md). The shards' results
    # are kept between runs of a pull request, merged into one file, under a key with a hash of
    # every lib/ and theme file, the lockfile, app.css, the Vitest config and setup, the tests the
    # mutants run against, and what all of these and the changed files import (scripts/mutation/
    # cache.mjs key), since Stryker's incremental mode compares only a mutated file; a changed
    # file's kept results are dropped before a run when it or a changed file it imports changed
    # since (pruneChangedFiles). On a pull request, as many shards as plan each at
    # SHARD_TARGET_SECONDS of estimated work or under (scripts/mutation.mjs --count, shardCount in
    # cache.mjs), so a large change's shards each finish in about 20 minutes, at most 16; at least
    # three with results cached under the same hash, five without, so a cold run's mutants spread
    # wider. On any other run, three shards that each report nothing to mutate.
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EVENT: ${{ github.event_name }}
      PR: ${{ github.event.pull_request.number }}
    outputs:
      key: ${{ steps.key.outputs.key }}
      count: ${{ steps.count.outputs.count }}
      shards: ${{ steps.count.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: key
        name: The cache key's prefix
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "key=stryker-$PR-$(node scripts/mutation/cache.mjs key HEAD^1)-" >> "$GITHUB_OUTPUT"
          else
            echo "key=" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.key != ''
        id: cached
        name: Results from an earlier run?
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tmp/stryker-incremental.json
          key: ${{ steps.key.outputs.key }}${{ github.sha }}
          restore-keys: ${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.key.outputs.key != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.key.outputs.key != ''
        run: pnpm i --frozen-lockfile
      - id: count
        name: How many shards
        env:
          KEY: ${{ steps.key.outputs.key }}
          MATCHED: ${{ steps.cached.outputs.cache-matched-key }}
        run: |
          if [ -n "$KEY" ] && [ -z "$MATCHED" ]; then
            min=5
            echo "No results cached under $KEY: at least $min shards."
          else
            min=3
            echo "Results cached under ${MATCHED:-nothing (not a pull request)}: at least $min shards."
          fi
          if [ -n "$KEY" ]; then
            count=$(node scripts/mutation.mjs HEAD^1 --count "$min/16")
            [[ "$count" =~ ^[0-9]+$ ]] || { echo "::error::Could not plan the mutation shards (got '$count')."; exit 1; }
            echo "The changed lines' estimated work plans into $count shards."
          else
            count=$min
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "shards=[$(seq "$count" | paste -sd , -)]" >> "$GITHUB_OUTPUT"
  mutation-shard:
    # Mutation testing of the lines a pull request added or changed in the runtime source: every
    # mutant Stryker makes of them must fail a test. The changed ranges are split across the shards
    # by their estimated mutants and their tests' measured time (scripts/mutation/test-seconds.json),
    # and each shard starts from the results kept from the pull request's last run, so a push
    # reruns only the mutants its change touched. Pull requests only; on any other run, and on a
    # pull request that changes no runtime source, it reports that there is nothing to mutate. The
    # `mutation` job below is the one check the rules require.
    needs: [plan, mutation-plan]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # In Playwright's image (see the note above jobs:).
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
      env:
        OURO_SYSTEM_PACKAGES: image
    env:
      EVENT: ${{ github.event_name }}
      SHARD: ${{ matrix.shard }}
      COUNT: ${{ needs.mutation-plan.outputs.count }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutation-plan.outputs.shards) }}
    name: mutation (${{ matrix.shard }}/${{ needs.mutation-plan.outputs.count }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - id: changed
        name: Is any runtime source changed?
        run: |
          if [ "$EVENT" = pull_request ] && git diff --quiet HEAD^1 HEAD -- registry/ouro/components/ registry/ouro/lib/ouro/; then
            echo "Nothing to mutate: this pull request changes no runtime source."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing to mutate: only a pull request's changed lines are mutated."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        run: pnpm i --frozen-lockfile
      - if: steps.changed.outputs.run == 'true'
        name: Results from the last run
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tmp/stryker-incremental.json
          key: ${{ needs.mutation-plan.outputs.key }}${{ github.sha }}
          restore-keys: ${{ needs.mutation-plan.outputs.key }}
      - if: steps.changed.outputs.run == 'true'
        name: Mutation testing
        run: pnpm mutation HEAD^1 --shard "$SHARD/$COUNT"
      # This shard's results, survivors included, for the mutation job to merge and keep.
      - if: ${{ !cancelled() && steps.changed.outputs.run == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stryker-incremental-${{ matrix.shard }}
          path: .tmp/stryker-incremental.json
          if-no-files-found: ignore
          retention-days: 1
  mutation:
    # The one check the rules require for mutation testing: it passes when every shard did (on a
    # merge-queue run, each shard has nothing to mutate and passes), so the shard count can change
    # without touching the ruleset. On a pull request it first merges the shards' results into one
    # file and keeps it for the next run, under the plan's key. It keeps them after a failed run
    # too: each shard uploads only the mutants of its own ranges (scopeReport), so a survivor stays
    # Survived in the merge and fails the next run as well, unless a test that could kill it changed.
    needs: [plan, mutation-plan, mutation-shard]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RESULT: ${{ needs.mutation-shard.result }}
      KEY: ${{ needs.mutation-plan.outputs.key }}
    steps:
      - if: env.KEY != ''
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.KEY != ''
        continue-on-error: true
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - if: env.KEY != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: stryker-incremental-*
          path: .tmp/shards
      - if: env.KEY != ''
        continue-on-error: true
        name: One result file from the shards
        run: node scripts/mutation/cache.mjs merge .tmp/stryker-incremental.json .tmp/shards/*/stryker-incremental.json
      - if: ${{ env.KEY != '' && hashFiles('.tmp/stryker-incremental.json') != '' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tmp/stryker-incremental.json
          key: ${{ env.KEY }}${{ github.sha }}
      - name: Every shard passed
        run: |
          echo "The mutation shards: $RESULT."
          [ "$RESULT" = success ]
