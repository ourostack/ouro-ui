name: CI
# PROBE (branch probe/command-lightbox, never merged): do Command's WebKit tests fail beside Lightbox's?
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
      env:
        OURO_SYSTEM_PACKAGES: image
    strategy:
      fail-fast: false
      matrix:
        set: [shard3-refreshed, command-lightbox, command-alone]
    name: browser probe (${{ matrix.set }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - run: pnpm i --frozen-lockfile
      - name: Run
        env:
          SET: ${{ matrix.set }}
        run: |
          C=registry/ouro/components/ouro/command/command.test.tsx
          L=registry/ouro/components/ouro/lightbox/lightbox.test.tsx
          for i in 1 2 3 4 5 6; do
            case "$SET" in
              shard3-refreshed) [ "$i" -le 2 ] || continue; pnpm exec vitest run --shard=3/6 > "out-$i.txt" 2>&1 || true ;;
              command-lightbox) pnpm exec vitest run --project=ouro-webkit "$C" "$L" > "out-$i.txt" 2>&1 || true ;;
              command-alone) pnpm exec vitest run --project=ouro-webkit "$C" > "out-$i.txt" 2>&1 || true ;;
            esac
            echo "run $i: $(grep -E '^ +Tests ' "out-$i.txt" | tr -s ' ')"
            grep -E '^ +× ' "out-$i.txt" | cut -c1-160 | sort -u
          done
