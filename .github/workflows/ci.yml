name: CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  # release.yml runs CI on its release branch this way: pushes made with GITHUB_TOKEN
  # trigger no workflows.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
# Each job ends within about twice the 90th percentile of its passing runs (the last 60 runs of
# this workflow, 2026-10-22), and 10 minutes at least: a runner that hangs, as on a mirror that
# stopped answering (#174's queue run 39783627653), fails its job instead of holding the merge
# queue for GitHub's 6 hours. Some take more, after runs that passed slower: mutation-shard (a cold
# cache, 12 minutes) and conformance-shard (15 minutes); ci, whose fallback to the full suite on a
# reduced pull request took 15.7 minutes (#159); browser and e2e-shard, which a slow mirror took to
# 50.6 and 38.9 minutes while still installing; and themes, visual and theme-install, where an apt
# install stopped after 15 minutes and tried again still fits.
# The jobs that run a browser run in Playwright's image, at the version package.json pins, by
# digest: its browsers and their system packages are in it, so they install nothing from Ubuntu's
# mirror (OURO_SYSTEM_PACKAGES=image). The image has no zstd, so actions/cache there used gzip and
# missed the caches the runner saved, Stryker's among them: the runner's own zstd is lent to it,
# which needs the image's Ubuntu (24.04), so these jobs name that runner. Their pnpm store cache is
# off, as the store's path differs there: pnpm i takes about 5 seconds from the network, and a
# cache that missed cost 10 more to save.
jobs:
  plan:
    # Which browser tests this run needs (scripts/test-impact.mjs). A pull request into main runs
    # the tests of the components it changed and of every component that imports them; a change
    # to anything shared (the theme, lib/, test/, scripts/, configuration, dependencies,
    # workflows) or that cannot be mapped runs everything, and so do main, the merge queue,
    # dispatched runs (how release.yml runs CI on its release branch) and release branches.
    # The jobs that read the plan run whatever happens to it and run everything unless it says
    # `full=false`, so every required check still reports: a reduced job passes on what it ran.
    #
    # A push to main whose commit the merge queue already tested (the queue fast-forwards main to
    # the commit its group's CI passed on) runs nothing more than install-github: `tested=true`.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      full: ${{ steps.plan.outputs.full }}
      components: ${{ steps.plan.outputs.components }}
      tested: ${{ steps.tested.outputs.tested }}
    steps:
      - id: tested
        name: Did the merge queue test this commit?
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # A merge group's run, or the run release.yml dispatches on a queue branch (a queue entry
          # made with GITHUB_TOKEN starts no merge_group run), that passed on this very commit.
          passed=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success&per_page=100" --jq '[.workflow_runs[] | select(.event == "merge_group" or (.event == "workflow_dispatch" and (.head_branch | startswith("gh-readonly-queue/main/"))))] | length') || passed=0
          if [ "${passed:-0}" -gt 0 ]; then
            echo "The merge queue's CI passed on $SHA: only install-github runs."
            echo "tested=true" >> "$GITHUB_OUTPUT"
          else
            echo "No merge queue run passed on $SHA: everything runs."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - id: plan
        name: Plan the tests
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ] && [ "$BASE_REF" = main ] && [[ "$HEAD_REF" != release/* ]]; then
            node scripts/test-impact.mjs plan HEAD^1 HEAD || {
              echo "::warning::Could not plan the tests, so everything runs."
              echo "full=true" >> "$GITHUB_OUTPUT"
            }
          else
            echo "Everything runs: $EVENT on $REF${BASE_REF:+ into $BASE_REF}. Only a pull request into main runs what it can affect."
            echo "full=true" >> "$GITHUB_OUTPUT"
          fi
  checks:
    # The checks that need no browser: the generated docs, the types, the lint, the site as Pages
    # builds it with every internal link in it, in exact letter case (scripts/links.mjs; the
    # sources' links are checked in the script tests), and Storybook. Part of the ci check.
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm run docs --check
      - run: pnpm typecheck
      - run: pnpm lint
      # Every factual sentence on every surface is a claim with a primary source and a check,
      # and every check holds (scripts/claims.mjs, docs/guides/claims.md). The checks read only
      # the checkout; urlOk reads scripts/claims-urls.json. On a pull request, the required checks
      # are read at its base, and the addresses it adds to the cache or changes are fetched again.
      # The ratchet runs here too, in a required check: what the pull request adds to, changes in
      # or removes from claims.config.json's exemptions must be named in its description, and so
      # must each file that gains a `// real clock:` escape (scripts/real-clock-ratchet.mjs). After
      # editing the description, push again: a re-run reads the description the run started with.
      - name: Claims
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            CLAIMS_BASE_REF="origin/$BASE_REF" node scripts/claims.mjs ratchet
            REAL_CLOCK_BASE_REF="origin/$BASE_REF" node scripts/real-clock-ratchet.mjs
            CLAIMS_BASE_REF="origin/$BASE_REF" pnpm claims:check --network=changed
          else
            pnpm claims:check
          fi
      - run: pnpm site:build
      - run: node scripts/links.mjs site/dist
      - run: pnpm build-storybook
      # The release rehearsal: release.yml runs CI on the release commit before it pushes the tag,
      # so a check that reads the release's own tag fails only at release time. This writes the
      # release commit's files here (scripts/release-commit.sh) for the next patch version, whose
      # tag does not exist, and runs the checks that read them, and the site build, as CI on the
      # release branch runs them.
      - name: Release rehearsal
        run: |
          next=$(node -p 'const [major, minor, patch] = require("./package.json").ouro.latestRelease.slice(1).split(".").map(Number); `${major}.${minor}.${patch + 1}`')
          if git rev-parse -q --verify "refs/tags/v$next" > /dev/null; then echo "::error::v$next already exists here, so it cannot stand for a release that has no tag yet."; exit 1; fi
          scripts/release-commit.sh "$next"
          # As CI runs on the release branch: a pinned registry.json fails the check only on main.
          export GITHUB_REF="refs/heads/release/v$next" GITHUB_BASE_REF=""
          pnpm registry --check
          pnpm run docs --check
          pnpm claims:check
          pnpm site:build
  browser:
    # The browser tests (pnpm test), in shards that run side by side: each takes the test files
    # scripts/shard-timings.json says add up to its share of the time, and its slice of the suites
    # that iterate every story or page (scripts/vitest-shards.mts, test/slice.ts). On a reduced
    # pull request, the selected components' tests, the shared suites over their stories and the
    # site's tests, still in every Vitest project (scripts/test-impact.mjs vitest). Each shard
    # uploads its motion evidence, its coverage (the ci job merges it and holds it to 100%) and how
    # long each file took (`node scripts/shard.mjs refresh`), then checks its share of the installed
    # subsets: an app that installs some components with their tests reaches 100% of what it
    # installed (the button, the dialog, the sheet and the forms set, each alone and together; on a
    # reduced pull request, the sets that install a selected component). Part of the ci check.
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # In Playwright's image (see the note above jobs:).
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
      env:
        OURO_SYSTEM_PACKAGES: image
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: browser (${{ matrix.shard }}/4)
    env:
      FULL: ${{ needs.plan.outputs.full != 'false' }}
      COMPONENTS: ${{ needs.plan.outputs.components }}
      SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - run: pnpm i --frozen-lockfile
      - id: tests
        name: Browser tests
        run: |
          if [ "$FULL" = true ]; then
            pnpm exec vitest run --coverage --shard="$SHARD"
          else
            node scripts/test-impact.mjs vitest "$COMPONENTS" --shard "$SHARD"
          fi
      # The motion evidence that run wrote, one partition per Vitest project and shard
      # (scripts/motion-reporter.mts), uploaded before the subset runs below rewrite it. The
      # motion-coverage job merges it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: motion-browser-${{ matrix.shard }}
          path: .tmp/motion/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      # A reduced run that selected no component measures no coverage, so none may be there.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-browser-${{ matrix.shard }}
          path: coverage/coverage-final.json
          if-no-files-found: ignore
          retention-days: 7
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timings-browser-${{ matrix.shard }}
          path: .tmp/timings/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Coverage of installed subsets
        run: |
          if [ "$FULL" = true ]; then node scripts/subset-coverage.mjs --shard "$SHARD"; else node scripts/subset-coverage.mjs --touching "$COMPONENTS" --shard "$SHARD"; fi
  scripts:
    # pnpm test:scripts, in shards that run side by side, each with the files whose measured times
    # (scripts/shard-timings.json) add up to its share (`node scripts/shard.mjs scripts`), but the
    # ones that drive a browser, which scripts-browser runs: these need no browser and no system
    # package. Each uploads how long each file took. Part of the ci check.
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: scripts (${{ matrix.shard }}/2)
    env:
      SHARD: ${{ matrix.shard }}/2
      TIMINGS: .tmp/timings/scripts-${{ matrix.shard }}of2.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - name: Script tests
        run: |
          mkdir -p .tmp/timings
          # Word splitting is wanted: the paths have no spaces.
          # shellcheck disable=SC2046
          node scripts/run-script-tests.mjs --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/timings-node-reporter.mjs --test-reporter-destination="$TIMINGS" $(node scripts/shard.mjs scripts "$SHARD")
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timings-scripts-${{ matrix.shard }}
          path: .tmp/timings/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
  scripts-browser:
    # The script tests that drive a browser (`node scripts/shard.mjs scripts-browser`: those that
    # import Playwright's runtime, as the agent usability scorer does), in Playwright's image. Part
    # of the ci check.
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
      env:
        OURO_SYSTEM_PACKAGES: image
    name: scripts (browser)
    env:
      TIMINGS: .tmp/timings/scripts-browser.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - run: pnpm i --frozen-lockfile
      - name: Script tests that drive a browser
        run: |
          mkdir -p .tmp/timings
          # Word splitting is wanted: the paths have no spaces.
          # shellcheck disable=SC2046
          node scripts/run-script-tests.mjs --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/timings-node-reporter.mjs --test-reporter-destination="$TIMINGS" $(node scripts/shard.mjs scripts-browser)
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timings-scripts-browser
          path: .tmp/timings/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
  ci:
    # Passes when every part of it passed (checks, every browser shard and every script test
    # job), and the browser shards' merged coverage reaches 100% (scripts/coverage-merge.mjs).
    # On a reduced pull request whose merged coverage falls short, the full browser suite runs here
    # and decides: a line may be covered only by another component's tests
    # (scripts/test-impact.mjs coverage). The step says which, for the motion-coverage job.
    needs: [plan, checks, browser, scripts, scripts-browser]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      reduced: ${{ steps.tests.outputs.reduced }}
      stems: ${{ steps.tests.outputs.stems }}
      fallback: ${{ steps.tests.outputs.fallback }}
    env:
      FULL: ${{ needs.plan.outputs.full != 'false' }}
      COMPONENTS: ${{ needs.plan.outputs.components }}
      BROWSER_SHARDS: 4
    steps:
      - name: Every part passed
        env:
          CHECKS: ${{ needs.checks.result }}
          BROWSER: ${{ needs.browser.result }}
          SCRIPTS: ${{ needs.scripts.result }}
          SCRIPTS_BROWSER: ${{ needs.scripts-browser.result }}
        run: |
          failed=0
          for part in "checks=$CHECKS" "browser=$BROWSER" "scripts=$SCRIPTS" "scripts-browser=$SCRIPTS_BROWSER"; do
            if [ "${part#*=}" != success ]; then
              echo "::error::The ${part%%=*} jobs did not pass (${part#*=}): see them above this run's ci check."
              failed=1
            fi
          done
          exit "$failed"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-browser-*
          path: ${{ runner.temp }}/coverage
      - id: tests
        name: Browser test coverage
        run: |
          if [ "$FULL" = true ]; then
            node scripts/coverage-merge.mjs "$RUNNER_TEMP/coverage" --shards "$BROWSER_SHARDS"
            printf 'reduced=false\nstems=\nfallback=false\n' >> "$GITHUB_OUTPUT"
          else
            node scripts/test-impact.mjs coverage "$RUNNER_TEMP/coverage" "$COMPONENTS" --shards "$BROWSER_SHARDS"
          fi
      # The full suite's motion evidence, when it decided here, in place of the shards'.
      - if: steps.tests.outputs.fallback == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: motion-full
          path: .tmp/motion/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  motion-coverage:
    # Holds every component.json "motion" map complete against the records the browser tests
    # made (scripts/motion-coverage.mts): each declared property ran, nothing undeclared ran,
    # each named test recorded its state, and each motion state was proved with reduced motion.
    # --expect names each Vitest project the browser shards run, once per shard, so a missing or
    # doubled partition fails (scripts/workflows.test.mjs derives the list from vitest.config.ts);
    # when the full suite decided in the ci job, its unsharded partitions instead.
    # A reduced pull request still runs every project; it ran only some components' tests, so
    # --stems holds only their maps complete (the ci job's `stems`).
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MOTION_PARTITIONS: ouro-chromium:4,ouro-webkit:4,ouro-touch:4,site:4
      FULL_SUITE_PARTITIONS: ouro-chromium:1,ouro-webkit:1,ouro-touch:1,site:1
      REDUCED: ${{ needs.ci.outputs.reduced }}
      STEMS: ${{ needs.ci.outputs.stems }}
      FALLBACK: ${{ needs.ci.outputs.fallback }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      # Each browser test job's artifact lands in a folder of its own, so no partition overwrites another.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ needs.ci.outputs.fallback == 'true' && 'motion-full' || 'motion-browser-*' }}
          path: ${{ runner.temp }}/motion
      - name: Motion coverage
        run: |
          if [ "$FALLBACK" = true ]; then MOTION_PARTITIONS=$FULL_SUITE_PARTITIONS; fi
          if [ "$REDUCED" = true ]; then
            pnpm motion:coverage --dir "$RUNNER_TEMP/motion" --expect "$MOTION_PARTITIONS" --stems "$STEMS"
          else
            pnpm motion:coverage --dir "$RUNNER_TEMP/motion" --expect "$MOTION_PARTITIONS"
          fi
  themes:
    # Every story passes axe under shadcn's nova and vega presets and Spoonjoy's cookbook theme
    # (test/theme-fixtures/), light and dark, closed and with each overlay open: the components
    # read only shadcn's standard tokens, so a third-party theme carries through. One fixture per
    # shard (test/themes/), in Chromium, beside the ci job. On a reduced pull request, only the
    # selected components' stories, and nothing when it selected none.
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # In Playwright's image (see the note above jobs:).
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
      env:
        OURO_SYSTEM_PACKAGES: image
    env:
      FULL: ${{ needs.plan.outputs.full != 'false' }}
      COMPONENTS: ${{ needs.plan.outputs.components }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: themes (${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - id: affected
        name: Is any story affected?
        run: |
          if [ "$FULL" = true ] || [ -n "$COMPONENTS" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not affected: this pull request changes no component, so no story's theme scan can change. Nothing to run."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.affected.outputs.run == 'true'
        run: pnpm i --frozen-lockfile
      - if: steps.affected.outputs.run == 'true'
        name: Theme scans
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          if [ "$FULL" = true ]; then
            pnpm test:themes --shard="$SHARD/3"
          else
            OURO_STORIES=$(node scripts/test-impact.mjs stories "$COMPONENTS") pnpm test:themes --shard="$SHARD/3"
          fi
  conformance-shard:
    # The conformance matrix (test/conformance/, docs/guides/conformance.md): every story through
    # the checks that replace recurring review findings (focus after every action, announcements,
    # hydration under foreign time zones and locales, right to left, forced colours), in Chromium,
    # beside the ci job. Each shard takes every nth story (OURO_CONFORMANCE_SHARD, n being the
    # matrix's size), so the shards finish together and adding one is a one-line change; the
    # `conformance` job below is the one check the rules require. On a reduced pull request, only
    # the selected components' stories; with none selected, only the checks' proofs that they can
    # fail (the broken stories, on the first shard), which every run checks.
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # In Playwright's image (see the note above jobs:).
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
      env:
        OURO_SYSTEM_PACKAGES: image
    env:
      FULL: ${{ needs.plan.outputs.full != 'false' }}
      COMPONENTS: ${{ needs.plan.outputs.components }}
      SHARD: ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: conformance (${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - id: affected
        name: Is any story affected?
        run: |
          if [ "$FULL" = true ] || [ -n "$COMPONENTS" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$SHARD" = 1 ]; then
            echo "Not affected: this pull request changes no component, so no story's conformance can change. The checks still prove they can fail."
            echo "run=proofs" >> "$GITHUB_OUTPUT"
          else
            echo "Not affected: this pull request changes no component, so no story's conformance can change. Nothing to run."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.affected.outputs.run != 'false'
        run: pnpm i --frozen-lockfile
      - if: steps.affected.outputs.run == 'true'
        name: Conformance
        env:
          OURO_CONFORMANCE_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          if [ "$FULL" = true ]; then
            pnpm conformance
          else
            OURO_STORIES=$(node scripts/test-impact.mjs stories "$COMPONENTS") pnpm conformance
          fi
      - if: steps.affected.outputs.run == 'proofs'
        name: The checks prove they can fail
        run: pnpm conformance -t "can fail"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-${{ matrix.shard }}
          path: .vitest/attachments/
          if-no-files-found: ignore
  conformance:
    # The one check the rules require for the conformance matrix: it passes when every shard did,
    # so the shard count can change without touching the ruleset.
    needs: [plan, conformance-shard]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RESULT: ${{ needs.conformance-shard.result }}
    steps:
      - name: Every shard passed
        run: |
          echo "The conformance shards: $RESULT."
          [ "$RESULT" = success ]
  mutation-plan:
    # Plans mutation testing (scripts/mutation.mjs, docs/guides/conformance.md). The shards' results
    # are kept between runs of a pull request, merged into one file, under a key with a hash of
    # every lib/ and theme file, the lockfile, app.css, the Vitest config and setup, the tests the
    # mutants run against, and what all of these and the changed files import (scripts/mutation/
    # cache.mjs key), since Stryker's incremental mode compares only a mutated file; a changed
    # file's kept results are dropped before a run when it or a changed file it imports changed
    # since (pruneChangedFiles). With results cached
    # under the same hash, three shards; without, five, so a cold run's mutants spread wider. On any
    # other run, three shards that each report nothing to mutate.
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EVENT: ${{ github.event_name }}
      PR: ${{ github.event.pull_request.number }}
    outputs:
      key: ${{ steps.key.outputs.key }}
      count: ${{ steps.count.outputs.count }}
      shards: ${{ steps.count.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: key
        name: The cache key's prefix
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "key=stryker-$PR-$(node scripts/mutation/cache.mjs key HEAD^1)-" >> "$GITHUB_OUTPUT"
          else
            echo "key=" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.key != ''
        id: cached
        name: Results from an earlier run?
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tmp/stryker-incremental.json
          key: ${{ steps.key.outputs.key }}${{ github.sha }}
          restore-keys: ${{ steps.key.outputs.key }}
          lookup-only: true
      - id: count
        name: How many shards
        env:
          KEY: ${{ steps.key.outputs.key }}
          MATCHED: ${{ steps.cached.outputs.cache-matched-key }}
        run: |
          if [ -n "$KEY" ] && [ -z "$MATCHED" ]; then
            count=5
            echo "No results cached under $KEY: $count shards."
          else
            count=3
            echo "Results cached under ${MATCHED:-nothing (not a pull request)}: $count shards."
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "shards=[$(seq "$count" | paste -sd , -)]" >> "$GITHUB_OUTPUT"
  mutation-shard:
    # Mutation testing of the lines a pull request added or changed in the runtime source: every
    # mutant Stryker makes of them must fail a test. The changed ranges are split across the shards
    # by their estimated mutants and their tests' measured time (scripts/mutation/test-seconds.json),
    # and each shard starts from the results kept from the pull request's last run, so a push
    # reruns only the mutants its change touched. Pull requests only; on any other run, and on a
    # pull request that changes no runtime source, it reports that there is nothing to mutate. The
    # `mutation` job below is the one check the rules require.
    needs: [plan, mutation-plan]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # In Playwright's image (see the note above jobs:).
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
      env:
        OURO_SYSTEM_PACKAGES: image
    env:
      EVENT: ${{ github.event_name }}
      SHARD: ${{ matrix.shard }}
      COUNT: ${{ needs.mutation-plan.outputs.count }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutation-plan.outputs.shards) }}
    name: mutation (${{ matrix.shard }}/${{ needs.mutation-plan.outputs.count }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - id: changed
        name: Is any runtime source changed?
        run: |
          if [ "$EVENT" = pull_request ] && git diff --quiet HEAD^1 HEAD -- registry/ouro/components/ registry/ouro/lib/ouro/; then
            echo "Nothing to mutate: this pull request changes no runtime source."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing to mutate: only a pull request's changed lines are mutated."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        run: pnpm i --frozen-lockfile
      - if: steps.changed.outputs.run == 'true'
        name: Results from the last run
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tmp/stryker-incremental.json
          key: ${{ needs.mutation-plan.outputs.key }}${{ github.sha }}
          restore-keys: ${{ needs.mutation-plan.outputs.key }}
      - if: steps.changed.outputs.run == 'true'
        name: Mutation testing
        run: pnpm mutation HEAD^1 --shard "$SHARD/$COUNT"
      # This shard's results, survivors included, for the mutation job to merge and keep.
      - if: ${{ !cancelled() && steps.changed.outputs.run == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stryker-incremental-${{ matrix.shard }}
          path: .tmp/stryker-incremental.json
          if-no-files-found: ignore
          retention-days: 1
  mutation:
    # The one check the rules require for mutation testing: it passes when every shard did (on a
    # merge-queue run, each shard has nothing to mutate and passes), so the shard count can change
    # without touching the ruleset. On a pull request it first merges the shards' results into one
    # file and keeps it for the next run, under the plan's key. It keeps them after a failed run
    # too: each shard uploads only the mutants of its own ranges (scopeReport), so a survivor stays
    # Survived in the merge and fails the next run as well, unless a test that could kill it changed.
    needs: [plan, mutation-plan, mutation-shard]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RESULT: ${{ needs.mutation-shard.result }}
      KEY: ${{ needs.mutation-plan.outputs.key }}
    steps:
      - if: env.KEY != ''
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.KEY != ''
        continue-on-error: true
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - if: env.KEY != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: stryker-incremental-*
          path: .tmp/shards
      - if: env.KEY != ''
        continue-on-error: true
        name: One result file from the shards
        run: node scripts/mutation/cache.mjs merge .tmp/stryker-incremental.json .tmp/shards/*/stryker-incremental.json
      - if: ${{ env.KEY != '' && hashFiles('.tmp/stryker-incremental.json') != '' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tmp/stryker-incremental.json
          key: ${{ env.KEY }}${{ github.sha }}
      - name: Every shard passed
        run: |
          echo "The mutation shards: $RESULT."
          [ "$RESULT" = success ]
  visual:
    # Compares screenshots with the committed baselines, on the image that produced them
    # (visual-baselines.yml). Kept apart from `ci` so that job can follow ubuntu-latest.
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium
      - run: pnpm test:visual
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diff
          path: |
            test/__screenshots__/**/__diff_output__/
            .vitest/attachments/
          if-no-files-found: ignore
  registry:
    # registry.json is generated (scripts/registry.mts) and valid for the pinned shadcn CLI,
    # both from the checkout and through the GitHub path at this commit.
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHADCN: shadcn@4.21.1
      REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm registry --check
      - run: pnpm controls:matrix --check
      - run: npx --yes $SHADCN registry validate ./registry.json
      # The registry as GitHub serves it at this commit: the CLI fetches each of its few hundred
      # files, and now and then one fetch fails (a different file each time), so the fetch is
      # tried again (scripts/retry.sh). A missing file fails every try.
      - run: scripts/retry.sh npx --yes $SHADCN registry validate "ourostack/ouro-ui#$REF"
      - run: npx --yes $SHADCN build --output "$RUNNER_TEMP/r"
  e2e-shard:
    # The end-to-end specs each item ships, against this repository's Storybook, and the site's, in
    # shards that run side by side: each takes the spec files whose measured times add up to its
    # share (`node scripts/shard.mjs e2e`, times in scripts/shard-timings.json), and its two
    # workers split their tests (fullyParallel). Each uploads how long each file took. On a reduced
    # pull request, the selected components' specs and the site's, by Playwright's --shard. Part
    # of the e2e check.
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    # In Playwright's image (see the note above jobs:).
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
      env:
        OURO_SYSTEM_PACKAGES: image
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: e2e (${{ matrix.shard }}/3)
    env:
      FULL: ${{ needs.plan.outputs.full != 'false' }}
      COMPONENTS: ${{ needs.plan.outputs.components }}
      SHARD: ${{ matrix.shard }}/3
      OURO_E2E_TIMINGS: .tmp/timings/e2e-${{ matrix.shard }}of3.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - run: pnpm i --frozen-lockfile
      - name: End-to-end specs
        run: |
          if [ "$FULL" = true ]; then
            specs=$(node scripts/shard.mjs e2e "$SHARD")
            [ -n "$specs" ] || { echo "::error::Shard $SHARD has no spec file to run."; exit 1; }
            # Word splitting is wanted: the paths have no spaces.
            # shellcheck disable=SC2086
            pnpm test:e2e $specs
          else
            # Word splitting is wanted: the paths have no spaces. A shard may get none of a few specs.
            # shellcheck disable=SC2046
            pnpm test:e2e --pass-with-no-tests --shard="$SHARD" $(node scripts/test-impact.mjs e2e "$COMPONENTS")
          fi
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timings-e2e-${{ matrix.shard }}
          path: .tmp/timings/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
  e2e:
    # Passes when every e2e shard passed.
    needs: [plan, e2e-shard]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          if [ "$SHARDS" != success ]; then
            echo "::error::An e2e shard did not pass ($SHARDS): see the e2e (n/3) jobs."
            exit 1
          fi
  theme-install:
    name: theme-install
    # The copy-theme install proof (site/scripts/theme-install-test.sh): each site preset's "Copy
    # theme" CSS, pasted at the end of a clean shadcn app's stylesheet with Checklist and Dialog
    # added, renders the same computed colours, radii, fonts and shadows as the site, light and
    # dark, and its fonts load.
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # In Playwright's image (see the note above jobs:).
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
      env:
        OURO_SYSTEM_PACKAGES: image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - run: pnpm i --frozen-lockfile
      - run: pnpm site:build
      - run: site/scripts/theme-install-test.sh "$RUNNER_TEMP/theme-app"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: theme-install-report
          path: |
            playwright-report/
            site/theme-install/playwright-report/
          if-no-files-found: ignore
  latency:
    name: latency
    # Each voyage stage control answers within budget on a 4x slower CPU: of 20 presses after two
    # warm-ups, the 19th (p95) within 100 ms and the median within its ceiling from the control's CI
    # baseline (site/e2e/latency.ts, site/e2e/stage.latency.spec.ts), measured alone so no other
    # test shares the CPU.
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # In Playwright's image (see the note above jobs:).
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
      env:
        OURO_SYSTEM_PACKAGES: image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - run: pnpm i --frozen-lockfile
      - run: pnpm test:latency
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: latency-report
          path: playwright-report/latency/
          if-no-files-found: ignore
  lighthouse:
    name: lighthouse
    # Lighthouse CI on the voyage preview (site/lighthouserc.json, the thresholds in site-design.md:
    # mobile, simulated; performance 90, accessibility 100, best practices 95, LCP 2 s, CLS 0.05,
    # TBT 150 ms), with the build served as Pages serves it: HTTP/2 over TLS, gzipped
    # (site/scripts/serve-pages.mjs).
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm site:build
      - run: npx --yes @lhci/cli@0.15.1 autorun --config=site/lighthouserc.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: .tmp/lhci/
          if-no-files-found: ignore
  install-shard:
    # Installs every item into a fresh Vite app with the pinned shadcn CLI and runs the app's type
    # check, build, the shipped Vitest tests and the shipped Playwright specs
    # (scripts/install-test.sh). shadcn: the app keeps the theme `shadcn init` wrote, and a stock
    # shadcn button builds beside Ouro's. ouro: ouro-theme comes from GitHub at this commit. The
    # shipped tests take most of the time, so each app is installed in two jobs side by side and
    # each runs half of them (OURO_SHARD); on a reduced pull request, the selected components'
    # shipped tests, and none when it selected none (OURO_COMPONENTS). Each shard that passes
    # leaves a marker, which its variant's install check counts.
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # In Playwright's image (see the note above jobs:).
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
      env:
        OURO_SYSTEM_PACKAGES: image
    strategy:
      fail-fast: false
      matrix:
        variant: [shadcn, ouro]
        # Another shadcn preset than the README's, so its preset wording is verified.
        preset: [nova, vega]
        shard: [1, 2]
        exclude:
          - variant: ouro
            preset: vega
    name: install (${{ matrix.variant }}, ${{ matrix.preset }}, ${{ matrix.shard }}/2)
    env:
      FULL: ${{ needs.plan.outputs.full != 'false' }}
      COMPONENTS: ${{ needs.plan.outputs.components }}
      OURO_PRESET: ${{ matrix.preset }}
      OURO_SHARD: ${{ matrix.shard }}/2
      PASSED: install-passed-${{ matrix.variant }}-${{ matrix.preset }}-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - run: pnpm i --frozen-lockfile
      - name: Install test
        env:
          VARIANT: ${{ matrix.variant }}
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$FULL" != true ]; then export OURO_COMPONENTS="$COMPONENTS"; fi
          scripts/install-test.sh "$VARIANT" "$RUNNER_TEMP/app" "$REF"
          mkdir -p "$RUNNER_TEMP/passed" && echo "$PASSED" > "$RUNNER_TEMP/passed/$PASSED"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PASSED }}
          path: ${{ runner.temp }}/passed/
          if-no-files-found: error
          retention-days: 1
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-${{ matrix.variant }}-${{ matrix.preset }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/app/src/index.css
            ${{ runner.temp }}/app/components.json
            ${{ runner.temp }}/app/package.json
            ${{ runner.temp }}/app/playwright-report/
          if-no-files-found: ignore
  install-gate:
    # A variant's install check: passes when each of its two shards passed, as their markers show,
    # and every install shard of this attempt passed: a marker can be an earlier attempt's, after
    # "Re-run all jobs" (artifacts outlive an attempt), so the markers alone could pass a shard
    # that has just failed.
    needs: [plan, install-shard]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        variant: [shadcn, ouro]
        preset: [nova, vega]
        exclude:
          - variant: ouro
            preset: vega
    name: install (${{ matrix.variant }}, ${{ matrix.preset }})
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: install-passed-${{ matrix.variant }}-${{ matrix.preset }}-*
          path: ${{ runner.temp }}/passed
          merge-multiple: true
      - name: Every shard passed
        env:
          VARIANT: ${{ matrix.variant }}
          PRESET: ${{ matrix.preset }}
          SHARDS: ${{ needs.install-shard.result }}
        run: |
          failed=0
          if [ "$SHARDS" != success ]; then
            echo "::error::an install shard of this attempt did not pass ($SHARDS): see the install (…, n/2) jobs."
            failed=1
          fi
          for shard in 1 2; do
            if [ ! -f "$RUNNER_TEMP/passed/install-passed-$VARIANT-$PRESET-$shard" ]; then
              echo "::error::install ($VARIANT, $PRESET, $shard/2) did not pass: see that job."
              failed=1
            fi
          done
          exit "$failed"
  install:
    # Installs every item into a fresh app and runs its type check and build
    # (scripts/install-test.sh). namespace: `shadcn add @ouro/dialog` from the registry Pages
    # serves, built and served locally. next: a Next.js App Router app renders every component from
    # a Server Component page and runs `next build`.
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        variant: [namespace, next]
        preset: [nova]
    name: install (${{ matrix.variant }}, ${{ matrix.preset }})
    env:
      OURO_PRESET: ${{ matrix.preset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: scripts/install-test.sh ${{ matrix.variant }} "$RUNNER_TEMP/app" ${{ github.event.pull_request.head.sha || github.sha }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-${{ matrix.variant }}-${{ matrix.preset }}
          path: |
            ${{ runner.temp }}/app/src/index.css
            ${{ runner.temp }}/app/components.json
            ${{ runner.temp }}/app/package.json
            ${{ runner.temp }}/app/playwright-report/
          if-no-files-found: ignore
  install-latest:
    # On a release branch only (release.yml dispatches CI there and tags only when it passes):
    # the shadcn variant with the newest shadcn CLI instead of the pinned one, so a release
    # installs with what `npx shadcn@latest` runs today. Here rather than in release.yml, so the
    # unpinned CLI never runs in a job that holds a token able to push the tag.
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    # In Playwright's image (see the note above jobs:).
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
      env:
        OURO_SYSTEM_PACKAGES: image
    name: install (shadcn@latest, nova)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - run: pnpm i --frozen-lockfile
      - run: SHADCN_VERSION=latest scripts/install-test.sh shadcn "$RUNNER_TEMP/latest" ${{ github.sha }}
  install-upgrade:
    # An app on v0.1.0 (dialog from GitHub at #v0.1.0, with tests of its own) runs the
    # commands in UPGRADING.md against this commit's registry, in a src/ and an app/
    # layout, keeping Ouro's tests and without them (scripts/install-test.sh upgrade).
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: scripts/install-test.sh upgrade "$RUNNER_TEMP/app"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-upgrade
          path: |
            ${{ runner.temp }}/app/src/index.css
            ${{ runner.temp }}/app/package.json
            ${{ runner.temp }}/app-without-tests/src/index.css
            ${{ runner.temp }}/app-without-tests/package.json
          if-no-files-found: ignore
  install-github:
    # The install a user runs today: `shadcn add ourostack/ouro-ui/<item>` with no ref, so
    # every item and its Ouro dependencies come from main. Runs on main pushes and manual
    # dispatches, including Release's CI after its prepare-main merge; type check and build.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: scripts/install-test.sh github "$RUNNER_TEMP/app"
  ci-budget:
    # Records this run's critical path, the longest chain of jobs that wait on one another, each
    # counted from its start to its end so a queue for a free runner does not count, and its wall
    # time, in the step summary and the ci-timings artifact (scripts/ci-budget.mjs). On a pull
    # request a critical path over budget (the CI target, plus a margin for runner noise) fails only
    # when it is also more than 2 minutes over main's baseline, the median of the critical paths
    # main's latest passing merge queue runs recorded in their ci-timings, even when that baseline
    # is over budget too, or passes a hard ceiling; otherwise it warns (scripts/ci-budget.mjs,
    # judge). A job that no ci.yml job name matches fails any run. It also records the wall time a
    # developer waits, queues included, with its median over the latest runs, and the runner time
    # the run took from the shared pool. Advisory: ruleset 24881709 does not require it yet.
    needs: [plan, motion-coverage, themes, conformance, mutation, visual, registry, e2e, theme-install, latency, lighthouse, install-gate, install, install-latest, install-upgrade, install-github]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/ci.yml
            scripts/ci-budget.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Critical path
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT: ${{ github.event_name }}
          FULL: ${{ needs.plan.outputs.full != 'false' }}
        run: node scripts/ci-budget.mjs --out "$RUNNER_TEMP/ci-timings.json"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-timings
          path: ${{ runner.temp }}/ci-timings.json
          if-no-files-found: ignore
          retention-days: 90
