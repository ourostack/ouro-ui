name: Private Carousel contract controls
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mutation: [base, cap, duplicate]
    env:
      OURO_PRESET: vega
      VITE_CAROUSEL_MUTATION: ${{ matrix.mutation }}
      CAROUSEL_CONTROL_ONLY: ${{ matrix.mutation != 'base' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - name: Actual vega native contract and intentional reporting-fault controls
        run: scripts/install-test.sh shadcn "$RUNNER_TEMP/app" "$GITHUB_SHA"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carousel-contract-${{ matrix.mutation }}-${{ github.run_id }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/carousel-contract-observations.jsonl
            ${{ runner.temp }}/app/.vitest/attachments/
            ${{ runner.temp }}/app/package.json
            ${{ runner.temp }}/app/src/index.css
          if-no-files-found: error
