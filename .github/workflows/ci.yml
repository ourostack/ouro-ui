name: CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  # release.yml runs CI on its release branch this way: pushes made with GITHUB_TOKEN
  # trigger no workflows.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  plan:
    # Which browser tests this run needs (scripts/test-impact.mjs). A pull request into main runs
    # the tests of the components it changed and of every component that imports them; a change
    # to anything shared (the theme, lib/, test/, scripts/, configuration, dependencies,
    # workflows) or that cannot be mapped runs everything, and so do main, the merge queue,
    # dispatched runs (how release.yml runs CI on its release branch) and release branches.
    # The jobs that read the plan run whatever happens to it and run everything unless it says
    # `full=false`, so every required check still reports: a reduced job passes on what it ran.
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
      components: ${{ steps.plan.outputs.components }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - id: plan
        name: Plan the tests
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ] && [ "$BASE_REF" = main ] && [[ "$HEAD_REF" != release/* ]]; then
            node scripts/test-impact.mjs plan HEAD^1 HEAD || {
              echo "::warning::Could not plan the tests, so everything runs."
              echo "full=true" >> "$GITHUB_OUTPUT"
            }
          else
            echo "Everything runs: $EVENT on $REF${BASE_REF:+ into $BASE_REF}. Only a pull request into main runs what it can affect."
            echo "full=true" >> "$GITHUB_OUTPUT"
          fi
  ci:
    needs: [plan]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      reduced: ${{ steps.tests.outputs.reduced }}
      stems: ${{ steps.tests.outputs.stems }}
    env:
      FULL: ${{ needs.plan.outputs.full != 'false' }}
      COMPONENTS: ${{ needs.plan.outputs.components }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm run docs --check
      - run: pnpm typecheck
      - run: pnpm lint
      # Every browser test (pnpm test), or on a reduced pull request the selected components'
      # tests, the shared suites over their stories and the site's tests, still in every Vitest
      # project (scripts/test-impact.mjs vitest); when only coverage falls short there, the full
      # suite decides. The step says which ran, for the motion-coverage job.
      - id: tests
        name: Browser tests
        run: |
          if [ "$FULL" = true ]; then
            pnpm test
            printf 'reduced=false\nstems=\n' >> "$GITHUB_OUTPUT"
          else
            node scripts/test-impact.mjs vitest "$COMPONENTS"
          fi
      # The motion evidence that run wrote, one partition per Vitest project
      # (scripts/motion-reporter.mts), uploaded before any later Vitest run in this job
      # rewrites it. The motion-coverage job merges it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: motion-ci
          path: .tmp/motion/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      # An app that installs some components with their tests reaches 100% of what it
      # installed: the button, the dialog, the sheet and the forms set, each alone and together
      # (on a reduced pull request, the sets that install a selected component).
      - name: Coverage of installed subsets
        run: |
          if [ "$FULL" = true ]; then node scripts/subset-coverage.mjs; else node scripts/subset-coverage.mjs --touching "$COMPONENTS"; fi
      - run: pnpm test:scripts
      # The site as Pages builds it, then every internal link in it, in exact letter case
      # (scripts/links.mjs; the sources' links are checked in test:scripts).
      - run: pnpm site:build
      - run: node scripts/links.mjs site/dist
      - run: pnpm build-storybook
  motion-coverage:
    # Holds every component.json "motion" map complete against the records the browser tests
    # made (scripts/motion-coverage.mts): each declared property ran, nothing undeclared ran,
    # each named test recorded its state, and each motion state was proved with reduced motion.
    # --expect names each Vitest project the ci job's `pnpm test` runs, unsharded, so a missing
    # or doubled partition fails (scripts/workflows.test.mjs derives the list from vitest.config.ts).
    # A reduced pull request still runs every project; it ran only some components' tests, so
    # --stems holds only their maps complete (the ci job's `stems`).
    needs: [ci]
    runs-on: ubuntu-latest
    env:
      MOTION_PARTITIONS: ouro-chromium:1,ouro-webkit:1,ouro-touch:1,site:1
      REDUCED: ${{ needs.ci.outputs.reduced }}
      STEMS: ${{ needs.ci.outputs.stems }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      # Each browser test job's artifact lands in a folder of its own, so no partition overwrites another.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: motion-*
          path: ${{ runner.temp }}/motion
      - name: Motion coverage
        run: |
          if [ "$REDUCED" = true ]; then
            pnpm motion:coverage --dir "$RUNNER_TEMP/motion" --expect "$MOTION_PARTITIONS" --stems "$STEMS"
          else
            pnpm motion:coverage --dir "$RUNNER_TEMP/motion" --expect "$MOTION_PARTITIONS"
          fi
  themes:
    # Every story passes axe under shadcn's nova and vega presets and Spoonjoy's cookbook theme
    # (test/theme-fixtures/), light and dark, closed and with each overlay open: the components
    # read only shadcn's standard tokens, so a third-party theme carries through. One fixture per
    # shard (test/themes/), in Chromium, beside the ci job. On a reduced pull request, only the
    # selected components' stories, and nothing when it selected none.
    needs: [plan]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      FULL: ${{ needs.plan.outputs.full != 'false' }}
      COMPONENTS: ${{ needs.plan.outputs.components }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: themes (${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - id: affected
        name: Is any story affected?
        run: |
          if [ "$FULL" = true ] || [ -n "$COMPONENTS" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not affected: this pull request changes no component, so no story's theme scan can change. Nothing to run."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.affected.outputs.run == 'true'
        run: pnpm i --frozen-lockfile
      - if: steps.affected.outputs.run == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.affected.outputs.run == 'true'
        name: Theme scans
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          if [ "$FULL" = true ]; then
            pnpm test:themes --shard="$SHARD/3"
          else
            OURO_STORIES=$(node scripts/test-impact.mjs stories "$COMPONENTS") pnpm test:themes --shard="$SHARD/3"
          fi
  visual:
    # Compares screenshots with the committed baselines, on the image that produced them
    # (visual-baselines.yml). Kept apart from `ci` so that job can follow ubuntu-latest.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:visual
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diff
          path: |
            test/__screenshots__/**/__diff_output__/
            .vitest/attachments/
          if-no-files-found: ignore
  registry:
    # registry.json is generated (scripts/registry.mts) and valid for the pinned shadcn CLI,
    # both from the checkout and through the GitHub path at this commit.
    runs-on: ubuntu-latest
    env:
      SHADCN: shadcn@4.21.1
      REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm registry --check
      - run: pnpm controls:matrix --check
      - run: npx --yes $SHADCN registry validate ./registry.json
      - run: npx --yes $SHADCN registry validate "ourostack/ouro-ui#$REF"
      - run: npx --yes $SHADCN build --output "$RUNNER_TEMP/r"
  e2e:
    # The end-to-end specs each item ships, against this repository's Storybook. On a reduced pull
    # request, the selected components' specs and the site's.
    needs: [plan]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      FULL: ${{ needs.plan.outputs.full != 'false' }}
      COMPONENTS: ${{ needs.plan.outputs.components }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: End-to-end specs
        run: |
          if [ "$FULL" = true ]; then
            pnpm test:e2e
          else
            # Word splitting is wanted: the paths have no spaces.
            # shellcheck disable=SC2046
            pnpm test:e2e $(node scripts/test-impact.mjs e2e "$COMPONENTS")
          fi
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: playwright-report/
          if-no-files-found: ignore
  theme-install:
    # The copy-theme install proof (site/scripts/theme-install-test.sh): each site preset's "Copy
    # theme" CSS, pasted at the end of a clean shadcn app's stylesheet with Checklist and Dialog
    # added, renders the same computed colours, radii, fonts and shadows as the site, light and
    # dark, and its fonts load.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm site:build
      - run: site/scripts/theme-install-test.sh "$RUNNER_TEMP/theme-app"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: theme-install-report
          path: |
            playwright-report/
            site/theme-install/playwright-report/
          if-no-files-found: ignore
  install:
    # Installs every item into a fresh Vite app with the pinned shadcn CLI and runs the
    # app's type check, build, the shipped Vitest tests and the shipped Playwright specs
    # (scripts/install-test.sh). shadcn: the app keeps the theme `shadcn init` wrote, and a
    # stock shadcn button builds beside Ouro's. ouro: ouro-theme comes from GitHub at this commit.
    # namespace: `shadcn add @ouro/dialog` from the registry Pages serves, built and served locally.
    # next: a Next.js App Router app renders every component from a Server Component page and
    # runs `next build`.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [shadcn, ouro, namespace, next]
        preset: [nova]
        include:
          # Another shadcn preset than the README's, so its preset wording is verified.
          - variant: shadcn
            preset: vega
    name: install (${{ matrix.variant }}, ${{ matrix.preset }})
    env:
      OURO_PRESET: ${{ matrix.preset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: scripts/install-test.sh ${{ matrix.variant }} "$RUNNER_TEMP/app" ${{ github.event.pull_request.head.sha || github.sha }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-${{ matrix.variant }}-${{ matrix.preset }}
          path: |
            ${{ runner.temp }}/app/src/index.css
            ${{ runner.temp }}/app/components.json
            ${{ runner.temp }}/app/package.json
            ${{ runner.temp }}/app/playwright-report/
          if-no-files-found: ignore
  install-latest:
    # On a release branch only (release.yml dispatches CI there and tags only when it passes):
    # the shadcn variant with the newest shadcn CLI instead of the pinned one, so a release
    # installs with what `npx shadcn@latest` runs today. Here rather than in release.yml, so the
    # unpinned CLI never runs in a job that holds a token able to push the tag.
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    name: install (shadcn@latest, nova)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: SHADCN_VERSION=latest scripts/install-test.sh shadcn "$RUNNER_TEMP/latest" ${{ github.sha }}
  install-upgrade:
    # An app on v0.1.0 (dialog from GitHub at #v0.1.0, with tests of its own) runs the
    # commands in UPGRADING.md against this commit's registry, in a src/ and an app/
    # layout, keeping Ouro's tests and without them (scripts/install-test.sh upgrade).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: scripts/install-test.sh upgrade "$RUNNER_TEMP/app"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-upgrade
          path: |
            ${{ runner.temp }}/app/src/index.css
            ${{ runner.temp }}/app/package.json
            ${{ runner.temp }}/app-without-tests/src/index.css
            ${{ runner.temp }}/app-without-tests/package.json
          if-no-files-found: ignore
  install-github:
    # The install a user runs today: `shadcn add ourostack/ouro-ui/<item>` with no ref, so
    # every item and its Ouro dependencies come from main. Runs on main pushes and manual
    # dispatches, including Release's CI after its prepare-main merge; type check and build.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: scripts/install-test.sh github "$RUNNER_TEMP/app"
