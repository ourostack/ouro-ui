name: CI
# PROBE (branch probe/catalog-ch1, never merged): catalog.spec.ts:180 in a cold WebKit, by server.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
      env:
        OURO_SYSTEM_PACKAGES: image
    strategy:
      fail-fast: false
      matrix:
        server: [preview, pages, pages-cached]
    name: catalog cold (${{ matrix.server }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - run: pnpm i --frozen-lockfile
      - run: pnpm site:build
      - name: Cold WebKit, 15 times
        env:
          SERVER: ${{ matrix.server }}
        run: |
          case "$SERVER" in
            preview) pnpm site:preview --host 127.0.0.1 --port 4179 --strictPort > server.log 2>&1 & export PROBE_BASE=http://127.0.0.1:4179/ ;;
            pages) node site/scripts/serve-pages.mjs 4179 > server.log 2>&1 & export PROBE_BASE=https://127.0.0.1:4179/ ;;
            pages-cached) PROBE_CACHED=1 node site/scripts/serve-pages.mjs 4179 > server.log 2>&1 & export PROBE_BASE=https://127.0.0.1:4179/ ;;
          esac
          sleep 8; cat server.log
          for i in $(seq 1 15); do
            pnpm exec playwright test --config zz-probe.config.ts -g "each page loads only its own JavaScript closure" --reporter=list > "out-$i.txt" 2>&1 || true
            grep -oE 'PROBE CATALOG ch1 [A-Z]+ -?[0-9]+ ms' "out-$i.txt" | head -1
          done
          echo "--- summary"; cat out-*.txt | grep -oE 'PROBE CATALOG ch1 [A-Z]+' | sort | uniq -c
          cat out-*.txt | grep -oE 'PROBE CATALOG ch1 [A-Z]+ -?[0-9]+ ms' | awk '{print $5}' | sort -n | tr '\n' ' '; echo
          echo "--- slowest"; cat out-*.txt | grep -E 'PROBE CATALOG ch1' | sort -t' ' -k6 -n | tail -2 | cut -c1-1500
