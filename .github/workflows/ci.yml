    # the ci check.
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe # v1.65.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
      env:
        OURO_SYSTEM_PACKAGES: image
    strategy:
      fail-fast: false
      matrix:
        group: [pages-a, pages-b, rules-command, watch-small, check-rules, check-shards, check]
    name: check (node ${{ matrix.group }})
    env:
      GROUP: ${{ matrix.group }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        continue-on-error: true
        env:
          GIT_TRACE_CURL: /tmp/ouro-checkout-trace.log
