        run: |
          specs=$(node scripts/shard.mjs sweeps "$SHARD")
          [ -n "$specs" ] || { echo "::error::Shard $SHARD has no sweep spec to run."; exit 1; }
          # Word splitting is wanted: the paths have no spaces.
          # shellcheck disable=SC2086
          pnpm test:e2e $specs
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
