name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  carousel-probe:
    runs-on: ubuntu-latest
    env:
      CAROUSEL_CDP_DELAY_MS: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Ten genuine flicks while two CPU workers compete with the browser
        run: |
          uptime
          average=$(awk '{print $1}' /proc/loadavg)
          awk -v average="$average" 'BEGIN { exit !(average <= 20) }'
          yes > /dev/null & first=$!
          yes > /dev/null & second=$!
          trap 'kill "$first" "$second"; wait "$first" "$second" || true' EXIT
          pnpm exec vitest run --project ouro-touch registry/ouro/components/ouro/carousel/carousel.touch.test.tsx > carousel-probe.log 2>&1
      - if: always()
        run: cat carousel-probe.log
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carousel-probe-cpu
          path: carousel-probe.log
