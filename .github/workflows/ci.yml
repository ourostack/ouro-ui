      - name: Every shard passed
        run: |
          if [ "$COUNT" = 0 ] && [ "$RESULT" = skipped ]; then
            echo "No changed path is runtime source, so no mutation shard ran."
            exit 0
          fi
          echo "The mutation shards: $RESULT."
          [ "$RESULT" = success ]
  visual:
