name: Private installed SwipeActions pre-open observation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression-red:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OURO_PRESET: nova
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Public-shaped native mouse regression before unique synthetic ID correction
        run: pnpm exec vitest run --project ouro-chromium --project ouro-webkit --coverage.enabled false registry/ouro/components/ouro/swipe-actions/swipe-actions.test.tsx -t 'follows one finger'
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: swipe-native-regression-${{ github.run_id }}
          include-hidden-files: true
          path: |
            .vitest/attachments/
          if-no-files-found: error
