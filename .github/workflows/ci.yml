        continue-on-error: true
        env:
          GIT_TRACE_CURL: /tmp/ouro-checkout-trace.log
          GIT_TRACE_CURL_NO_DATA: "1"
          GIT_TRACE_PACKET: /tmp/ouro-checkout-packets.log
        with:
          persist-credentials: false
          # A pull request's merge commit and its first parent, the base it merges into.
