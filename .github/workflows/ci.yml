# THROWAWAY PROBE (ourostack/ouro-ui#137 review, item 6). Never merge: it replaces CI with stand-ins.
# It reports each required check's name from a dispatched run only, to learn whether checks of a
# workflow_dispatch run satisfy the main ruleset on a pull request and in the merge queue.
name: CI
on:
  pull_request:
  workflow_dispatch:
    inputs:
      fail:
        description: The one check to fail on purpose
        required: false
        default: ""
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: ["ci", "e2e", "visual", "registry", "install (shadcn, nova)", "install (shadcn, vega)", "install (ouro, nova)", "install (namespace, nova)", "install (next, nova)", "install-upgrade", "motion-coverage", "themes (1/3)", "themes (2/3)", "themes (3/3)", "theme-install", "latency", "lighthouse"]
    name: ${{ matrix.check }}
    steps:
      - env:
          CHECK: ${{ matrix.check }}
          FAIL: ${{ inputs.fail }}
        run: |
          echo "probe: $CHECK on $GITHUB_REF ($GITHUB_SHA)"
          [ "$CHECK" != "$FAIL" ]
