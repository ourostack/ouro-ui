name: Private Carousel vega native flick observation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe-vega:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OURO_PRESET: vega
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - name: Exact vega installer with fixed native flick observations
        run: scripts/install-test.sh shadcn "$RUNNER_TEMP/app" "$GITHUB_SHA"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: carousel-vega-input-${{ github.run_id }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/app/.carousel-observations/
            ${{ runner.temp }}/app/.vitest/attachments/
            ${{ runner.temp }}/app/package.json
            ${{ runner.temp }}/app/package-lock.json
            ${{ runner.temp }}/app/src/index.css
          if-no-files-found: error
