  install-github:
    # The install a user runs today: `shadcn add ourostack/ouro-ui/<item>#<tag>` for every
    # component in the newest release, each item and its Ouro dependencies from GitHub at that tag
    # (main commits no registry.json, so an address without a tag cannot install). Runs on main
    # pushes and manual dispatches, including Release's CI after its prepare-main merge, which
    # names the new tag; type check and build.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Its github variant fetches a release tag from origin and archives it, which a tarball lacks, so it has no last resort: its last try may fail as before (#1765).
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        continue-on-error: true
        env:
          GIT_TRACE_CURL: /tmp/ouro-checkout-trace.log
          GIT_TRACE_CURL_NO_DATA: "1"
          GIT_TRACE_PACKET: /tmp/ouro-checkout-packets.log
        with:
          persist-credentials: false
      - *checkout-stalled
      - id: checkout-again
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        continue-on-error: true
        env:
          GIT_TRACE_CURL: /tmp/ouro-checkout-trace.log
          GIT_TRACE_CURL_NO_DATA: "1"
          GIT_TRACE_PACKET: /tmp/ouro-checkout-packets.log
        with:
          persist-credentials: false
      - *checkout-stalled-again
      - if: steps.checkout-again.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        env:
          GIT_TRACE_CURL: /tmp/ouro-checkout-trace.log
          GIT_TRACE_CURL_NO_DATA: "1"
          GIT_TRACE_PACKET: /tmp/ouro-checkout-packets.log
        with:
          persist-credentials: false
      - id: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        continue-on-error: true
      - *pnpm-stalled
      - *pnpm-retry
      - id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        continue-on-error: true
        with:
          node-version: 24
          cache: pnpm
      - *node-stalled
      - *node-retry
      # No install at the root: the harness installs the release tag's own dependencies from its lockfile, and reads
      # the tag's registry.json, not this commit's generated one.
      - run: scripts/install-test.sh github "$RUNNER_TEMP/app"
  fresh-main:
    # Starts with the run, in parallel with everything else, on a pull request only (on a push it would merge main into main): with no merge queue, two pull requests that
    # each pass can break main together. This merges main as it is now into the pull request's head
    # and runs the checks that combine across changes (generated files, the registry, the site's
    # build and its CSS size ceilings), then reads main again, and tests a newer main when it
    # moved, so a result for a main that is no longer main never passes (scripts/fresh-main.mjs).
    # ci-budget, the required check after it, fails when this fails.
    needs: [plan]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # the base CSS size reports, size-gate.mjs base, so size-budget.mjs judges this pull request's own CSS growth
    steps:
      # Its checkout needs every commit of the pull request's head, which a tarball lacks, so it has no last resort: its last try may fail as before (#1765).
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        continue-on-error: true
        env:
          GIT_TRACE_CURL: /tmp/ouro-checkout-trace.log
          GIT_TRACE_CURL_NO_DATA: "1"
          GIT_TRACE_PACKET: /tmp/ouro-checkout-packets.log
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
      - *checkout-stalled
      - id: checkout-again
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        continue-on-error: true
        env:
          GIT_TRACE_CURL: /tmp/ouro-checkout-trace.log
          GIT_TRACE_CURL_NO_DATA: "1"
          GIT_TRACE_PACKET: /tmp/ouro-checkout-packets.log
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
      - *checkout-stalled-again
      - if: steps.checkout-again.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        env:
          GIT_TRACE_CURL: /tmp/ouro-checkout-trace.log
          GIT_TRACE_CURL_NO_DATA: "1"
          GIT_TRACE_PACKET: /tmp/ouro-checkout-packets.log
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
      - id: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        continue-on-error: true
      - *pnpm-stalled
      - *pnpm-retry
      - id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        continue-on-error: true
        with:
          node-version: 24
          cache: pnpm
      - *node-stalled
      - *node-retry
      # Never fails: size-budget.mjs then judges its own CSS only against a growth budget over this report, as size-gate.mjs does everywhere else; with none, the ceiling alone decides.
      - name: The base commit's page CSS sizes
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/size-gate.mjs base page-css shell-css
      - name: Fetch main, merge it, check, and read main again
        env:
          SIZE_GATE: pull
        run: >-
          node scripts/fresh-main.mjs --branch "${{ github.base_ref }}" --
          pnpm i --frozen-lockfile --
          pnpm run docs --check --
          pnpm registry --check --
          pnpm site:build --
          node scripts/size-budget.mjs site/dist
  ci-budget:
    # Records this run's critical path, the longest chain of jobs that wait on one another, each
    # counted from its start to its end so a queue for a free runner does not count, and its wall
    # time, in the step summary and the ci-timings artifact (scripts/ci-budget.mjs). On a pull
    # request (not a full-suite fallback run, `ci`'s fallback output) a critical path over budget
    # (the CI target, plus a margin for runner noise) is judged on its work time, setup steps left
    # out: more than 3 minutes over main's (the median main's latest passing merge queue runs
    # recorded in their ci-timings), or past a ceiling (15 minutes, or 1.5 times main's), fails when
    # the run's earlier attempt or the pull request's previous full run was past it too, warns when
    # that was not, and with neither fails asking for all jobs to be run again; otherwise it warns
    # (scripts/ci-budget.mjs, judge). A job that no ci.yml job name matches fails a pull request. It
    # also records the wall time a developer waits, queues included, with its median over the latest
    # runs, and the runner time the run took from the shared pool. A required check (ruleset
    # 24881709) that fails only a pull request: on a merge group or a push it only warns, so it
    # never bounces a queue entry.
    needs: [plan, ci, fresh-main, motion-coverage, themes, conformance, mutation, visual, registry, e2e, theme-install, latency, lighthouse, install-gate, install, install-latest, install-upgrade, install-current, install-github]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: This pull request merged with the newest main
        if: ${{ needs.fresh-main.result == 'failure' }}
        run: |
          echo "::error::fresh-main failed: this pull request together with main as it is now fails a combined check."
          exit 1
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        continue-on-error: true
        env:
          GIT_TRACE_CURL: /tmp/ouro-checkout-trace.log
          GIT_TRACE_CURL_NO_DATA: "1"
          GIT_TRACE_PACKET: /tmp/ouro-checkout-packets.log
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/ci.yml
            scripts/ci-budget.mjs
            scripts/run-jobs.mjs
            scripts/waivers.mjs
            site/e2e/waivers.ts
          sparse-checkout-cone-mode: false
      - *checkout-stalled
      - id: checkout-again
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        continue-on-error: true
        env:
          GIT_TRACE_CURL: /tmp/ouro-checkout-trace.log
          GIT_TRACE_CURL_NO_DATA: "1"
          GIT_TRACE_PACKET: /tmp/ouro-checkout-packets.log
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/ci.yml
            scripts/ci-budget.mjs
            scripts/run-jobs.mjs
            scripts/waivers.mjs
            site/e2e/waivers.ts
          sparse-checkout-cone-mode: false
      - *checkout-stalled-again
      - id: checkout-last
        if: steps.checkout-again.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        env:
          GIT_TRACE_CURL: /tmp/ouro-checkout-trace.log
          GIT_TRACE_CURL_NO_DATA: "1"
          GIT_TRACE_PACKET: /tmp/ouro-checkout-packets.log
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/ci.yml
            scripts/ci-budget.mjs
            scripts/run-jobs.mjs
            scripts/waivers.mjs
            site/e2e/waivers.ts
          sparse-checkout-cone-mode: false
      - *checkout-tarball
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - if: ${{ needs.e2e.result == 'success' && needs.plan.outputs.tested != 'true' && needs.plan.outputs.heavy != 'skip' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: timings-sweeps-*
          path: .tmp/sweep-waivers
      - name: No sweep waiver is stale
        if: ${{ needs.e2e.result == 'success' && needs.plan.outputs.tested != 'true' && needs.plan.outputs.heavy != 'skip' }}
        run: node scripts/waivers.mjs .tmp/sweep-waivers
      - name: Critical path
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT: ${{ github.event_name }}
          FULL: ${{ needs.plan.outputs.full != 'false' }}
          FALLBACK: ${{ needs.ci.outputs.fallback == 'true' }}
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/ci-budget.mjs --out "$RUNNER_TEMP/ci-timings.json"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-timings
          path: ${{ runner.temp }}/ci-timings.json
          if-no-files-found: ignore
          retention-days: 90
  tree-proof:
    # The proof a push to main reads (scripts/ci-proof.mjs): a pull request's run whose plan left nothing out (every
    # browser test, the design shards, the install test and the heavy tier) and whose every job passed reports this
    # job, named for the tree it tested, GitHub's merge of the pull request into main. When the pull request merges
    # with main unmoved, main's commit has that tree, and main's run tests nothing again. It waits on what ci-budget
    # waits on, beside it, so it has finished by the time the required checks let the pull request merge; it is no
    # required check, and a reduced run skips it. install-github and install-latest run only on main and on
    # release branches, and fresh-main checks a newer main, not this tree: ci-budget fails the run when that fails.
    # Each need is named: a job's if: counts every job above it in needs.*.result, so one skipped fallback shard
    # upstream made !contains(needs.*.result, 'skipped') false on every run.
    name: Full suite passed on tree ${{ needs.plan.outputs.tree }}
    needs: [plan, ci, motion-coverage, themes, conformance, mutation, visual, registry, e2e, theme-install, latency, lighthouse, install-gate, install, install-upgrade, install-current]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.plan.result == 'success' && needs.ci.result == 'success' && needs.motion-coverage.result == 'success' && needs.themes.result == 'success' && needs.conformance.result == 'success' && needs.mutation.result == 'success' && needs.visual.result == 'success' && needs.registry.result == 'success' && needs.e2e.result == 'success' && needs.theme-install.result == 'success' && needs.latency.result == 'success' && needs.lighthouse.result == 'success' && needs.install-gate.result == 'success' && needs.install.result == 'success' && needs.install-upgrade.result == 'success' && needs.install-current.result == 'success' && needs.plan.outputs.tree != '' && needs.plan.outputs.full != 'false' && needs.plan.outputs.browser != 'false' && needs.plan.outputs.design != 'false' && needs.plan.outputs.installs == 'here' && needs.plan.outputs.heavy == 'here' && needs.ci.outputs.fallback != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - env:
          TREE: ${{ needs.plan.outputs.tree }}
        run: echo "::notice title=Tree proof::The full suite passed on tree $TREE. A push to main with this tree runs only install-github."
