name: Comparison pages proof
on:
  push:
    branches: [probe/final-state-contracts]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  comparison-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 44790726968f1d18646d1dcccb91a85dea43a87c
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Original catalog and comparison contracts plus linked-summary regression
        run: |
          set -o pipefail
          git rev-parse HEAD | tee comparison-source.log
          pnpm exec vitest run --project site site/src/site.test.tsx \
            -t 'why-no-skill|/docs/ |keeps linked guide summaries' \
            --reporter=default --reporter=json --outputFile.json=comparison-pages.json | tee comparison-pages.log
      - name: Actual segment translate transition survives a completed click
        run: |
          set -o pipefail
          pnpm exec vitest run --project ouro-chromium --project ouro-webkit \
            registry/ouro/components/ouro/segmented-control/segmented-control.test.tsx \
            -t 'slides the thumb under the pressed segment with a transition' \
            --reporter=default --reporter=json --outputFile.json=segment-transition.json | tee segment-transition.log
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: comparison-pages-proof
          path: |
            comparison-source.log
            comparison-pages.log
            comparison-pages.json
            segment-transition.log
            segment-transition.json
          if-no-files-found: error
