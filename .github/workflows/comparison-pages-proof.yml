name: Comparison pages proof
on:
  push:
    branches: [probe/final-state-contracts]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  comparison-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c5a2c12642f5462016789c7abeaff4c08e55eeb9
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Original six-route phone and desktop accessibility and overflow contracts
        run: |
          set -o pipefail
          git rev-parse HEAD | tee comparison-source.log
          pnpm exec vitest run --project site site/src/site.test.tsx \
            -t 'why-no-skill.*(zero axe violations|does not overflow horizontally)' \
            --reporter=default --reporter=json --outputFile.json=comparison-pages.json | tee comparison-pages.log
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: comparison-pages-proof
          path: |
            comparison-source.log
            comparison-pages.log
            comparison-pages.json
          if-no-files-found: error
