name: Screens
# Ouro check (registry/ouro/check/, through .github/actions/check) on the site as it builds: every
# page at every screen size from 320 to 3840 wide and four short landscape screens, light and dark,
# for overlap, sideways scroll, clipped text, long lines, blurry pictures and serious axe-core
# violations, and measures layout shift, first content and each press against their budgets; the
# measured rules are waived in .github/ouro-check.json while they settle. Eight shards side by side, then one report: the merge job's summary, and its artifact
# with a contact sheet per page and a captioned close-up per finding. Not a required check, and it
# reports without failing: the findings are for whoever changes the page next. A pull request
# that changes nothing the site build or the check reads skips both (the changes job).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: screens-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    # Whether this run checks the screens: a pull request into main whose every changed file is one
    # the site build and Ouro check never read (a test, a story, a spec, a change fragment, another
    # workflow) passes here, and its shards and report never start (scripts/ci-relevance.mjs
    # screens). Anything else, a diff that cannot be read, and every other event check the screens.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.relevance.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
      - id: relevance
        name: Can the change reach the screens?
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ] && [ "$BASE_REF" = main ] && [[ "$HEAD_REF" != release/* ]]; then
            node scripts/ci-relevance.mjs screens HEAD^1 HEAD || echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Screens run: $EVENT."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
  screens-shard:
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    name: screens (${{ matrix.shard }}/8)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - run: pnpm i --frozen-lockfile
      - run: pnpm site:build
      - uses: ./.github/actions/check
        continue-on-error: true
        with:
          targets: site/dist
          shard: ${{ matrix.shard }}/8
          script: registry/ouro/check/check.ts
          config: .github/ouro-check.json
          install-browser: "false"
  screens:
    needs: [changes, screens-shard]
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - run: pnpm i --frozen-lockfile
      - uses: ./.github/actions/check
        continue-on-error: true
        with:
          merge: "true"
          script: registry/ouro/check/check.ts
          config: .github/ouro-check.json
          install-browser: "false"
