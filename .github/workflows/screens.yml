name: Screens
# Ouro check (registry/ouro/check/, through .github/actions/check) on the site as it builds: every
# page at every screen size from 320 to 3840 wide and four short landscape screens, light and dark,
# for overlap, sideways scroll, clipped text, long lines, narrow text, blurry pictures and serious axe-core
# violations, and measures layout shift, first content and each press against their budgets; the
# measured rules are waived in .github/ouro-check.json while they settle. Eight shards side by side, then one report: the merge job's summary, and its artifact
# with a contact sheet per page and a captioned close-up per finding. Not a required check, and it
# reports without failing: the findings are for whoever changes the page next. So it runs on main
# once a day and on demand, never on a pull request: a pull request's gate is CI's design shards,
# the same check at a phone's, a laptop's and a 4K screen's size, light and dark, which fail on a
# finding, so a report on each pull request cost runners and decided nothing.
on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screens-shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe # v1.65.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    name: screens (${{ matrix.shard }}/8)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - run: pnpm i --frozen-lockfile
      - run: pnpm site:build
      - uses: ./.github/actions/check
        continue-on-error: true
        with:
          targets: site/dist
          shard: ${{ matrix.shard }}/8
          script: registry/ouro/check/check.ts
          config: .github/ouro-check.json
          install-browser: "false"
  screens:
    needs: [screens-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe # v1.65.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - run: pnpm i --frozen-lockfile
      - uses: ./.github/actions/check
        continue-on-error: true
        with:
          merge: "true"
          script: registry/ouro/check/check.ts
          config: .github/ouro-check.json
          install-browser: "false"
