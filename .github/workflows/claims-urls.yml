name: Claim addresses
# Every address a claim cites with urlOk, fetched again (docs/guides/claims.md): fails when one
# answers differently from scripts/claims-urls.json, when the cache holds an address no claim
# cites, and when a committed answer is older than claims.config.json's urlMaxAgeDays. Pull
# requests fetch only the addresses they add or change (the ci job), so the rest are read here.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  addresses:
    name: claim addresses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm claims:check --network
