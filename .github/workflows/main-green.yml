name: Main green
# Posts the `main green` commit status on the open pull requests into main (scripts/main-green.mjs): failing
# while main's newest completed CI push run failed, so no pull request merges onto a red main. It runs after
# each CI run on main, when a pull request into main opens or changes, and by hand. A pull request that is the
# fix stays green while main is red: label it red-main-fix, the docs pin's pull request and an automatic revert
# are exempt too. The `main` ruleset does not require the status yet; a follow-up adds it once every pull request
# has it.
#
# After each CI push run on main, a second job logs a candidate verdict (scripts/main-red-signatures.mjs) on
# ourostack/ouro-ui#3797: while main is red, whether every failing job is named by an open, unexpired signature
# in .github/main-red-signatures.json, as the proposed gate would decide. Report-only (contributing/ci.md):
# it changes nothing that merges, and a failure here never fails the run.
#
# A third job logs a candidate cascade re-trigger plan (scripts/cascade-retrigger.mjs) on ourostack/ouro-ui#3802:
# on each red-to-green transition of main, which cancelled auto-merge pull request CI runs ci-fail-fast cancelled
# only because fresh-main failed (never one cancelled for a real job failure) it would re-trigger, staggered to
# at most 3 live. Report-only too: it names a plan but re-triggers nothing yet.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  actions: read
  statuses: write
  issues: write # candidate-verdict and candidate-retrigger-plan comments (report-signatures, report-cascade-retrigger jobs only)
concurrency:
  group: main-green-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  status:
    name: Post the main green status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read
      actions: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - name: Post the status on the open pull requests into main, or on the one that changed
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            node scripts/main-green.mjs --pr "$PR_NUMBER"
          else
            node scripts/main-green.mjs
          fi
  report-signatures:
    name: Log the candidate main-red-signatures verdict
    if: ${{ github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - name: Logged the candidate verdict on #3797
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/main-red-signatures.mjs report
  report-cascade-retrigger:
    name: Log the candidate cascade re-trigger plan
    if: ${{ github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - name: Logged the candidate re-trigger plan on #3802
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/cascade-retrigger.mjs report
