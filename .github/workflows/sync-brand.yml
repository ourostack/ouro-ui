name: Sync brand art
# Keeps site/public/brand/storybook/ (site/scripts/sync-storybook.mjs) and site/src/family.json
# (site/scripts/sync-family.mjs) the same bytes as ourostack/.github's brand/ art and brand/family.json. Every 10
# minutes it copies what this site serves; when a brand merge changed any of it, it keeps one pull request open on
# one branch and turns auto-merge on, so it merges once the checks main's ruleset requires pass, and Pages then
# deploys main. The brand audit in ourostack/.github shows site:ui.ouroboros.bot as pending, not stale, for 90 minutes
# after a brand merge, so its main stays green while this runs.
# The branch is pushed, and the pull request opened, as the Ouro Current GitHub App (a token from OURO_CURRENT_APP_ID and
# OURO_CURRENT_PRIVATE_KEY), so a push starts CI at once and the merge starts Pages, as in docs-pin.yml.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: sync-brand
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GH_REPO: ${{ github.repository }}
      BRANCH: brand/sync-storybook
    steps:
      - id: app
        name: Sign in as the Ouro Current app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.OURO_CURRENT_APP_ID }}
          private-key: ${{ secrets.OURO_CURRENT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Copy the art from ourostack/.github main
        env:
          GH_TOKEN: ${{ github.token }}
        run: node site/scripts/sync-storybook.mjs main
      - name: Copy the family links from ourostack/.github main
        env:
          GH_TOKEN: ${{ github.token }}
        run: node site/scripts/sync-family.mjs main
      # Three sets of pictures are cut from the synced scenes, each with a test that fails until they are cut again:
      # plan-ship (site/public/plan-ship/), the nemo egg's ships (site/public/eggs/) and the crew's faces
      # (site/public/crew/). A sync that changes any scene recuts what went stale here and commits it with the art. It
      # installs only sharp, at the version package.json pins, which is all these scripts import. The link-preview cards
      # (og-cards.mts) need the site's Playwright Chromium, so they are not redrawn here.
      - name: Recut the pictures cut from the scenes, when the scenes changed
        run: |
          if [ -n "$(git status --porcelain -- site/public/brand/storybook/scenes)" ]; then
            version=$(node -p 'const p = require("./package.json"); (p.dependencies || {}).sharp || (p.devDependencies || {}).sharp')
            npm install --silent --no-save --no-package-lock --prefix "$RUNNER_TEMP/sharp" "sharp@$version"
            mkdir -p node_modules
            for d in "$RUNNER_TEMP"/sharp/node_modules/*; do [ -e "node_modules/$(basename "$d")" ] || ln -s "$d" node_modules/; done
            sources=$(sed -n '/^export const SOURCES = {/,/^}/p' site/scripts/plan-ship.mts | grep -oE '"site/[^"]+"' | tr -d '"')
            if [ -n "$(git status --porcelain -- $sources)" ]; then node site/scripts/plan-ship.mts; fi
            for script in nemo-ship crew-portraits; do
              node "site/scripts/$script.mts" || node "site/scripts/$script.mts" --write
            done
          fi
      - id: changes
        name: See whether it changed
        run: |
          if [ -z "$(git status --porcelain -- site/public/brand/storybook site/public/plan-ship site/public/eggs site/public/crew site/src/family.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.changed == 'true'
        name: Open or update the pull request, and turn auto-merge on
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          brand=$(gh api repos/ourostack/.github/commits/main --jq '.sha[0:7]')
          title="Sync the brand files with ourostack/.github@$brand"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -q -c "$BRANCH"
          git add site/public/brand/storybook site/public/plan-ship site/public/eggs site/public/crew site/src/family.json
          git commit -q -m "$title"
          git push -q --force origin "$BRANCH"
          body="A brand merge changed art or family links this site serves. Sync brand art copied them byte for byte with site/scripts/sync-storybook.mjs and site/scripts/sync-family.mjs; this pull request merges once the required checks pass."
          number=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body "$body"
            number=$(gh pr view "$BRANCH" --json number --jq .number)
          fi
          # Merge with an explicit message: GitHub's default appends bot Co-authored-by lines, which the ruleset rejects.
          subject=$(gh pr view "$number" --json title,number --jq '"\(.title) (#\(.number))"')
          message=$(gh pr view "$number" --json body --jq .body | tr -d '\r' | grep -v -i -E '^[[:space:]]*[A-Za-z-]+-by[[:space:]]*:.*(\[bot\]|(^|[^A-Za-z0-9])(copilot|claude|anthropic|openai|chatgpt|gpt|codex|gemini|cursor|devin|aider)([^A-Za-z]|$))' || true)
          if ! gh pr merge "$number" --auto --squash --subject "$subject" --body "$message"; then
            [ "$(gh pr view "$number" --json state --jq .state)" = MERGED ] || { echo "::error::Could not turn auto-merge on for #$number."; exit 1; }
          fi
          echo "Auto-merge is on for #$number." >> "$GITHUB_STEP_SUMMARY"
