name: Production site native hydration ownership diagnostic
on:
  push:
    branches: [probe/site-hydration-20261016]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Actual production site; native pre-commit versus committed hydration input
        run: pnpm exec playwright test --config .github/site-hydration-proof.config.ts
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-site-hydration-receipts
          path: |
            site-hydration-tests.json
            test-results/
          if-no-files-found: error
