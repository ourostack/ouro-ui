name: Form answer proof
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: form-answer-proof-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  form-answer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      # A pull request runs the proof only when its change can reach it: CI's plan selects form, link
      # or radio-group, or runs everything for a path the proof loads (scripts/form-answer-impact.mjs).
      # Otherwise the job passes here, before the fixture, the browsers and the tests.
      - id: impact
        name: Does the change reach the proof?
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            node scripts/form-answer-impact.mjs HEAD^1 HEAD || echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "The proof runs: $EVENT."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Probe the selection on open pull requests (temporary)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_OUTPUT: /dev/null
        run: |
          for n in 280 279 277 276 275 274 273 272 271 267 266 265 264 263 262 261 260 259 258 257 256 255 254 253; do
            git fetch -q --no-tags --depth=2 origin "refs/pull/$n/merge:refs/probe/$n" 2>/dev/null || { echo "#$n: no merge ref"; continue; }
            echo "::group::#$n"
            node scripts/form-answer-impact.mjs "refs/probe/$n^1" "refs/probe/$n" | tail -4
            echo "::endgroup::"
            echo "#$n: $(node scripts/form-answer-impact.mjs "refs/probe/$n^1" "refs/probe/$n" | head -1)" >> "$RUNNER_TEMP/probe.txt"
          done
          cat "$RUNNER_TEMP/probe.txt" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Restore repo-only fixture into owned CI scratch
        if: steps.impact.outputs.run == 'true'
        run: |
          mkdir -p .tmp/adopt-a-form-value
          cp test/form-answer-fixture/package.json test/form-answer-fixture/package-lock.json .tmp/adopt-a-form-value/
          npm ci --prefix .tmp/adopt-a-form-value --ignore-scripts --legacy-peer-deps --no-audit --no-fund --registry=https://registry.npmjs.org
          ln -s ../.tmp/adopt-a-form-value/node_modules/jsdom node_modules/jsdom
          echo "Owned fixture: $GITHUB_WORKSPACE/.tmp/adopt-a-form-value; jsdom link: $GITHUB_WORKSPACE/node_modules/jsdom" >> "$GITHUB_STEP_SUMMARY"
      - name: Actual Router, privacy, mask and hydration regressions
        if: steps.impact.outputs.run == 'true'
        run: pnpm exec vitest run --config test/form-answer.config.ts --coverage | tee .tmp/adopt-a-form-value/node-proof.log
      - if: steps.impact.outputs.run == 'true'
        uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium webkit
      - name: Shipped Form, constructor and Link regressions with focused coverage
        if: steps.impact.outputs.run == 'true'
        run: |
          pnpm exec vitest run --project ouro-chromium --project ouro-webkit --project ouro-touch \
            registry/ouro/components/ouro/form registry/ouro/components/ouro/link registry/ouro/components/ouro/radio-group registry/ouro/lib/ouro/form-answer.test.ts \
            --coverage --coverage.include=registry/ouro/components/ouro/form/form.tsx \
            --coverage.include=registry/ouro/lib/ouro/form-answer.ts \
            --coverage.reporter=text --coverage.reporter=json \
            --coverage.reportsDirectory=.tmp/adopt-a-form-value/browser-coverage | tee .tmp/adopt-a-form-value/browser-proof.log
      - if: always() && steps.impact.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: form-answer-proof
          path: |
            .tmp/adopt-a-form-value/*.log
            .tmp/adopt-a-form-value/node-coverage/coverage-final.json
            .tmp/adopt-a-form-value/browser-coverage/coverage-final.json
          if-no-files-found: error
