name: Route profile
# Probe: where the slowest routes of the sameness sweep spend their time in WebKit (site/probes/route-profile.spec.ts),
# with a Playwright trace of each. By hand only; it gates nothing and CI's e2e shards never run it.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: route-profile
  cancel-in-progress: false
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # In Playwright's image, as ci.yml's e2e shards are (see the note above jobs: there).
    container:
      image: mcr.microsoft.com/playwright@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe # v1.65.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
      env:
        OURO_SYSTEM_PACKAGES: image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - run: pnpm i --frozen-lockfile
      - name: Profile
        env:
          CI: "true"
        run: pnpm exec playwright test --config playwright.route-profile.config.ts 2>&1 | tee profile.log
      - if: always()
        run: grep -o "PROFILE webkit.*" profile.log >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: route-profile-traces
          path: test-results/
          if-no-files-found: ignore
