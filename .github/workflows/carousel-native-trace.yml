name: Carousel Native Trace
on:
  push:
    branches: [probe/carousel-main-trace]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: carousel-native-trace-${{ github.ref }}
  cancel-in-progress: false
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mode: full, iteration: cold, profile: none }
          - { mode: touch-file, iteration: prestart, profile: prestart }
          - { mode: touch-file, iteration: midmove, profile: midmove }
          - { mode: touch-file, iteration: preend, profile: preend }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Record source and this preplanned independent observation
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
          ITERATION: ${{ matrix.iteration }}
          CAROUSEL_STALL_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          mkdir -p carousel-evidence
          git rev-parse HEAD > carousel-evidence/source.txt
          git diff HEAD^ -- registry/ouro/components/ouro/carousel/carousel.tsx registry/ouro/components/ouro/carousel/carousel-styles.ts > carousel-evidence/runtime.diff
          sha256sum registry/ouro/components/ouro/carousel/carousel.tsx registry/ouro/components/ouro/carousel/carousel-styles.ts registry/ouro/lib/ouro/testing/commands.ts registry/ouro/components/ouro/carousel/carousel.touch.test.tsx scripts/carousel-native-trace.config.mts .github/workflows/carousel-native-trace.yml > carousel-evidence/digests.txt
          export CAROUSEL_PROBE_SOURCE=$(git rev-parse HEAD)
          export CAROUSEL_TRACE_ITERATION="$MODE-$ITERATION"
          export CAROUSEL_TRACE_FILE="$PWD/carousel-evidence/$MODE-$ITERATION-browser.jsonl"
          export CAROUSEL_PACKET_FILE="$PWD/carousel-evidence/$MODE-$ITERATION-packets.jsonl"
          export CAROUSEL_RESULT_FILE="$PWD/carousel-evidence/$MODE-$ITERATION-results.json"
          case "$MODE" in
            full)
              pnpm run docs --check
              pnpm typecheck
              pnpm lint
              if pnpm test --config scripts/carousel-native-trace.config.mts > "carousel-evidence/$MODE-$ITERATION.log" 2>&1; then code=0; else code=$?; fi
              ;;
            touch-file)
              if pnpm exec vitest run --config scripts/carousel-native-trace.config.mts --project=ouro-touch registry/ouro/components/ouro/carousel/carousel.touch.test.tsx > "carousel-evidence/$MODE-$ITERATION.log" 2>&1; then code=0; else code=$?; fi
              ;;
            *) echo "Unknown probe mode: $MODE" >&2; exit 2 ;;
          esac
          printf '%s\n' "$code" > "carousel-evidence/$MODE-$ITERATION.exit"
          if [ ! -s "$CAROUSEL_TRACE_FILE" ] || [ ! -s "$CAROUSEL_RESULT_FILE" ] || [ ! -s "carousel-evidence/$MODE-$ITERATION-engine.json" ]; then
            echo "Probe $MODE-$ITERATION did not retain its target, engine trace, and test results." >&2
            exit 2
          fi
          exit "$code"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carousel-native-${{ matrix.mode }}-${{ matrix.iteration }}
          path: |
            carousel-evidence/
            .vitest/attachments/
          if-no-files-found: error
