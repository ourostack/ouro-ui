name: Temporary SSO mutation
# A one-off mutation pass over registry/ouro/check/first-run-sso.ts for #2066, removed before it merges.
on:
  pull_request:
    paths:
      - .github/workflows/tmp-sso-mutation.yml
permissions:
  contents: read
concurrency:
  group: tmp-sso-mutation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part:
          - { name: pure, mutate: '"registry/ouro/check/first-run-sso.ts:56-103", "registry/ouro/check/first-run-sso.ts:205-245", "registry/ouro/check/first-run-sso.ts:368-377"', tests: "TLS hello|holds a request|looks a host|the judge:|throwaway authority" }
          - { name: serve, mutate: '"registry/ouro/check/first-run-sso.ts:106-202"', tests: "the stand-in" }
          - { name: setup, mutate: '"registry/ouro/check/first-run-sso.ts:262-358", "registry/ouro/check/first-run-sso.ts:386-405"', tests: "made-up Mac" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile --ignore-scripts
      - name: Stryker over ${{ matrix.part.name }}
        env:
          MUTATE: ${{ matrix.part.mutate }}
          TESTS: ${{ matrix.part.tests }}
        run: |
          cat > "$RUNNER_TEMP/stryker.json" <<JSON
          { "mutate": [$MUTATE], "testRunner": "command", "commandRunner": { "command": "node --test --test-name-pattern=\"$TESTS\" scripts/check/first-run-sso.test.mts" },
            "inPlace": true, "concurrency": 4, "reporters": ["clear-text", "progress-append-only"], "clearTextReporter": { "allowColor": false, "logTests": false },
            "tempDirName": "$RUNNER_TEMP/stryker", "coverageAnalysis": "off", "plugins": [], "timeoutMS": 120000, "disableTypeChecks": false }
          JSON
          pnpm exec stryker run "$RUNNER_TEMP/stryker.json" 2>&1 | tee "$RUNNER_TEMP/stryker.log"
          grep -A3 Survived "$RUNNER_TEMP/stryker.log" | grep -E '^(registry|\+)' >> "$GITHUB_STEP_SUMMARY" || true
