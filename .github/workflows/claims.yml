name: Claims
# A pull request's title and body are a surface too: a factual sentence in them needs a
# primary source and a check, as in the repository (scripts/claims.mjs lint --pr,
# docs/guides/claims.md). It runs again when the description is edited, without the rest of CI.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: claims-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pr-text:
    name: pull request claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      # The title and body come through the environment, never into the script's text.
      - name: Claims in the title and body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: pnpm claims:lint --pr
