name: Claims
# A pull request's title and body are a surface too: a factual sentence in them needs a
# primary source and a check, as in the repository (scripts/claims.mjs lint --pr,
# docs/guides/claims.md), and so is what it adds to claims.config.json's exemptions. It runs
# again when the description is edited, without the rest of CI.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: claims-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pr-text:
    name: pull request claims
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        continue-on-error: true
      - name: pnpm setup failed; trying it once more (#1911)
        if: steps.pnpm.outcome == 'failure'
        run: echo "::warning title=pnpm setup failed::pnpm/action-setup could not install pnpm (ourostack/ouro-ui#1911); setting it up once more."
      - if: steps.pnpm.outcome == 'failure'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - id: install
        run: pnpm i --frozen-lockfile
        continue-on-error: true
      - name: pnpm install failed; trying it once more (#1914)
        if: steps.install.outcome == 'failure'
        run: echo "::warning title=pnpm install failed::pnpm i failed, which the 1ES feed's HTTP 429s can cause (ourostack/ouro-ui#1914); installing once more."
      - if: steps.install.outcome == 'failure'
        run: pnpm i --frozen-lockfile
      # The title and body come through the environment, never into the script's text. They are read
      # as they are now, since a re-run replays the event the run started with; when GitHub doesn't
      # answer, the event's copy is read.
      - name: Claims in the title and body
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if title=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title --jq .title) && body=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq .body); then
            export PR_TITLE="$title" PR_BODY="$body"
          fi
          pnpm claims:lint --pr
      # No internal app, repository or organization named in the title or body, checked again when they're edited
      # (ci.yml's attribution job checks them and the commits as a required check; ourostack/.github's tools/internal-names).
      - name: No internal names in the title and body
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if title=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title --jq .title) && body=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq .body); then
            PR_TITLE="$title" PR_BODY="$body"
          fi
          guard="$RUNNER_TEMP/internal-names"
          mkdir -p "$guard"
          for file in check.mjs hashes.txt; do
            curl -fsSL --retry 3 --retry-all-errors -o "$guard/$file" "https://raw.githubusercontent.com/ourostack/.github/main/tools/internal-names/$file"
          done
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" | node "$guard/check.mjs" --text
      # The exemptions in claims.config.json against the base's: a new one needs its reason and a
      # mention in the description, so it runs again when the description is edited. So does a
      # file that gains a `// real clock:` escape (scripts/real-clock-ratchet.mjs).
      - name: Exemptions against the base
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if live=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq .body); then
            export PR_BODY="$live"
          fi
          # Against the merge's first parent, main as GitHub merged the pull request into it (as in ci.yml's Claims step).
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          CLAIMS_BASE_REF="HEAD^1" node scripts/claims.mjs ratchet
          REAL_CLOCK_BASE_REF="HEAD^1" node scripts/real-clock-ratchet.mjs
          HEADROOM_BASE_REF="HEAD^1" node scripts/headroom-ratchet.mjs
