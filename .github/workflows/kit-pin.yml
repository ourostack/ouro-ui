name: Kit pin
# Points main's Platforms pages and Apple pages at each sibling kit's newest release (ouro-ui-apple, ouro-ui-windows and
# ouro-ui-android), so a release there lands on its own and no pull request has to bump the pins by hand. One job per kit,
# each on its own branch, docs/point-at-<kit>, with its own pull request and auto-merge, so one kit's broken release holds up
# no other kit's pin. `node scripts/kit-pin.mjs --check <kit>` reads the kit's newest release and the release versions.json
# pins; when main is behind, `node scripts/platform-versions.mjs --<kit> <tag>` pins it, `node scripts/parity-matrix.mjs --write
# --kit <kit>` records that kit's components and tag in platforms.json (the parity page cites it) and leaves the other kits as
# they are, and `node scripts/kit-pin.mjs --bump <kit>` moves each statement of the old
# release and keeps the claim cache in step. A pull request's claims check verifies each version statement against the
# pages and GitHub, so a wrong citation fails it rather than merging. Windows and Android have no release check that holds
# main to their newest release, so their pins wait for this workflow alone. It runs hourly, since a release in another
# repository starts no workflow here, and by hand. A kit whose pages need hand edits (a component count that changed, say)
# fails its claims check and stays open for a person.
# Each job pushes as core pin does: the Ouro Current app's token, else DOCS_PIN_TOKEN, else its own token, whose held runs it
# approves.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  pin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - kit: apple
            name: Apple
          - kit: windows
            name: Windows
          - kit: android
            name: Android
    runs-on: ubuntu-latest
    permissions:
      actions: write # approve the pull request's held runs
      contents: write # push the branch, and delete it when main already pins the kit's newest release
      pull-requests: write # open, retitle, close and auto-merge the pull request
    timeout-minutes: 30
    concurrency:
      group: kit-pin-${{ matrix.kit }}
      cancel-in-progress: false
    env:
      GH_REPO: ${{ github.repository }}
      KIT: ${{ matrix.kit }}
      NAME: ${{ matrix.name }}
      BRANCH: docs/point-at-${{ matrix.kit }}
    steps:
      # Fails when the app is not installed here; the job then goes on with DOCS_PIN_TOKEN or its own token.
      - id: app
        name: Sign in as the Ouro Current app, if it is installed here
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.OURO_CURRENT_APP_ID }}
          private-key: ${{ secrets.OURO_CURRENT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app.outputs.token || secrets.DOCS_PIN_TOKEN || github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: check
        name: Compare main's pin with the kit's newest release
        # Writes result (behind or current), tag and from to GITHUB_OUTPUT. Exits 2 when GitHub cannot be read, which is no drift.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=0
          node scripts/kit-pin.mjs --check "$KIT" || code=$?
          if [ "$code" = 2 ]; then
            echo "::notice::$NAME's newest release could not be read, so main keeps the pin it has."
            echo "result=unreadable" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$code" != 0 ]; then
            exit "$code"
          fi
      - if: steps.check.outputs.result == 'behind'
        id: pin
        name: Pin the release and move the statements of the old one
        # Exits 2 when GitHub cannot be read, before anything is written past versions.json: main keeps its pin then.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
          FROM: ${{ steps.check.outputs.from }}
        run: |
          code=0
          node scripts/platform-versions.mjs "--$KIT" "$TAG" || code=$?
          if [ "$code" = 0 ]; then node scripts/parity-matrix.mjs --write --kit "$KIT" || code=$?; fi
          if [ "$code" = 2 ]; then
            echo "::notice::$NAME's $TAG could not be read, so main keeps its pin."
            echo "result=unreadable" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$code" != 0 ]; then
            exit "$code"
          fi
          node scripts/kit-pin.mjs --bump "$KIT" "$FROM" "${TAG#v}"
          echo "result=changed" >> "$GITHUB_OUTPUT"
      - if: steps.pin.outputs.result == 'changed'
        id: push
        name: Commit the pages and push their branch, unless the branch already holds this pin
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -q -c "$BRANCH"
          git add -A
          git commit -q -m "Point the $NAME pages at ouro-ui-$KIT $TAG"
          # The branch already holds this pin when main has not moved since its last push: then it is not pushed again, so an
          # hourly run does not restart CI on an unchanged pull request.
          if git fetch -q origin "$BRANCH" 2>/dev/null && git diff --quiet FETCH_HEAD HEAD; then
            echo "::notice::$BRANCH already holds this pin on main, so it is not pushed again."
            echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          else
            bash scripts/push-pin-branch.sh "$BRANCH"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pin.outputs.result == 'changed' && steps.push.outputs.queued != 'true'
        id: pr
        name: Open or update the pull request, and turn auto-merge on
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.DOCS_PIN_TOKEN || github.token }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          title="Point the $NAME pages at an ouro-ui-$KIT release"
          body=$(printf '%s\n\n%s\n' "Kit pin opened this pull request to point the $NAME pages at [ouro-ui-$KIT $TAG](https://github.com/ourostack/ouro-ui-$KIT/releases/tag/$TAG), with \`node scripts/platform-versions.mjs --$KIT $TAG\` and \`node scripts/kit-pin.mjs --bump $KIT\`.[^kit]" "[^kit]: https://github.com/ourostack/ouro-ui-$KIT/releases/tag/$TAG verify:urlOk(https://github.com/ourostack/ouro-ui-$KIT/releases/tag/$TAG) verify:equals(scripts/parity-data/versions.json#$KIT.tag)=$TAG")
          number=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body "$body"
            number=$(gh pr view "$BRANCH" --json number --jq .number)
          fi
          # Merge with an explicit message: GitHub's default appends bot Co-authored-by lines, which the ruleset rejects.
          subject=$(gh pr view "$number" --json title,number --jq '"\(.title) (#\(.number))"')
          message=$(gh pr view "$number" --json body --jq .body | tr -d '\r' | grep -v -i -E '^[[:space:]]*[A-Za-z-]+-by[[:space:]]*:.*(\[bot\]|(^|[^A-Za-z0-9])(copilot|claude|anthropic|openai|chatgpt|gpt|codex|gemini|cursor|devin|aider)([^A-Za-z]|$))' || true)
          # GitHub can answer a request to turn auto-merge on with a server error, most often on a pull request it has just
          # opened, and sometimes turns it on all the same: each try checks whether it is on, or merged, before another.
          on=""
          for try in 1 2 3 4 5; do
            if gh pr merge "$number" --auto --squash --subject "$subject" --body "$message"; then on=1; break; fi
            state=$(gh pr view "$number" --json state,autoMergeRequest --jq 'if .state == "MERGED" or .autoMergeRequest != null then "on" else "off" end') || state=""
            if [ "$state" = on ]; then on=1; break; fi
            if [ "$try" -lt 5 ]; then sleep "${MERGE_RETRY_SECONDS:-15}"; fi
          done
          [ -n "$on" ] || { echo "::error::Could not turn auto-merge on for #$number after 5 tries."; exit 1; }
          echo "Auto-merge is on for #$number: it merges once the checks main's ruleset requires pass." >> "$GITHUB_STEP_SUMMARY"
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - if: steps.pin.outputs.result == 'changed' && steps.push.outputs.queued != 'true'
        name: Start the pull request's CI, and fail when it has not started
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.push.outputs.sha }}
          NUMBER: ${{ steps.pr.outputs.number }}
          POLLS: 90
          INTERVAL: 10
        run: |
          # A push with the workflow's own token leaves the pull request's runs held for approval, which
          # this token may give (actions: write). CI has started once it has a run on the pushed commit and
          # no run there is still held.
          for _ in $(seq 1 "$POLLS"); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&per_page=100" --jq '.workflow_runs[] | [.id, .name, (.conclusion // "")] | @tsv') || runs=
            held=$(awk -F '\t' '$3 == "action_required" { print $1 }' <<<"$runs")
            for id in $held; do
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" >/dev/null && echo "Approved held run $id." || echo "::warning::Could not approve held run $id."
            done
            if [ -z "$held" ] && awk -F '\t' '$2 == "CI" { found = 1 } END { exit !found }' <<<"$runs"; then
              echo "CI started on #$NUMBER ($SHA)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep "$INTERVAL"
          done
          message="CI has not started on #$NUMBER ($SHA) $((POLLS * INTERVAL / 60)) minutes after its push, so it cannot merge. Approve its held runs in Actions, or push an empty commit to $BRANCH."
          echo "::error::$message"
          gh pr comment "$NUMBER" --body "$message" || true
          exit 1
      - if: steps.check.outputs.result == 'current'
        name: Close the pull request, since main already pins the kit's newest release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.DOCS_PIN_TOKEN || github.token }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          for number in $(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[].number'); do
            gh pr close "$number" --comment "main's pages already name ouro-ui-$KIT $TAG, so this pull request is not needed."
          done
          git push -q origin --delete "$BRANCH" 2>/dev/null || true
