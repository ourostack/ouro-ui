name: Adoption ledger
# Every hour, measures every product's use of Ouro UI from live sources (releases, repository files, code search, CI
# artifacts, merged pull requests, the `adoption` tracking issues) and publishes the result as ledger.json on the
# `adoption-data` branch, which https://ui.ouroboros.bot/adoption/ reads when it opens. A bot-written data branch, not a
# pull request, so the hour's number never waits in the merge queue. scripts/adoption/README.md says what each column means.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adoption-ledger
  cancel-in-progress: false
jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Measure
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/adoption/ledger.mjs --out "$RUNNER_TEMP/ledger.json"
      - name: Publish to the adoption-data branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$REPO/branches/adoption-data" >/dev/null 2>&1; then
            sha=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
            gh api "repos/$REPO/git/refs" -f ref=refs/heads/adoption-data -f sha="$sha" >/dev/null
          fi
          current=$(gh api "repos/$REPO/contents/ledger.json?ref=adoption-data" --jq .sha 2>/dev/null || true)
          args=(-X PUT "repos/$REPO/contents/ledger.json" -f message="Ledger $(date -u +%Y-%m-%dT%H:%MZ)" -f branch=adoption-data -f content="$(base64 < "$RUNNER_TEMP/ledger.json" | tr -d '\n')")
          [ -z "$current" ] || args+=(-f sha="$current")
          gh api "${args[@]}" >/dev/null
          echo "Published $(node -e 'const l=require(process.argv[1]);console.log(`${l.summary.confirmed} of ${l.summary.total} confirmed`)' "$RUNNER_TEMP/ledger.json")."
