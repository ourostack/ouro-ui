name: Adoption ledger
# Every hour, measures every product's use of Ouro UI from live sources (releases, repository files, code search, CI
# artifacts, merged pull requests, the `adoption` tracking issues) and publishes the result as ledger.json on the
# `adoption-data` branch, which https://ui.ouroboros.bot/adoption/ reads when it opens. A bot-written data branch, not a
# pull request, so the hour's number never waits in the merge queue. scripts/adoption/README.md says what each column means.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adoption-ledger
  cancel-in-progress: false
jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write # the issue for products a day late (scripts/scheduled-failure.sh)
      actions: write # to rebuild the site with this hour's ledger (pages.yml)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Measure
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/contents/search-cache.json?ref=adoption-data" --jq .content 2>/dev/null | base64 -d > "$RUNNER_TEMP/search-cache.json" || echo '{}' > "$RUNNER_TEMP/search-cache.json"
          node scripts/adoption/ledger.mjs --out "$RUNNER_TEMP/ledger.json" --search-cache-in "$RUNNER_TEMP/search-cache.json" --search-cache-out "$RUNNER_TEMP/search-cache.json"
      - name: Publish to the adoption-data branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$REPO/branches/adoption-data" >/dev/null 2>&1; then
            sha=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
            gh api "repos/$REPO/git/refs" -f ref=refs/heads/adoption-data -f sha="$sha" >/dev/null
          fi
          current=$(gh api "repos/$REPO/contents/ledger.json?ref=adoption-data" --jq .sha 2>/dev/null || true)
          # The ledger is too big for a command-line argument (ARG_MAX), so the request body goes in a file.
          base64 -w0 < "$RUNNER_TEMP/ledger.json" > "$RUNNER_TEMP/ledger.b64"
          jq -n --rawfile content "$RUNNER_TEMP/ledger.b64" --arg message "Ledger $(date -u +%Y-%m-%dT%H:%MZ)" --arg sha "$current" \
            '{message: $message, branch: "adoption-data", content: $content} + (if $sha == "" then {} else {sha: $sha} end)' > "$RUNNER_TEMP/publish.json"
          gh api -X PUT "repos/$REPO/contents/ledger.json" --input "$RUNNER_TEMP/publish.json" >/dev/null
          echo "Published $(node -e 'const l=require(process.argv[1]);console.log(`${l.summary.confirmed} of ${l.summary.total} confirmed`)' "$RUNNER_TEMP/ledger.json")."
      - name: Publish the code search cache to the adoption-data branch
        # The cache keeps each search's result with the searched repository's commit, so a repository that hasn't
        # moved since the last run is read from here instead of searched again (scripts/adoption/README.md).
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$REPO/contents/search-cache.json?ref=adoption-data" --jq .sha 2>/dev/null || true)
          base64 -w0 < "$RUNNER_TEMP/search-cache.json" > "$RUNNER_TEMP/search-cache.b64"
          jq -n --rawfile content "$RUNNER_TEMP/search-cache.b64" --arg message "Code search cache $(date -u +%Y-%m-%dT%H:%MZ)" --arg sha "$current" \
            '{message: $message, branch: "adoption-data", content: $content} + (if $sha == "" then {} else {sha: $sha} end)' > "$RUNNER_TEMP/publish-search-cache.json"
          gh api -X PUT "repos/$REPO/contents/search-cache.json" --input "$RUNNER_TEMP/publish-search-cache.json" >/dev/null
      - name: Rebuild the site with this hour's ledger
        # The page is prerendered from the ledger Pages builds in (take-newest.mjs), so until Pages runs again it would
        # open on the previous hour's numbers. Pages deploys only main's tip, so a dispatch on main is always deployed.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run pages.yml --repo "$REPO" --ref main
          echo "Dispatched Pages on main, so /adoption/ opens on this hour's ledger."
      - name: Report products more than a day behind
        # One issue, "Products are more than a day behind Ouro UI", opened or commented on at most daily, while any counted
        # product has lacked an Ouro UI release for more than a day (summary.late). The issue drain opens the bump pull requests.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          QUIET_HOURS: 24
        run: |
          set -euo pipefail
          late=$(node -e 'const l=require(process.argv[1]);console.log((l.summary.late??[]).map((p)=>`${p.name} (${p.late} of ${p.behind} releases)`).join(", "))' "$RUNNER_TEMP/ledger.json")
          if [ -z "$late" ]; then echo "No counted product is more than a day behind."; exit 0; fi
          scripts/scheduled-failure.sh "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "Products are more than a day behind Ouro UI" "These products have lacked an Ouro UI release for more than a day: $late. Bump each to the newest release in a small pull request"
