# DIAGNOSTIC (drain-4, #3361): a single lightweight job that runs only the Vegetarian contrast
# stress test on Linux WebKit, bypassing the full install matrix so it can finish under the CI
# runner pool's current congestion. Not for merge: remove before the real fix ships.
name: Probe Vegetarian contrast
on:
  push:
    branches: [probe/vegetarian-contrast-diag]

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe # v1.65.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - run: pnpm i --frozen-lockfile
      - run: pnpm exec vitest run --project ouro-webkit registry/ouro/components/ouro/inspector/inspector.test.tsx -t "diag:"

  # DIAGNOSTIC (drain-4, #3361): the same stress test, but inside an app built the way
  # `install (shadcn, nova, N/6)` builds it (shadcn init --preset nova + ouro-base + every
  # component), to test whether the preset's own CSS (not the repo's own app.css) is what moves
  # the measured ratio on Linux WebKit. Not for merge: remove before the real fix ships.
  probe-nova-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe # v1.65.0-noble
      options: --user 1001
    env:
      OURO_PRESET: nova
      OURO_APP: ${{ github.workspace }}/.probe-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - run: pnpm i --frozen-lockfile
      - run: scripts/install-test.sh shadcn "$OURO_APP" "${{ github.sha }}"
        env:
          OURO_PREPARE_ONLY: "1"
      # Shard 6/6 is the one #3361 keeps failing in: run the real shard, not just this file, so
      # whatever else that shard's workers run alongside Inspector (if that's the trigger) runs too.
      - run: scripts/install-test.sh shadcn "$OURO_APP" "${{ github.sha }}"
        env:
          OURO_REUSE_APP: "1"
          OURO_SHARD: "6/6"
          OURO_SYSTEM_PACKAGES: image
