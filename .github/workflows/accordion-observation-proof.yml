name: Accordion Observation Proof
on:
  push:
    branches: [probe/accordion-observation-proof]
permissions:
  contents: read
concurrency:
  group: accordion-observation-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Retain source and both-browser native observation proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p accordion-evidence
          git rev-parse HEAD > accordion-evidence/source.txt
          git rev-parse 4e663fc480be9a303895e0661a6d897dc02be87f > accordion-evidence/candidate.txt
          git merge-base --is-ancestor 4e663fc480be9a303895e0661a6d897dc02be87f HEAD
          git diff 4e663fc480be9a303895e0661a6d897dc02be87f -- registry > accordion-evidence/candidate.diff
          test ! -s accordion-evidence/candidate.diff
          sha256sum registry/ouro/components/ouro/accordion/accordion.test.tsx test/accordion-observation-proof.test.tsx scripts/accordion-observation-proof.config.mts .github/workflows/accordion-observation-proof.yml > accordion-evidence/digests.txt
          export ACCORDION_PROOF_SOURCE=$(git rev-parse HEAD)
          export ACCORDION_OBSERVATION_FILE="$PWD/accordion-evidence/native.jsonl"
          export ACCORDION_RESULT_FILE="$PWD/accordion-evidence/results.json"
          if pnpm exec vitest run --config scripts/accordion-observation-proof.config.mts --project=ouro-chromium --project=ouro-webkit registry/ouro/components/ouro/accordion/accordion.test.tsx test/accordion-observation-proof.test.tsx > accordion-evidence/proof.log 2>&1; then code=0; else code=$?; fi
          printf '%s\n' "$code" > accordion-evidence/proof.exit
          test -s "$ACCORDION_OBSERVATION_FILE"
          test -s "$ACCORDION_RESULT_FILE"
          exit "$code"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accordion-observation-proof
          path: |
            accordion-evidence/
            .vitest/attachments/
          if-no-files-found: error
