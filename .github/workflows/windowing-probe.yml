name: Windowing probe
# Probe: runs message-list.windowing.test.tsx in ouro-chromium repeatedly, once on a quiet runner and once under controlled CPU
# load (scripts/load.mjs, at most the runner's cores minus two, killed on every exit path), printing each run's time and, on a
# hang, the wait that was in flight. Dispatch by hand only; never a push or a pull request. Remove it once the cause is fixed.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs in each mode
        required: false
        default: "30"
        type: string
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    container:
      image: mcr.microsoft.com/playwright@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe # v1.65.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
      env:
        OURO_SYSTEM_PACKAGES: image
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        mode: [unloaded, loaded]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - run: pnpm i --frozen-lockfile
      - run: node --test scripts/load.test.mjs
      - name: Measure
        env:
          MODE: ${{ matrix.mode }}
          RUNS: ${{ inputs.runs }}
        run: node scripts/probe-windowing.mjs "$MODE" "$RUNS" 240
