name: Quarantine retry
# CI (push, a pull request and the merge queue alike) fails on a quarantined test the same as any
# other, so a red run from one is retried here: scripts/quarantine.mjs reads the run's failed jobs,
# and when every failure is a quarantined test whose issue is open and not expired, it reruns the
# failed jobs once and records the retry on the test's issue. A failure quarantine.mjs cannot wholly
# explain (an unlisted test, a closed or expired entry, a failure beyond a named test, a second
# failure on the same run) is left alone: it stays red, as a real failure should.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions: {}
concurrency:
  group: quarantine-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write # read the run's job logs, and rerun its failed jobs once
      contents: read
      issues: write # read a quarantined test's issue state, and comment on it when retried
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/quarantine.mjs
            scripts/ci-budget.mjs
            .github/quarantine.json
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Retry the run's failures if every one is a quarantined test
        run: node scripts/quarantine.mjs retry "$RUN_ID"
