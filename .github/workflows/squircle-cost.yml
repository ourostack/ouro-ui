name: Squircle cost
# Where WebKit has no corner-shape (Safari and WKWebView 26, which a Mac app embeds), Ouro draws each squircle
# through clip paths, and Playwright's WebKit draws corner-shape natively, so only a Mac shows what they cost. This runs
# scripts/squircle-cost/run.mjs on the same runner image as an app's Mac legs: a WKWebView repaints the area around 285
# squircle controls and types beside them while messages arrive, and the job fails when the repaint costs more than the
# five-point drawing before #1385 in more rounds than chance allows (scripts/squircle-cost/compare.mjs). The summary has
# the typing times. Not a required check.
on:
  pull_request:
    paths:
      - registry/ouro/theme/ouro-base.css
      - registry/ouro/components/ouro/avatar/avatar.tsx
      - registry/ouro/components/ouro/badge/badge.tsx
      - registry/ouro/components/ouro/button/button.tsx
      - registry/ouro/components/ouro/card/card.tsx
      - registry/ouro/components/ouro/dialog/dialog-parts.tsx
      - registry/ouro/components/ouro/text-field/text-field.tsx
      - registry/ouro/components/ouro/toggle/toggle.tsx
      - scripts/squircle-cost/**
      - .github/workflows/squircle-cost.yml
  workflow_dispatch:
concurrency:
  group: squircle-cost-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  wkwebview:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - run: pnpm i --frozen-lockfile
      - run: node scripts/squircle-cost/run.mjs 10
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: squircle-cost
          path: .tmp/squircle-cost/
