name: Temporary SSO coverage
# A one-off read of first-run-sso.ts's branch coverage on Linux for #2066, removed before it merges.
on:
  pull_request:
    paths:
      - .github/workflows/tmp-sso-lcov.yml
permissions:
  contents: read
concurrency:
  group: tmp-sso-lcov-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sso-lcov:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        try: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Branches never taken
        run: |
          node --test --experimental-test-coverage --test-coverage-include=registry/ouro/check/first-run-sso.ts --test-reporter=lcov --test-reporter-destination="$RUNNER_TEMP/lcov.info" --test-reporter=dot --test-reporter-destination=stdout scripts/check/first-run-sso.test.mts || true
          grep -E '^(BRDA:[0-9]+,[0-9]+,[0-9]+,0$|FNDA:0|DA:[0-9]+,0$)' "$RUNNER_TEMP/lcov.info" | while IFS=, read -r a b c d; do l=${a#BRDA:}; echo "$a,$b,$c,$d  $(sed -n "${l}p" registry/ouro/check/first-run-sso.ts | cut -c1-160)"; done
          grep -E '^(BRF|BRH|FNF|FNH|LF|LH):' "$RUNNER_TEMP/lcov.info"
