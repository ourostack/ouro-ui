name: Probe 716
on:
  pull_request:
    types: [opened, synchronize]
    paths: [".github/workflows/probe-716.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3]
        variant: [base, wait, noswitch]
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
      env:
        OURO_SYSTEM_PACKAGES: image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - run: pnpm i --frozen-lockfile
      - run: pnpm site:build
      - name: Loop the stage latency spec, with a CPU benchmark before each pass
        env:
          PROBE_VARIANT: ${{ matrix.variant }}
        run: |
          echo variant $PROBE_VARIANT
          for b in 1 2; do (while :; do :; done) & done
          nproc; cat /proc/cpuinfo | grep -m1 "model name"; cat /proc/loadavg
          for i in 1 2 3 4; do
            echo "=== pass $i $(date -u +%T) loadavg $(cat /proc/loadavg)"
            pnpm exec playwright test --config playwright.latency.config.ts --project=site-latency stage.latency 2>&1 | grep -E "^latency |latency-slow|passed|failed" || true
          done
