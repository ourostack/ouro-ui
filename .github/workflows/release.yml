name: Release
# Cuts v<version>. The tag points at a release commit that main never receives: a branch
# off green main whose registry.json pins every same-repo registryDependency to the tag
# (scripts/registry.mts --release), so `shadcn add ourostack/ouro-ui/<item>#v<version>`
# installs every Ouro dependency at that tag while main stays unpinned. CI runs on that
# commit; when it passes, the commit is tagged, the GitHub release is created and the
# branch is deleted (the tag keeps the commit). Because main never receives the release
# commit, the run then opens "Prepare main for the next release" against main: it starts
# CHANGES.md again and makes the tag the newest release (package.json ouro.latestRelease,
# scripts/latest-release.mjs), which the docs, the site and the @ouro namespace follow once
# it merges. The next release refuses to start while CHANGES.md lists no change or still
# lists this release's (scripts/changes.mjs). Rerunning is safe: a released tag exits
# cleanly, a tag without a release fails with the fix, and a failed run deletes its
# branch. Recovery: AGENTS.md, "Pages and releases".
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (for example 0.1.0)"
        required: true
permissions:
  contents: write # push the release branch and the tag, create the release
  actions: write # run CI on the release branch and the CHANGES.md branch
  pull-requests: write # open the PR that prepares main for the next release
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
      BRANCH: release/v${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - id: check
        name: Check the version, the tag and main's CI
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be x.y.z, without the v"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            if out=$(gh release view "$TAG" --json tagName 2>&1); then
              echo "::notice::$TAG is already released. Nothing to do. If the 'Prepare main for the next release' PR is missing, open it by hand (AGENTS.md, 'Pages and releases')."
              exit 0
            fi
            # Only a missing release means the tag is orphaned; any other error (a rate limit,
            # an API outage) must never lead to deleting a published tag.
            if grep -q 'release not found' <<<"$out"; then
              echo "::error::Tag $TAG exists but has no GitHub release. Delete the tag (git push origin :refs/tags/$TAG) and run Release again."
            else
              echo "::error::Could not check the release for $TAG: $out"
            fi
            exit 1
          fi
          sha=$(git rev-parse HEAD)
          conclusion=$(gh run list --workflow ci.yml --branch main --event push --commit "$sha" --json conclusion --jq '.[0].conclusion')
          [ "$conclusion" = success ] || { echo "::error::CI on main ($sha) is '${conclusion:-not run}', not success"; exit 1; }
          echo "MAIN_SHA=$sha" >> "$GITHUB_ENV"
          echo "new=true" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.new == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.check.outputs.new == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
      - if: steps.check.outputs.new == 'true'
        run: pnpm i --frozen-lockfile
      - if: steps.check.outputs.new == 'true'
        name: Check CHANGES.md
        run: |
          # The newest release's notes, or nothing before the first release.
          gh release view --json body --jq .body > "$RUNNER_TEMP/last-notes.md" 2>/dev/null || : > "$RUNNER_TEMP/last-notes.md"
          node scripts/changes.mjs check CHANGES.md "$RUNNER_TEMP/last-notes.md"
      - if: steps.check.outputs.new == 'true'
        name: Push the release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          # The tagged commit names itself: its README, UPGRADING.md, llms.txt and site show $TAG.
          node scripts/latest-release.mjs set "$TAG"
          pnpm run docs
          node scripts/registry.mts --release "$VERSION"
          git commit -am "Release $TAG"
          git push --force origin "$BRANCH"
      - if: steps.check.outputs.new == 'true'
        name: Run CI on the release commit
        run: |
          sha=$(git rev-parse HEAD)
          gh workflow run ci.yml --ref "$BRANCH"
          for _ in $(seq 60); do
            run=$(gh run list --workflow ci.yml --branch "$BRANCH" --commit "$sha" --event workflow_dispatch --json databaseId --jq '.[0].databaseId')
            [ -n "$run" ] && break
            sleep 5
          done
          [ -n "$run" ] || { echo "::error::CI did not start on $BRANCH ($sha)"; exit 1; }
          gh run watch "$run" --exit-status --interval 30
      - if: steps.check.outputs.new == 'true'
        name: Tag and publish the release
        run: |
          git tag "$TAG"
          git push origin "$TAG"
          {
            echo "Install an item at this release; its Ouro dependencies install from the same tag. In an app with Tailwind CSS v4 and an \"@/*\" path alias, run shadcn's init once first, with the Base UI base:"
            echo
            echo '```sh'
            echo "npx shadcn@latest init --base base --preset nova --yes --no-monorepo"
            echo "npx shadcn@latest add ourostack/ouro-ui/dialog#$TAG"
            echo '```'
            echo
            echo "The tests, stories and specs are optional, one item per component: \`npx shadcn@latest add ourostack/ouro-ui/dialog#$TAG ourostack/ouro-ui/dialog-tests#$TAG\`, or \`ourostack/ouro-ui/ouro-tests#$TAG\` for all of them. List every item with \`npx shadcn@latest search 'ourostack/ouro-ui#$TAG'\`."
            echo
            # CHANGES.md lists what this release changes in behaviour ("Check CHANGES.md").
            sed -e '1s/^# /### /' CHANGES.md
            echo
            # Remove this note once v0.1.0 is no longer in use.
            # UPGRADING.md is the note (README.md and the site copy it); its {{latestRelease}}
            # placeholder gets this tag (scripts/latest-release.mjs), and the line that explains
            # the placeholder to readers of the raw file goes (scripts/upgrade-note.mjs rawHint).
            sed -e '1s/^# /### /' -e '/^> \*\*Reading this file on GitHub?\*\*/,/^$/d' -e "s/{{latestRelease}}/$TAG/g" UPGRADING.md
            echo
            echo 'Or through the `@ouro` namespace, which serves the newest release: this one, once main is prepared for the next release. Add it to `components.json` once:'
            echo
            echo '```json'
            echo '"registries": { "@ouro": "https://ourostack.github.io/ouro-ui/r/{name}.json" }'
            echo '```'
            echo
            echo '```sh'
            echo 'npx shadcn@latest add @ouro/dialog'
            echo '```'
            echo
            echo "Items:"
            echo
            jq -r '.items[] | "- `\(.name)`: \(.description)"' registry.json
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          git push origin --delete "$BRANCH"
      - if: steps.check.outputs.new == 'true'
        name: Prepare main for the next release
        env:
          NEXT_BRANCH: prepare/after-v${{ inputs.version }}
        run: |
          # Main still lists this release's changes and names the previous release, because the
          # release commit never reaches it. Start CHANGES.md again and make this tag the newest
          # release (package.json ouro.latestRelease; `pnpm run docs` writes it into README.md,
          # llms.txt and package.json), on a branch off the released main commit, so a line
          # added to main's CHANGES.md during the release shows as a conflict instead of being
          # dropped. If this step fails, the release stands; open the PR by hand ("Check
          # CHANGES.md" stops the next release until main's CHANGES.md is started again).
          git switch -c "$NEXT_BRANCH" "$MAIN_SHA"
          node scripts/changes.mjs reset CHANGES.md
          node scripts/latest-release.mjs set "$TAG"
          pnpm run docs
          git commit -am "Prepare main for the next release"
          git push --force origin "$NEXT_BRANCH"
          gh pr create --base main --head "$NEXT_BRANCH" --title "Prepare main for the next release" \
            --body "$TAG is released with these changes in its notes, so CHANGES.md starts again for the next release, and $TAG becomes the newest release: the README, the site, llms.txt and the @ouro namespace move to it when this merges. Merge this before adding the next release's changes."
          # GitHub records a pull_request CI run for a PR a workflow opened with GITHUB_TOKEN,
          # but holds it (`action_required`) with no jobs, and the ruleset's required checks
          # count only pull_request-event checks, not a dispatched run. Approve the held run
          # so the required checks report on the PR. GitHub documents the approve endpoint for
          # fork PRs and names only OAuth and classic PAT tokens, so whether GITHUB_TOKEN may
          # call it is untested here; when the approval fails, dispatch CI on the branch (a
          # signal only; it does not satisfy the ruleset) and leave the exact command for a
          # person in the job summary and the PR body (AGENTS.md, "Pages and releases").
          sha=$(git rev-parse HEAD)
          run=
          for _ in $(seq 24); do
            run=$(gh run list --workflow ci.yml --branch "$NEXT_BRANCH" --commit "$sha" --event pull_request --json databaseId --jq '.[0].databaseId')
            [ -n "$run" ] && break
            sleep 5
          done
          if [ -n "$run" ] && gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/approve" >/dev/null; then
            echo "Approved CI run $run on $NEXT_BRANCH; its checks report on the pull request." >> "$GITHUB_STEP_SUMMARY"
          else
            cmd="gh api -X POST repos/$GITHUB_REPOSITORY/actions/runs/${run:-<run id of the pull_request CI run on $NEXT_BRANCH>}/approve"
            echo "::warning::Could not approve the held CI run on $NEXT_BRANCH; the required checks will not report until a person does."
            gh workflow run ci.yml --ref "$NEXT_BRANCH"
            printf '%s\n' "### Approve CI on the \"Prepare main for the next release\" PR" "" "The required checks run only after a person approves the held CI run:" "" '```sh' "$cmd" '```' >> "$GITHUB_STEP_SUMMARY"
            pr_body=$(gh pr view "$NEXT_BRANCH" --json body --jq .body)
            gh pr edit "$NEXT_BRANCH" --body "$pr_body

          CI for this PR is held until a person approves it. Run:

              $cmd"
          fi
      - if: failure() && steps.check.outputs.new == 'true'
        name: Clean up after a failure
        run: |
          git push origin --delete "$BRANCH" || true
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null && ! out=$(gh release view "$TAG" --json tagName 2>&1); then
            if grep -q 'release not found' <<<"$out"; then
              echo "::error::Tag $TAG was pushed but the release was not created. Delete the tag (git push origin :refs/tags/$TAG) and run Release again."
            else
              echo "::error::Could not check the release for $TAG: $out"
            fi
          fi
