name: Release
# Cuts v<version> from the commit of main that a passing rehearsal of it (release-rehearsal.yml)
# tested: main's head, or an earlier commit of main when merges came after the rehearsal; those go
# out in the next release (scripts/rehearsal-evidence.mjs pick).
# The tag points at a release commit that main never receives: a branch
# off green main whose registry.json pins every same-repo registryDependency to the tag
# (scripts/registry.mts --release), so `shadcn add ourostack/ouro-ui/<item>#v<version>`
# installs every Ouro dependency at that tag while main stays unpinned. The @ouro namespace
# built from that commit must match its registry.json and files byte for byte
# (scripts/public-registry.mjs verify-build). CI runs on that
# commit (with the shadcn@latest install, ci.yml's install-latest job), then the screen-reader
# lane (screen-reader.yml: VoiceOver and NVDA); when both pass, the commit is tagged, the
# GitHub release is created and the branch is deleted (the tag keeps the commit). Because
# main never receives the release commit, main keeps its change fragments: a release's notes list
# only the fragment lines the last release's notes lack (scripts/changes.mjs), and no pull request
# prepares main afterwards. The run deploys Pages (the pages job: Pages' build names the newest
# release in the site, llms.txt and the @ouro namespace) and last checks that the site's llms.txt
# names this release (scripts/published-release.mjs) and that Pages serves every @ouro item byte
# for byte as built from the tag (scripts/public-registry.mjs verify-live). The next release
# refuses to start while changes/ lists no change the last release lacks. Rerunning is safe: a
# released tag exits cleanly, a tag without a release fails with the fix, and a failed run deletes
# its branch. A tag out without Pages following opens an issue (the finish job).
# Recovery: AGENTS.md, "Pages and releases".
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (for example 0.1.0)"
        required: true
# Each job asks for its own permissions.
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release branch and the tag, create the release
      actions: write # run CI on the release branch and the screen-reader lane
      issues: write # report a screen-reader lane that failed twice on infrastructure (scripts/sr-infra-issue.sh)
    # Two CI runs, 45 minutes each with the runner pool's queues, on the release commit (with the
    # shadcn@latest install, beside CI's other jobs), the second for a quarantined test's retry; the screen-reader lane
    # between them, 8 minutes, once more after an infrastructure failure; and the namespace checks,
    # 2: 153, and 1.5 times that 230 (scripts/workflows.test.mjs, which holds the numbers). Pages
    # is a later job with its own.
    timeout-minutes: 230
    outputs:
      new: ${{ steps.check.outputs.new }}
      producers: ${{ steps.check.outputs.producers }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
      BRANCH: release/v${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - id: check
        name: Check the version, the tag and main's CI
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be x.y.z, without the v"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            if out=$(gh release view "$TAG" --json tagName 2>&1); then
              echo "::notice::$TAG is already released. Nothing to do."
              # The finish job reads this: a rerun for a released version pushed no tag of its own.
              echo "new=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Only a missing release means the tag is orphaned; any other error (a rate limit,
            # an API outage) must never lead to deleting a published tag.
            if grep -q 'release not found' <<<"$out"; then
              echo "::error::Tag $TAG exists but has no GitHub release. Delete the tag (git push origin :refs/tags/$TAG) and run Release again."
            else
              echo "::error::Could not check the release for $TAG: $out"
            fi
            exit 1
          fi
          # The commit a passing rehearsal of this version tested (scripts/rehearsal-evidence.mjs pick):
          # main's head when its newest rehearsal passed, else the newest such commit of main, so
          # merges while a rehearsal runs never make it stale; they go out in the next release.
          # Everything below checks and releases that commit.
          sha=$(node scripts/rehearsal-evidence.mjs pick "$TAG" "$(git rev-parse HEAD)") || { echo "::error::No passing rehearsal of $TAG on main to release. Run it first: gh workflow run release-rehearsal.yml -f version=$VERSION"; exit 1; }
          git checkout -q --detach "$sha"
          # The workflows that report the checks main's rules require (CI, conformance exemptions:
          # scripts/required-producers.mjs), which this run dispatches where GITHUB_TOKEN starts none.
          producers=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" --jq '[.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context] | unique | .[]' | node scripts/required-producers.mjs) || { echo "::error::Could not tell which workflows report main's required checks."; exit 1; }
          echo "producers=$(echo $producers)" >> "$GITHUB_OUTPUT"
          echo "PRODUCERS=$(echo $producers)" >> "$GITHUB_ENV"
          # Main's runs of each on this commit: a push run, a dispatch on main, and the merge queue's run, which tested this very commit
          # before main fast-forwarded to it (the push run after it then skips every job but
          # install-github). A check main's rules require passes when one of them passed it
          # (scripts/required-ci.sh), whatever the runs' overall conclusions, which ci-budget's
          # failure would decide too.
          runs=
          for workflow in $producers; do
            ci=$(gh run list --workflow "$workflow" --commit "$sha" --json databaseId,event,headBranch --jq '[.[] | select((.headBranch == "main" and (.event == "push" or .event == "workflow_dispatch")) or .event == "merge_group" or (.event == "workflow_dispatch" and (.headBranch | startswith("gh-readonly-queue/main/")))) | .databaseId] | map(tostring) | join(" ")')
            [ -n "$ci" ] || { echo "::error::$workflow has not run on main ($sha)"; exit 1; }
            runs="$runs $ci"
          done
          # shellcheck disable=SC2086 # one argument per run
          scripts/required-ci.sh $runs || { echo "::error::CI on main ($sha) did not pass the checks main's rules require"; exit 1; }
          # install-github, the install a user runs today (`shadcn add` at the newest release tag), runs only in main's
          # own CI run (a push, or a dispatch on main), and the rules cannot require it: the queue's
          # run skips it. So when main has its own run on this commit, the newest must have passed it.
          own=$(gh run list --workflow ci.yml --commit "$sha" --json databaseId,event,headBranch --jq '[.[] | select(.headBranch == "main" and (.event == "push" or .event == "workflow_dispatch"))][0].databaseId // empty')
          if [ -n "$own" ]; then
            jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$own/jobs?per_page=100" --paginate --jq '.jobs[] | [.name, .conclusion] | @tsv') || { echo "::error::Could not read the jobs of run $own."; exit 1; }
            github=$(awk -F '\t' '$1 == "install-github" { print $2; exit }' <<<"$jobs")
            [ "$github" = success ] || { echo "::error::install-github is '${github:-not in the run}' in main's own CI run $own ($sha), not success: the install a user runs today must pass before a release."; exit 1; }
          fi
          # A rehearsal of this version (release-rehearsal.yml) ran the full CI and the screen-reader
          # lane on the release commit as this run will write it, so a check that fails only on a
          # release commit stops there, before anything is cut. The newest rehearsal on this commit
          # decides; with none, the newest on a commit of main at most 50 commits before it, started
          # in the last 24 hours, decides, and holds only when this commit differs from that one in
          # tests and records that ship nowhere alone (scripts/rehearsal-evidence.mjs). Checked
          # after main's own CI on this commit above; any error refuses it. The run and the files
          # go to the summary and, for the release notes, to $RUNNER_TEMP/rehearsal.md.
          rehearsed=$(node scripts/rehearsal-evidence.mjs "$TAG" "$sha" --notes "$RUNNER_TEMP/rehearsal.md") || { echo "::error::No passing rehearsal of $TAG holds for main ($sha). Run it first: gh workflow run release-rehearsal.yml -f version=$VERSION"; exit 1; }
          # What the rehearsal passed only on a quarantined test's retry (scripts/quarantine.mjs), shown here too.
          node scripts/quarantine.mjs rehearsed "$rehearsed"
          echo "MAIN_SHA=$sha" >> "$GITHUB_ENV"
          echo "new=true" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.new == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.check.outputs.new == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - if: steps.check.outputs.new == 'true'
        run: pnpm i --frozen-lockfile
      - if: steps.check.outputs.new == 'true'
        name: Check the changes
        run: |
          # The newest release's notes, or nothing before the first release.
          gh release view --json body --jq .body > "$RUNNER_TEMP/last-notes.md" 2>/dev/null || : > "$RUNNER_TEMP/last-notes.md"
          node scripts/changes.mjs check changes "$RUNNER_TEMP/last-notes.md"
      - if: steps.check.outputs.new == 'true'
        name: Push the release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          # The tagged commit names itself: its README, UPGRADING.md, llms.txt and site show $TAG,
          # its registry.json is released at $VERSION, and CHANGES.md holds this release's changes.
          scripts/release-commit.sh "$VERSION"
          git add CHANGES.md
          git commit -am "Release $TAG"
          git push --force origin "$BRANCH"
      - if: steps.check.outputs.new == 'true'
        id: reuse
        name: Reuse the rehearsal's proof when it tested this very tree
        run: |
          # The rehearsal wrote the release commit with the same script and ran CI and the
          # screen-reader lane on it. When its commit has this commit's tree, that proof is for
          # these bytes: the same checks are judged on its runs instead of being run again.
          # Anything else, a different tree, a missing run or a check that did not pass, takes
          # the full path below, unchanged.
          echo "reuse=false" >> "$GITHUB_OUTPUT"
          rbranch="release/$TAG-rehearsal"
          tree=$(git rev-parse 'HEAD^{tree}')
          shas=$(gh run list --workflow ci.yml --branch "$rbranch" --event workflow_dispatch --limit 20 --json headSha,createdAt --jq 'sort_by(.createdAt) | reverse | [.[].headSha] | unique | .[]') || shas=
          for rsha in $shas; do
            [ "$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$rsha" --jq .tree.sha 2>/dev/null || true)" = "$tree" ] || continue
            runs=
            for workflow in $PRODUCERS; do
              id=$(gh run list --workflow "$workflow" --branch "$rbranch" --event workflow_dispatch --commit "$rsha" --json databaseId,createdAt --jq 'sort_by(.createdAt) | last | .databaseId // empty')
              runs="$runs $id"
            done
            [[ "$runs" != *"  "* && -n "${runs// }" ]] || continue
            # shellcheck disable=SC2086 # one argument per run
            scripts/required-ci.sh --also "install (shadcn@latest, nova)" $runs || continue
            lane=$(gh run list --workflow screen-reader.yml --branch "$rbranch" --event workflow_dispatch --json databaseId,headSha,conclusion,createdAt --jq "[.[] | select(.headSha == \"$rsha\" and .conclusion == \"success\")] | sort_by(.createdAt) | last | .databaseId // empty")
            [ -n "$lane" ] || continue
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            {
              echo "Reused the rehearsal's proof: its commit \`$rsha\` has this release commit's tree (\`$tree\`)."
              for id in $runs; do echo "- CI run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"; done
              echo "- Screen-reader lane: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$lane"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          done
          echo "No rehearsal commit has this tree with CI and the screen-reader lane passed: running both on the release commit."
      - if: steps.check.outputs.new == 'true'
        name: Build and check the @ouro namespace for the release commit
        run: |
          # What Pages will serve at /r/ for this release: the namespace built from this commit
          # (scripts/namespace.sh), checked against the commit's registry.json and files byte for
          # byte, every item and no other (scripts/public-registry.mjs), before CI, the
          # screen-reader lane and the tag.
          scripts/namespace.sh "$RUNNER_TEMP/ns" "$TAG"
          node scripts/public-registry.mjs verify-build "$RUNNER_TEMP/ns" HEAD
      - if: steps.check.outputs.new == 'true' && steps.reuse.outputs.reuse != 'true'
        name: Start the screen-reader lane on the release commit
        run: |
          # Dispatched before CI, so the two run side by side; "Pass the screen-reader lane"
          # waits for this run (SR_BEFORE marks the runs that came before it).
          sha=$(git rev-parse HEAD)
          before=$(gh run list --workflow screen-reader.yml --branch "$BRANCH" --event workflow_dispatch --json databaseId --jq '[.[].databaseId] | max // 0')
          gh workflow run screen-reader.yml --ref "$BRANCH" -f source_sha="$sha"
          echo "SR_BEFORE=$before" >> "$GITHUB_ENV"
      - if: steps.check.outputs.new == 'true' && steps.reuse.outputs.reuse != 'true'
        name: Run CI on the release commit
        run: |
          sha=$(git rev-parse HEAD)
          # CI and every other workflow that reports a check main's rules require, judged on those
          # checks and on the release-only gates the rules cannot require, as main never runs them:
          # ci.yml's install-latest job. ci-budget does not decide.
          run=$(scripts/dispatch-required.sh "$BRANCH" "$sha")
          # A check that failed only because of quarantined tests (.github/quarantine.json) is retried
          # once, recorded, and judged again (scripts/quarantine.mjs); any other failure, or a second
          # one, stops the release.
          # shellcheck disable=SC2086 # one argument per run
          if ! scripts/required-ci.sh --also "install (shadcn@latest, nova)" $run; then
            # shellcheck disable=SC2086 # one argument per run
            node scripts/quarantine.mjs retry --also "install (shadcn@latest, nova)" $run || exit 1
            # shellcheck disable=SC2086 # one argument per run
            scripts/required-ci.sh --also "install (shadcn@latest, nova)" $run || { echo "- After the retry, CI still failed." >> "$GITHUB_STEP_SUMMARY"; exit 1; }
            echo "- After the retry, CI passed the checks main's rules require." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.check.outputs.new == 'true' && steps.reuse.outputs.reuse != 'true'
        name: Pass the screen-reader lane on the release commit
        run: |
          # The release commit is tagged only when VoiceOver and NVDA pass on that exact commit
          # (screen-reader.yml, dispatched on the release branch with source_sha set to it, the
          # first time alongside CI). An infrastructure failure (scripts/sr-classify.mjs) is
          # dispatched once more; a second one, or an accessibility failure, stops the release.
          sha=$(git rev-parse HEAD)
          for attempt in 1 2; do
            if [ "$attempt" = 1 ]; then
              before=$SR_BEFORE
            else
              before=$(gh run list --workflow screen-reader.yml --branch "$BRANCH" --event workflow_dispatch --json databaseId --jq '[.[].databaseId] | max // 0')
              gh workflow run screen-reader.yml --ref "$BRANCH" -f source_sha="$sha"
            fi
            run=
            for _ in $(seq 60); do
              # The newest dispatched run for this exact commit created after this dispatch.
              run=$(gh run list --workflow screen-reader.yml --branch "$BRANCH" --json databaseId,headSha,event,createdAt --jq "[.[] | select(.event == \"workflow_dispatch\" and .headSha == \"$sha\" and .databaseId > $before)] | sort_by(.createdAt) | last | .databaseId // empty")
              [ -n "$run" ] && break
              sleep "${POLL_SECONDS:-5}"
            done
            [ -n "$run" ] || { echo "::error::The screen-reader lane did not start on $BRANCH ($sha)."; exit 1; }
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run"
            echo "Screen-reader lane, attempt $attempt: $url" >> "$GITHUB_STEP_SUMMARY"
            if gh run watch "$run" --exit-status --interval 30 >/dev/null; then
              verdict=$(gh run view "$run" --json conclusion,headSha --jq '"\(.conclusion) \(.headSha)"')
              [ "$verdict" = "success $sha" ] || { echo "::error::Screen-reader run $url concluded '$verdict', not success for $sha."; exit 1; }
              echo "VoiceOver and NVDA passed on $sha: $url"
              exit 0
            fi
            classes=$(gh run view "$run" --log-failed | grep -o 'SR_CLASS=[a-z]*' | sort -u | tr '\n' ' ' | sed 's/ $//' || true)
            if [ "$classes" != "SR_CLASS=infrastructure" ]; then
              echo "::error::The screen-reader lane failed on $sha (${classes:-unclassified}): $url. An accessibility failure blocks the release; fix main and run Release again."
              exit 1
            fi
            echo "::warning::The screen-reader lane could not drive its screen reader (attempt $attempt): $url"
          done
          issue=$(GH_REPO="$GITHUB_REPOSITORY" scripts/sr-infra-issue.sh "$url" "release $TAG" || true)
          echo "::error::The screen-reader lane failed twice on infrastructure, so $TAG is not tagged: ${issue:-$url}"
          exit 1
      - if: steps.check.outputs.new == 'true'
        name: Tag and publish the release
        run: |
          # The rehearsal this release rests on, written by "Check the version, the tag and main's CI":
          # without it nothing is tagged.
          [ -s "$RUNNER_TEMP/rehearsal.md" ] || { echo "::error::$RUNNER_TEMP/rehearsal.md, the rehearsal this release rests on, is missing, so $TAG is not tagged."; exit 1; }
          # The notes are assembled and measured before the tag exists: GitHub refuses a release
          # body over 125,000 characters, and a tag pushed without its release blocks a rerun.
          {
            echo "Install an item at this release, \`npx shadcn@latest add ourostack/ouro-ui/<item>#$TAG\`; its Ouro dependencies install from the same tag. Every install from GitHub needs a release tag: main has no registry.json, so an address without one fails. In an app with Tailwind CSS v4 and an \"@/*\" path alias, run shadcn's init once first, with the Base UI base:"
            echo
            echo '```sh'
            echo "npx shadcn@latest init --base base --preset nova --yes --no-monorepo"
            echo "npx shadcn@latest add ourostack/ouro-ui/ouro-base#$TAG ourostack/ouro-ui/dialog#$TAG"
            echo '```'
            echo
            echo "The tests, stories and specs are optional, one item per component: \`npx shadcn@latest add ourostack/ouro-ui/dialog#$TAG ourostack/ouro-ui/dialog-tests#$TAG\`, or \`ourostack/ouro-ui/ouro-tests#$TAG\` for all of them. List every item with \`npx shadcn@latest search 'ourostack/ouro-ui#$TAG'\`."
            echo
            # CHANGES.md, assembled on the release commit from changes/*.md, lists what this
            # release changes in behaviour ("Check the changes").
            sed -e '1s/^# /### /' CHANGES.md
            echo
            # Remove this note once v0.1.0 is no longer in use.
            # UPGRADING.md is the note (README.md and the site copy it); its {{latestRelease}}
            # placeholder gets this tag (scripts/latest-release.mjs), and the line that explains
            # the placeholder to readers of the raw file goes (scripts/upgrade-note.mjs rawHint), as does
            # the footnote mark that sources the title.
            sed -e '1s/^# \(.*\)\[\^[^]]*\]$/### \1/' -e '1s/^# /### /' -e '/^> \*\*Reading this file on GitHub?\*\*/,/^$/d' -e "s/{{latestRelease}}/$TAG/g" UPGRADING.md
            echo
            echo 'Or through the `@ouro` namespace, which serves the newest release: this one once Pages deploys. Add it to `components.json` once:'
            echo
            echo '```json'
            echo '"registries": { "@ouro": "https://ui.ouroboros.bot/r/{name}.json" }'
            echo '```'
            echo
            echo '```sh'
            echo 'npx shadcn@latest add @ouro/ouro-base @ouro/dialog'
            echo '```'
            echo
            # The rehearsal this release rests on and, when it ran on an earlier commit of main, the
            # files this one changes since ("Check the version, the tag and main's CI").
            cat "$RUNNER_TEMP/rehearsal.md"
            echo
            # By name only: with every description the list alone outgrew GitHub's limit.
            echo "Items, by name. The [docs](https://ui.ouroboros.bot/docs/) describe each component, and the tag's [registry.json](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/registry.json) holds every item's description:"
            echo
            jq -r '[.items[] | "`\(.name)`"] | join(", ")' registry.json
          } > "$RUNNER_TEMP/notes.md"
          # Bytes, never fewer than characters.
          size=$(( $(wc -c < "$RUNNER_TEMP/notes.md") ))
          if [ "$size" -gt 125000 ]; then
            echo "::error::The release notes are $size bytes, over GitHub's 125,000-character limit, so $TAG is not tagged. Shorten what release.yml prints into them."
            exit 1
          fi
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          git push origin --delete "$BRANCH"
      # Also when the job is cancelled, a timeout included.
      - if: (failure() || cancelled()) && steps.check.outputs.new == 'true'
        name: Clean up after a failure
        run: |
          git push origin --delete "$BRANCH" || true
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null && ! out=$(gh release view "$TAG" --json tagName 2>&1); then
            if grep -q 'release not found' <<<"$out"; then
              echo "::error::Tag $TAG was pushed but the release was not created. Delete the tag (git push origin :refs/tags/$TAG) and run Release again."
            else
              echo "::error::Could not check the release for $TAG: $out"
            fi
          fi
  pages:
    # Deploys Pages as soon as the tag is out and checks the @ouro namespace it serves, Pages' build
    # names GitHub's newest release, this one, whatever main says.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write # deploy Pages
    # The Pages deploy (5 minutes) and the check of what it serves, waiting up to 15 minutes: 20,
    # and 1.5 times that 30 (scripts/workflows.test.mjs).
    timeout-minutes: 30
    env:
      TAG: v${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies for the public proofs
        run: |
          pnpm i --frozen-lockfile
      - name: Deploy Pages and check the namespace it serves
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pages follows CI on a push to main, and no push happened here, so deploy it now.
          before=$(gh run list --workflow pages.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run pages.yml --ref main
          run=
          for _ in $(seq 24); do
            run=$(gh run list --workflow pages.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')
            [ "$run" != "$before" ] && break
            sleep "${POLL_SECONDS:-5}"
          done
          [ "$run" != "$before" ] || { echo "::error::Pages did not start. Run it by hand: gh workflow run pages.yml --ref main"; exit 1; }
          gh run watch "$run" --exit-status --interval 30
          unset GH_TOKEN
          # The @ouro namespace Pages now serves is this release, every item byte for byte as built
          # from the tag.
          node scripts/public-registry.mjs verify-live "$TAG" --wait 900
  publish:
    # Checks what is published: the site's llms.txt.
    needs: [release, pages]
    runs-on: ubuntu-latest
    permissions: {}
    # The check of the published page, waiting up to 15 minutes: 20, and 1.5 times that 30
    # (scripts/workflows.test.mjs).
    timeout-minutes: 30
    env:
      TAG: v${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Check what is published
        run: |
          # What people and agents read, the site's llms.txt: fail when an install command
          # there still names another release.
          node scripts/published-release.mjs "$TAG" --wait 900
  finish:
    # A release whose tag is out but whose main or Pages did not follow (a failed or cancelled job,
    # a timeout included, after the tag): an issue says so, and the run fails. Nothing to do when
    # no tag was pushed (the release job cleans up after itself) or the tag was already released.
    needs: [release, pages, publish]
    if: ${{ always() && needs.release.outputs.new != 'false' && (needs.release.result != 'success' || needs.pages.result != 'success' || needs.publish.result != 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # see whether the tag was pushed
      issues: write # report it
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ inputs.version }}
      RESULTS: "release: ${{ needs.release.result }}, pages: ${{ needs.pages.result }}, publish: ${{ needs.publish.result }}"
    steps:
      - name: Report a release main and Pages did not follow
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1 || { echo "No $TAG tag was pushed; nothing is published."; exit 0; }
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="$TAG is tagged, but Pages did not follow ($RESULTS): $url. Finish it by hand: deploy Pages (AGENTS.md, \"Pages and releases\")."
          gh issue create --title "Release $TAG: main or Pages did not follow" --body "$body" || echo "::warning::Could not open the issue."
          echo "::error::$body"
          exit 1
  next:
    # A run that Release auto dispatched with GITHUB_TOKEN starts no workflow_run when it ends, so
    # the release that follows is started from here, whatever this one's result, so a failed step cannot stall the train; Release auto's own checks decide.
    # The run id says this run no longer counts as a release in progress.
    needs: [release, pages, publish]
    if: ${{ always() && needs.release.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write # start Release auto
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Start the next release
        run: |
          gh workflow run release-auto.yml --ref main -f after="$GITHUB_RUN_ID"
