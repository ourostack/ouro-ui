name: Release
# Cuts v<version> from a commit of main whose own push runs passed: CI and the other workflows
# that report the checks main's rules require. The screen-reader lane (screen-reader.yml, on every
# push to main) is off the tag's path: it runs on the same commit right after, and when it fails,
# screen-reader-revert.yml reverts the pull request behind it, and that revert is released in turn.
# Release auto (release-auto.yml) names the newest such commit; a run
# dispatched by hand takes main's head. Nothing runs twice: the suite that tested the commit on
# main is the proof, and only release-only steps run here.
# The tag points at a release commit that main never receives: a branch
# off green main whose registry.json pins every same-repo registryDependency to the tag
# (scripts/registry.mts --release), so `shadcn add ourostack/ouro-ui/<item>#v<version>`
# installs every Ouro dependency at that tag while main stays unpinned. The @ouro namespace
# built from that commit must match its registry.json and files byte for byte
# (scripts/public-registry.mjs verify-build). When that passes, the commit is tagged, the
# GitHub release is created and the branch is deleted (the tag keeps the commit). Because
# main never receives the release commit, main keeps its change fragments: a release's notes list
# only the fragment lines that were not at the last release's tag (scripts/changes.mjs). Afterwards a pull
# request points main's docs at the release (docs-pin.yml), which this run starts and never waits
# for. The run deploys Pages (the pages job: Pages' build names the newest
# release in the site, llms.txt and the @ouro namespace) and last checks that the site's llms.txt
# names this release (scripts/published-release.mjs) and that Pages serves every @ouro item byte
# for byte as built from the tag (scripts/public-registry.mjs verify-live). The next release
# refuses to start while changes/ lists no change the last release lacks. Rerunning is safe: a
# released tag exits cleanly, a tag without a release fails with the fix, and a failed run deletes
# its branch. A tag out without Pages following opens an issue (the finish job).
# Recovery: contributing/releases.md, "Pages and releases".
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (for example 0.1.0)"
        required: true
      sha:
        description: "The commit of main to release (its full SHA); main's head when empty"
        required: false
# Each job asks for its own permissions.
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release branch and the tag, create the release
      actions: read # main's CI runs and their jobs, and the pull request run that proved the commit's tree
      pull-requests: read # the pull request merged as the commit (scripts/ci-proof.mjs)
    # Waiting for none of main's runs: reading them, the install, the release commit and the
    # namespace checks, 20 minutes, and 1.5 times that 30 (scripts/workflows.test.mjs, which holds
    # the numbers). Pages is a later job with its own.
    timeout-minutes: 30
    outputs:
      new: ${{ steps.check.outputs.new }}
      producers: ${{ steps.check.outputs.producers }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      SHA: ${{ inputs.sha }}
      TAG: v${{ inputs.version }}
      BRANCH: release/v${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - id: check
        name: Check the version, the tag and main's CI
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be x.y.z, without the v"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            if out=$(gh release view "$TAG" --json tagName 2>&1); then
              echo "::notice::$TAG is already released. Nothing to do."
              # The finish job reads this: a rerun for a released version pushed no tag of its own.
              echo "new=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Only a missing release means the tag is orphaned; any other error (a rate limit,
            # an API outage) must never lead to deleting a published tag.
            if grep -q 'release not found' <<<"$out"; then
              echo "::error::Tag $TAG exists but has no GitHub release. Delete the tag (git push origin :refs/tags/$TAG) and run Release again."
            else
              echo "::error::Could not check the release for $TAG: $out"
            fi
            exit 1
          fi
          # The commit to release: the one Release auto named, or main's head. It must be main's own,
          # an earlier commit of it when merges came after.
          sha=${SHA:-$(git rev-parse HEAD)}
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-character commit SHA, not '$sha'."; exit 1; }
          rel=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$sha" --jq .status) || { echo "::error::Could not compare $sha with main."; exit 1; }
          [ "$rel" = identical ] || [ "$rel" = behind ] || { echo "::error::$sha is not a commit of main ($rel)."; exit 1; }
          git fetch -q --depth=1 origin "$sha"
          git checkout -q --detach "$sha"
          # The workflows that report the checks main's rules require (CI, conformance exemptions:
          # scripts/required-producers.mjs), which this run dispatches where GITHUB_TOKEN starts none.
          producers=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" --jq '[.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context] | unique | .[]' | node scripts/required-producers.mjs) || { echo "::error::Could not tell which workflows report main's required checks."; exit 1; }
          echo "producers=$(echo $producers)" >> "$GITHUB_OUTPUT"
          echo "PRODUCERS=$(echo $producers)" >> "$GITHUB_ENV"
          # Main's runs of each on this commit: a push run, a dispatch on main, and the merge queue's run, which tested this very commit
          # before main fast-forwarded to it (the push run after it then skips every job but
          # install-github), and the pull request run whose tree-proof job passed on this commit's tree. A check main's rules require passes when one of them passed it
          # (scripts/required-ci.sh), whatever the runs' overall conclusions, which ci-budget's
          # failure would decide too.
          runs=
          for workflow in $producers; do
            ci=$(gh run list --workflow "$workflow" --commit "$sha" --json databaseId,event,headBranch --jq '[.[] | select((.headBranch == "main" and (.event == "push" or .event == "workflow_dispatch")) or .event == "merge_group" or (.event == "workflow_dispatch" and (.headBranch | startswith("gh-readonly-queue/main/")))) | .databaseId] | map(tostring) | join(" ")')
            [ -n "$ci" ] || { echo "::error::$workflow has not run on main ($sha)"; exit 1; }
            runs="$runs $ci"
          done
          # A push whose tree a pull request's run already passed in full skipped the jobs it ran
          # (scripts/ci-proof.mjs, ci.yml's tree-proof job): that run, found again here, is passed with main's.
          if [ -f scripts/ci-proof.mjs ]; then
            proof_out=$(mktemp)
            GITHUB_OUTPUT="$proof_out" node scripts/ci-proof.mjs "$sha"
            proof=$(sed -n 's/^proof-run=//p' "$proof_out")
            if [ -n "$proof" ]; then runs="$runs $proof"; fi
          fi
          # shellcheck disable=SC2086 # one argument per run
          scripts/required-ci.sh $runs || { echo "::error::CI on main ($sha) did not pass the checks main's rules require"; exit 1; }
          # install-github, the install a user runs today (`shadcn add` at the newest release tag), runs only in main's
          # own CI run (a push, or a dispatch on main), and the rules cannot require it: the queue's
          # run skips it. So when main has its own run on this commit, the newest must have passed it.
          own=$(gh run list --workflow ci.yml --commit "$sha" --json databaseId,event,headBranch --jq '[.[] | select(.headBranch == "main" and (.event == "push" or .event == "workflow_dispatch"))][0].databaseId // empty')
          if [ -n "$own" ]; then
            jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$own/jobs?per_page=100" --paginate --jq '.jobs[] | [.name, .conclusion] | @tsv') || { echo "::error::Could not read the jobs of run $own."; exit 1; }
            github=$(awk -F '\t' '$1 == "install-github" { print $2; exit }' <<<"$jobs")
            [ "$github" = success ] || { echo "::error::install-github is '${github:-not in the run}' in main's own CI run $own ($sha), not success: the install a user runs today must pass before a release."; exit 1; }
          fi
          # The screen-reader lane on this commit (screen-reader.yml, every push to main) runs after the tag, not before it; its run is named here.
          lane=$(gh run list --workflow screen-reader.yml --commit "$sha" --event push --json databaseId --jq '.[0].databaseId // empty')
          {
            echo "Tagged from main's commit \`$sha\`, which main's own runs passed, so nothing ran twice:"
            for id in $runs; do echo "- CI run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"; done
            if [ -n "$lane" ]; then echo "- Screen-reader lane (VoiceOver and NVDA), after the tag: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$lane"; fi
          } > "$RUNNER_TEMP/proof.md"
          cat "$RUNNER_TEMP/proof.md" >> "$GITHUB_STEP_SUMMARY"
          echo "MAIN_SHA=$sha" >> "$GITHUB_ENV"
          echo "new=true" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.new == 'true'
        id: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        continue-on-error: true
      # A setup that fails is tried once more (ourostack/ouro-ui#1911), as ci.yml does.
      - &pnpm-stalled
        name: pnpm setup failed; trying it once more (#1911)
        if: steps.pnpm.outcome == 'failure'
        run: echo "::warning title=pnpm setup failed::pnpm/action-setup could not install pnpm (ourostack/ouro-ui#1911); setting it up once more."
      - &pnpm-retry
        if: steps.pnpm.outcome == 'failure'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.check.outputs.new == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - if: steps.check.outputs.new == 'true'
        id: install
        run: pnpm i --frozen-lockfile
        continue-on-error: true
      - &pnpm-install-stalled
        name: pnpm install failed; trying it once more (#1914)
        if: steps.install.outcome == 'failure'
        run: echo "::warning title=pnpm install failed::pnpm i failed, which the 1ES feed's HTTP 429s can cause (ourostack/ouro-ui#1914); installing once more."
      - &pnpm-install-retry
        if: steps.install.outcome == 'failure'
        run: pnpm i --frozen-lockfile
      - if: steps.check.outputs.new == 'true'
        name: Check the changes
        run: |
          # Against the fragments at the newest release's tag, which that release or an earlier one
          # published (its notes alone hold only its own lines); against nothing before the first release.
          last=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          if [ -n "$last" ]; then
            git fetch --quiet --no-tags --depth=1 origin "refs/tags/$last:refs/tags/$last"
            node scripts/changes.mjs check changes --since "$last"
          else
            node scripts/changes.mjs check changes
          fi
      - if: steps.check.outputs.new == 'true'
        name: Push the release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          # The tagged commit names itself: its README, UPGRADING.md, llms.txt and site show $TAG,
          # its registry.json is released at $VERSION, and CHANGES.md holds this release's changes.
          scripts/release-commit.sh "$VERSION"
          git add CHANGES.md
          git commit -am "Release $TAG"
          # The release branch carries the released commit's workflow files, unchanged, and they must be main's tip's:
          # GitHub refuses a push by this token that adds or changes workflow content no branch holds (ourostack/ouro-ui#1951).
          # So nothing is pushed when release-commit.sh touched a workflow, or when main has moved its workflows past $MAIN_SHA;
          # Release auto releases a newer commit of main once its runs end.
          git fetch --quiet --no-tags --depth=1 origin main
          touched=$(git diff --name-only "$MAIN_SHA" HEAD -- .github/workflows)
          moved=$(git diff --name-only "$MAIN_SHA" FETCH_HEAD -- .github/workflows)
          if [ -n "$touched$moved" ]; then
            names=$(printf '%s\n' "$touched" "$moved" | grep . | sort -u | paste -sd' ' -)
            {
              echo "### Release not pushed: the workflow files differ"
              echo "GitHub refuses a push by this token that adds or changes workflow content no branch holds (ourostack/ouro-ui#1951)."
              if [ -n "$touched" ]; then
                echo "The release commit changes these workflow files, which release-commit.sh must never do:"
                printf '%s\n' "$touched" | sed 's/^/- /'
              fi
              if [ -n "$moved" ]; then
                echo "main's \`.github/workflows\` has moved past \`$MAIN_SHA\` (main is now \`$(git rev-parse --short FETCH_HEAD)\`), in these files:"
                printf '%s\n' "$moved" | sed 's/^/- /'
              fi
              echo "Release auto releases a newer commit of main once its runs end; a dispatch of this sha stops here."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::The workflow files of $MAIN_SHA and the release commit do not match main's: $names. GitHub refuses a push by this token that adds or changes workflow content no branch holds (ourostack/ouro-ui#1951). Release auto releases a newer commit of main once its runs end; nothing was pushed."
            exit 1
          fi
          git push --force origin "$BRANCH"
      - if: steps.check.outputs.new == 'true'
        name: Build and check the @ouro namespace for the release commit
        run: |
          # What Pages will serve at /r/ for this release: the namespace built from this commit
          # (scripts/namespace.sh), checked against the commit's registry.json and files byte for
          # byte, every item and no other (scripts/public-registry.mjs), before the tag.
          scripts/namespace.sh "$RUNNER_TEMP/ns" "$TAG"
          node scripts/public-registry.mjs verify-build "$RUNNER_TEMP/ns" HEAD
      - if: steps.check.outputs.new == 'true'
        name: Tag and publish the release
        run: |
          # The main runs this release rests on, written by "Check the version, the tag and main's CI":
          # without them nothing is tagged.
          [ -s "$RUNNER_TEMP/proof.md" ] || { echo "::error::$RUNNER_TEMP/proof.md, the main runs this release rests on, is missing, so $TAG is not tagged."; exit 1; }
          # The notes are assembled and measured before the tag exists: GitHub refuses a release
          # body over 125,000 characters, and a tag pushed without its release blocks a rerun.
          {
            echo "Install an item at this release, \`npx shadcn@latest add ourostack/ouro-ui/<item>#$TAG\`; its Ouro dependencies install from the same tag. Every install from GitHub needs a release tag: main has no registry.json, so an address without one fails. In an app with Tailwind CSS v4 and an \"@/*\" path alias, run shadcn's init once first, with the Base UI base:"
            echo
            echo '```sh'
            echo "npx shadcn@latest init --base base --preset nova --yes --no-monorepo"
            echo "npx shadcn@latest add ourostack/ouro-ui/ouro-base#$TAG ourostack/ouro-ui/dialog#$TAG"
            echo '```'
            echo
            echo "The tests, stories and specs are optional, one item per component: \`npx shadcn@latest add ourostack/ouro-ui/dialog#$TAG ourostack/ouro-ui/dialog-tests#$TAG\`, or \`ourostack/ouro-ui/ouro-tests#$TAG\` for all of them. List every item with \`npx shadcn@latest search 'ourostack/ouro-ui#$TAG'\`."
            echo
            # CHANGES.md, assembled on the release commit from changes/*.md, lists what this
            # release changes in behaviour ("Check the changes").
            sed -e '1s/^# /### /' CHANGES.md
            echo
            # Remove this note once v0.1.0 is no longer in use.
            # UPGRADING.md is the note (README.md and the site copy it); its {{latestRelease}}
            # placeholder gets this tag (scripts/latest-release.mjs), and the line that explains
            # the placeholder to readers of the raw file goes (scripts/upgrade-note.mjs rawHint), as does
            # the footnote mark that sources the title. Its footnotes go too, marks and definitions: they hold
            # the claims' checks (verify:...), which mean nothing to a reader, and they were a sixth of the
            # notes, which GitHub caps (ouro-ui#1329 tipped them over this repository's 100,000 guard).
            sed -e '1s/^# \(.*\)\[\^[^]]*\]$/### \1/' -e '1s/^# /### /' -e '/^> \*\*Reading this file on GitHub?\*\*/,/^$/d' -e '/^\[\^[^]]*\]:/d' -e 's/\[\^[^]]*\]//g' -e "s/{{latestRelease}}/$TAG/g" UPGRADING.md
            echo
            echo 'Or through the `@ouro` namespace, which serves the newest release: this one once Pages deploys. Add it to `components.json` once:'
            echo
            echo '```json'
            echo '"registries": { "@ouro": "https://ui.ouroboros.bot/r/{name}.json" }'
            echo '```'
            echo
            echo '```sh'
            echo 'npx shadcn@latest add @ouro/ouro-base @ouro/dialog'
            echo '```'
            echo
            # The main runs this release rests on ("Check the version, the tag and main's CI").
            cat "$RUNNER_TEMP/proof.md"
            echo
            # By name only: with every description the list alone outgrew GitHub's limit.
            echo "Items, by name. The [docs](https://ui.ouroboros.bot/docs/) describe each component, and the tag's [registry.json](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/registry.json) holds every item's description:"
            echo
            jq -r '[.items[] | "`\(.name)`"] | join(", ")' registry.json
          } > "$RUNNER_TEMP/notes.md"
          # Bytes, never fewer than characters.
          size=$(( $(wc -c < "$RUNNER_TEMP/notes.md") ))
          if [ "$size" -gt 125000 ]; then
            echo "::error::The release notes are $size bytes, over GitHub's 125,000-character limit, so $TAG is not tagged. Shorten what release.yml prints into them."
            exit 1
          fi
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          git push origin --delete "$BRANCH"
      # Also when the job is cancelled, a timeout included.
      - if: (failure() || cancelled()) && steps.check.outputs.new == 'true'
        name: Clean up after a failure
        run: |
          git push origin --delete "$BRANCH" || true
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null && ! out=$(gh release view "$TAG" --json tagName 2>&1); then
            if grep -q 'release not found' <<<"$out"; then
              echo "::error::Tag $TAG was pushed but the release was not created. Delete the tag (git push origin :refs/tags/$TAG) and run Release again."
            else
              echo "::error::Could not check the release for $TAG: $out"
            fi
          fi
  pages:
    # Deploys Pages as soon as the tag is out and checks the @ouro namespace it serves, Pages' build
    # names GitHub's newest release, this one, whatever main says.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write # deploy Pages
    # The Pages deploy (5 minutes) and the check of what it serves, waiting up to 15 minutes: 20,
    # and 1.5 times that 30 (scripts/workflows.test.mjs).
    timeout-minutes: 30
    env:
      TAG: v${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - id: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        continue-on-error: true
      - *pnpm-stalled
      - *pnpm-retry
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - id: install
        name: Install dependencies for the public proofs
        run: pnpm i --frozen-lockfile
        continue-on-error: true
      - *pnpm-install-stalled
      - *pnpm-install-retry
      - name: Deploy Pages and check the namespace it serves
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pages follows CI on a push to main, and no push happened here, so deploy it now.
          before=$(gh run list --workflow pages.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run pages.yml --ref main
          run=
          for _ in $(seq 24); do
            run=$(gh run list --workflow pages.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')
            [ "$run" != "$before" ] && break
            sleep "${POLL_SECONDS:-5}"
          done
          [ "$run" != "$before" ] || { echo "::error::Pages did not start. Run it by hand: gh workflow run pages.yml --ref main"; exit 1; }
          gh run watch "$run" --interval 30 || true
          conclusion=$(gh run view "$run" --json conclusion --jq .conclusion)
          case "$conclusion" in
            success) ;;
            cancelled)
              # GitHub keeps one pending run per concurrency group, so a newer Pages run for main (a push's) cancels this one
              # while it waits. That run deploys main, which names this release, so verify-live below waits for its deploy.
              newer=$(gh run list --workflow pages.yml --branch main --limit 10 --json databaseId --jq "[.[] | select(.databaseId > $run)] | length")
              [ "$newer" -gt 0 ] || { echo "::error::Pages run $run was cancelled, and no newer Pages run replaced it. Run it by hand: gh workflow run pages.yml --ref main"; exit 1; }
              echo "::notice::Pages run $run was replaced by a newer Pages run for main, so the namespace check waits for that deploy."
              ;;
            *) echo "::error::Pages run $run ended ${conclusion:-without a conclusion}. Run it by hand: gh workflow run pages.yml --ref main"; exit 1 ;;
          esac
          unset GH_TOKEN
          # The @ouro namespace Pages now serves is this release, every item byte for byte as built
          # from the tag.
          node scripts/public-registry.mjs verify-live "$TAG" --wait 900
  publish:
    # Checks what is published: the site's llms.txt.
    needs: [release, pages]
    runs-on: ubuntu-latest
    permissions: {}
    # The check of the published page, waiting up to 15 minutes: 20, and 1.5 times that 30
    # (scripts/workflows.test.mjs).
    timeout-minutes: 30
    env:
      TAG: v${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - id: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        continue-on-error: true
      - *pnpm-stalled
      - *pnpm-retry
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Check what is published
        run: |
          # What people and agents read, the site's llms.txt: fail when an install command
          # there still names another release.
          node scripts/published-release.mjs "$TAG" --wait 900
  finish:
    # A release whose tag is out but whose main or Pages did not follow (a failed or cancelled job,
    # a timeout included, after the tag): an issue says so, and the run fails. Nothing to do when
    # no tag was pushed (the release job cleans up after itself) or the tag was already released.
    needs: [release, pages, publish]
    if: ${{ always() && needs.release.outputs.new != 'false' && (needs.release.result != 'success' || needs.pages.result != 'success' || needs.publish.result != 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # see whether the tag was pushed
      issues: write # report it
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ inputs.version }}
      RESULTS: "release: ${{ needs.release.result }}, pages: ${{ needs.pages.result }}, publish: ${{ needs.publish.result }}"
    steps:
      - name: Report a release main and Pages did not follow
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1 || { echo "No $TAG tag was pushed; nothing is published."; exit 0; }
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="$TAG is tagged, but Pages did not follow ($RESULTS): $url. Finish it by hand: deploy Pages (contributing/releases.md, \"Pages and releases\")."
          gh issue create --title "Release $TAG: main or Pages did not follow" --body "$body" || echo "::warning::Could not open the issue."
          echo "::error::$body"
          exit 1
  next:
    # A run that Release auto dispatched with GITHUB_TOKEN starts no workflow_run when it ends, so
    # the release that follows is started from here once the tag is out; a release that failed before its tag starts nothing, so a failure cannot repeat itself, and the next push's green CI starts the next.
    # The run id says this run no longer counts as a release in progress.
    needs: [release, pages, publish]
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write # start Release auto
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Start the next release
        run: |
          gh workflow run release-auto.yml --ref main -f after="$GITHUB_RUN_ID"
  docs-pin:
    # Starts docs-pin.yml, which points main's docs at this release through a pull request. Only the
    # release's own result gates it, and nothing waits for it: a failure there changes no release.
    needs: release
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write # start Released, Docs pin and Ouro Current
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ inputs.version }}
    steps:
      # Released (released.yml) is the signal that a release is out, for what watches from outside this repository.
      - name: Say the release is out
        run: |
          gh workflow run released.yml --ref main -f tag="$TAG"
      - name: Start Docs pin
        run: |
          gh workflow run docs-pin.yml --ref main -f tag="$TAG"
      # Ouro Current (ouro-current.yml) moves the apps that pin Ouro UI to this release. A release this token publishes
      # starts no workflow of its own accord, so without this it waited for its next half-hourly run.
      - name: Start Ouro Current
        run: |
          gh workflow run ouro-current.yml --ref main
  attest:
    # Attaches the tag's registry.json to the release and attests it, so the file an install reads has
    # a signed subject that says which workflow and commit built it. A failure here changes no release.
    needs: release
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the file to the release
      id-token: write # sign the attestation
      attestations: write # store it
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ inputs.version }}
    steps:
      - name: Fetch the tag's registry.json
        run: |
          gh api -H "Accept: application/vnd.github.raw" "repos/$GH_REPO/contents/registry.json?ref=$TAG" > registry.json
          jq -e '.items | length > 0' registry.json >/dev/null
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: registry.json
      - name: Attach it to the release
        run: |
          gh release upload "$TAG" registry.json --clobber
