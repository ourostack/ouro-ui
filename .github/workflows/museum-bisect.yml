# PROBE (never merge): Chapter II museum latency before #329, after #329, after #330 and on main, on one runner each.
name: Museum bisect
on:
  pull_request:
permissions:
  contents: read
jobs:
  bisect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
      env:
        OURO_SYSTEM_PACKAGES: image
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4]
    name: bisect (${{ matrix.n }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ""
      - name: Bisect
        shell: bash
        run: |
          grep -m1 'model name' /proc/cpuinfo
          mkdir -p out
          declare -A sha=([a328]=b0503b28 [dmain]=bb78088a)
          for k in a328 dmain; do
            git worktree add -q "../w-$k" "${sha[$k]}"
            cp site/e2e/museum-probe.latency.spec.ts "../w-$k/site/e2e/"
            (cd "../w-$k" && pnpm i --frozen-lockfile > /dev/null 2>&1 && pnpm site:build > "$GITHUB_WORKSPACE/out/build-$k.log" 2>&1) || { echo "build $k failed"; tail -30 "out/build-$k.log"; exit 1; }
          done
          set +e
          for round in 1 2 3; do
            for k in a328 dmain; do
              cd "../w-$k"
              node_modules/.bin/vite preview --config site/vite.config.ts --host 127.0.0.1 --port 4179 --strictPort > /dev/null 2>&1 &
              pid=$!
              node -e 'const go=async()=>{for(let i=0;i<120;i++){try{if((await fetch("http://127.0.0.1:4179/")).ok)return;}catch{}await new Promise(r=>setTimeout(r,500));}process.exit(1)};go()'
              if [ $k = a328 ]; then v=plain,gutter; else v=plain,gutter,shadows,font; fi
              env CI= VARIANTS=$v pnpm exec playwright test --config playwright.latency.config.ts site/e2e/museum-probe.latency.spec.ts --repeat-each 2 --reporter=list > "$GITHUB_WORKSPACE/out/$k-$round.log" 2>&1
              grep -E "probe [a-z]+: widths" "$GITHUB_WORKSPACE/out/$k-$round.log" | sed -E "s/^.*probe /$k r$round /"
              kill $pid || true; wait $pid 2>/dev/null || true; sleep 1
              cd "$GITHUB_WORKSPACE"
            done
          done
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bisect-${{ matrix.n }}
          path: out/
