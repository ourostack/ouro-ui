name: Verify published release
# Runs the existing public proofs after a published tag needs manual main/Pages recovery; publishes nothing and uses protected main's scripts.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable tag to verify, matching main's recorded latest release
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: verify-published-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate the release tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Pass a stable release tag in vX.Y.Z form."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Check the published release and current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(node scripts/latest-release.mjs)" = "$TAG" ] || { echo "::error::Merge the release preparation PR before verifying $TAG."; exit 1; }
          release=$(gh release view "$TAG" --json isDraft,isPrerelease)
          jq -e '.isDraft == false and .isPrerelease == false' <<<"$release" >/dev/null || { echo "::error::$TAG must be a published stable release."; exit 1; }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - name: Verify published install commands
        run: node scripts/published-release.mjs "$TAG" --wait 900
      - name: Verify every served registry item against the tag
        run: node scripts/public-registry.mjs verify-live "$TAG" --wait 900
