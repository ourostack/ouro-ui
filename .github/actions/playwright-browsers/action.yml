name: Playwright browsers
description: >-
  Restores Playwright's browsers from the Actions cache, keyed on the runner's OS, image and
  architecture, Playwright's version and the browsers: WebKit's build differs per Ubuntu release,
  under the same folder name. Downloads them only on a miss, retrying the download with
  backoff (scripts/retry.sh), and saves them for the next job. Then installs their system packages,
  unless the job installs those itself. Run it after pnpm i.
inputs:
  browsers:
    description: The browsers, as `playwright install` takes them, separated by spaces.
    required: true
  system-packages:
    description: Whether to install the browsers' system packages (`playwright install-deps`) here.
    default: "true"
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        version=$(node -p 'require("playwright/package.json").version')
        set=$(tr ' ' '\n' <<<"$BROWSERS" | grep . | sort -u | paste -sd- -)
        # The runner's image (ubuntu24 on GitHub's runners), else the OS release it runs.
        image=${ImageOS:-}
        if [ -z "$image" ] && [ -r /etc/os-release ]; then image=$(. /etc/os-release && echo "${ID}${VERSION_ID}"); fi
        image=${image:-unknown}
        echo "key=playwright-${RUNNER_OS}-${image}-${RUNNER_ARCH}-${version}-${set}" >> "$GITHUB_OUTPUT"
    - id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
        key: ${{ steps.key.outputs.key }}
    # Downloads nothing when the cache had them.
    - shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        # Word splitting is wanted: one argument per browser.
        # shellcheck disable=SC2086
        scripts/retry.sh pnpm exec playwright install $BROWSERS
    - if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      # Another job may have saved the same key first.
      continue-on-error: true
      with:
        path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
        key: ${{ steps.key.outputs.key }}
    - if: inputs.system-packages == 'true'
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        # Word splitting is wanted: one argument per browser.
        # shellcheck disable=SC2086
        scripts/retry.sh pnpm exec playwright install-deps $BROWSERS
